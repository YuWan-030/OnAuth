<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>工作室组织空间管理 - OnAuth 云中台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        body { background-color: #f2f2f2; padding: 20px; }
        .layui-card-header { font-weight: bold; color: #333; }
        /* 弹出层表单微调，防止样式挤压 */
        .pop-form-box { padding: 20px 25px 10px 10px; }
    </style>
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">
            🏢 OnAuth 多租户架构 - 顶级组织空间/工作室 management 大厅
        </div>
        <div class="layui-card-body">

            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-sm layui-btn-normal" id="btn-add-group" lay-on="addGroupSpace">
                    <i class="layui-icon layui-icon-add-1"></i> 新增工作室主体
                </button>
            </div>

            <table class="layui-hide" id="groupTable" lay-filter="groupTable"></table>

        </div>
    </div>
</div>

<div id="addGroupTpl" style="display: none;">
    <div class="layui-form pop-form-box" lay-filter="formGroupData">
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:red;">*</span> 主体名称</label>
            <div class="layui-input-block">
                <input type="text" name="group_name" required lay-verify="required" placeholder="请输入全新工作室主体名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">运营说明</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="请输入该工作室主体的运营说明或备注信息..." class="layui-textarea"></textarea>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="switchTpl">
    {% raw %}
    <input type="checkbox" name="is_active" value="{{= d.id }}" lay-skin="switch" lay-text="正常|封禁" lay-filter="groupActiveSwitch" {{= d.is_active ? 'checked' : '' }}>
    {% endraw %}
</script>

<script type="text/html" id="barDemo">
    {% raw %}
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">物理移除</a>
    {% endraw %}
</script>

<script>
layui.use(['table', 'form', 'layer', 'util'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var util = layui.util;
    var $ = layui.$;

    console.log("🚀 OnAuth 核心视图 JS 引擎已成功在浏览器内存中建立授信！");

    // 🛡️ 全局 Ajax 安全卫士 (新增 403 越权拦截提示)
    $.ajaxSetup({
        complete: function(xhr, status) {
            var currentPath = window.location.pathname;
            if (currentPath === '/login' || this.url.indexOf('/token') !== -1) {
                return;
            }
            if (xhr.status === 403) {
                layer.alert(xhr.responseJSON?.detail || '⚠️ 安全合规熔断：您所在的权限组缺少此操作权限！', {icon: 2, title: '越权拦截'});
                return;
            }
            if (xhr.status === 401 || (xhr.responseText && xhr.responseText.indexOf('<!DOCTYPE html>') !== -1)) {
                window.top.location.href = '/login';
            }
        }
    });

    // 1. 核心网格联调：直接对接全量工作室列表
    table.render({
        elem: '#groupTable',
        url: '/admin/groups/list',
        cols: [[
            {field: 'id', title: '组织编号', width: 100, sort: true, align: 'center'},
            {field: 'group_name', title: '工作室/组织主体名称', width: 220, style: 'font-weight: bold; color: #009688;'},
            {field: 'description', title: '运营说明/备注信息', minWidth: 200},
            {field: 'is_active', title: '中台实时安全状态', width: 150, templet: '#switchTpl', align: 'center'},
            {fixed: 'right', title: '多维资产配置', toolbar: '#barDemo', width: 150, align: 'center'}
        ]],
        parseData: function(res){
            if (typeof res === 'string' || !Array.isArray(res)) {
                return { "code": 1, "msg": "认证会话震荡，正在同步凭证...", "count": 0, "data": [] };
            }
            return { "code": 0, "msg": "", "count": res.length, "data": res };
        },
        error: function(xhr, ts){
            console.error("❌ 网格加载遭遇致命阻断: ", ts, xhr.status);
        }
    });

    // 2. 🚨【全新重构】双输入框高级弹出层（创建时完美灌注备注信息）
    util.on('lay-on', {
        addGroupSpace: function(){
            console.log("🎯 检测到管理员触发了[新增工作室]指令，准备唤醒多维表单渲染引擎...");

            layer.open({
                type: 1,
                title: '🏢 开通全新工作室组织空间',
                area: ['460px', '320px'],
                content: $('#addGroupTpl').html(), // 捕获上方的表单节点
                btn: ['立即开通', '取消'],
                yes: function(index, layero){
                    // 使用 Layui 的 val 机制瞬时提取表单快照
                    var formData = form.val('formGroupData');

                    if(!formData.group_name.trim()){
                        layer.msg('工作室主体名称不能为空', {icon: 5, shift: 6});
                        return false;
                    }

                    layer.load(2);
                    $.ajax({
                        url: '/admin/groups',
                        type: 'POST',
                        data: JSON.stringify({
                            group_name: formData.group_name,
                            description: formData.description
                        }),
                        contentType: 'application/json',
                        success: function(res){
                            layer.closeAll('loading');
                            layer.close(index); // 关闭当前弹出层
                            layer.msg(res.msg || '新工作室主体注册成功！', {icon: 1});
                            table.reload('groupTable'); // 顺畅刷新网格看最新备注
                        },
                        error: function(err) {
                            layer.closeAll('loading');
                            if (err.responseJSON && err.responseJSON.detail) {
                                layer.msg(err.responseJSON.detail, {icon: 2});
                            } else {
                                layer.msg('创建失败，请检查后端网关状态', {icon: 2});
                            }
                        }
                    });
                },
                success: function(layero, index){
                    // 弹出层展现成功后清空一下历史残余数据
                    form.val('formGroupData', { "group_name": "", "description": "" });
                }
            });
        }
    });

    // 3. 监听前端“封禁开关”切换（承接 admin:update 权限）
    form.on('switch(groupActiveSwitch)', function(obj){
        var groupId = this.value;
        var isActive = obj.elem.checked;
        layer.load(2);
        $.ajax({
            url: '/admin/groups/' + groupId + '/toggle',
            type: 'POST',
            data: JSON.stringify({ is_active: isActive }),
            contentType: 'application/json',
            success: function(res){
                layer.closeAll('loading');
                layer.msg('中台资产防线已实时更新！', {icon: 1, time: 1000});
            },
            error: function(err){
                layer.closeAll('loading');
                obj.elem.checked = !isActive; // 恢复原始开关状态
                form.render('checkbox');
                // 如果是 403 已经在 ajaxSetup 处理了，非 403 在此弹窗
                if(err.status !== 403){
                    layer.msg('操作失败，管理权限校验不匹配！', {icon: 2});
                }
            }
        });
    });

    // 4. 监听行内编辑与删除按钮
    table.on('tool(groupTable)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            layer.confirm('⚠️ 危险：物理粉碎工作室 ['+ data.group_name +']？', {icon: 3, title:'资产粉碎确认'}, function(index){
                $.ajax({
                    url: '/admin/groups/' + data.id,
                    type: 'DELETE',
                    success: function(res){
                        layer.msg(res.msg || '该组织空间已被彻底粉碎抹除', {icon: 1});
                        obj.del();
                        layer.close(index);
                    },
                    error: function(err) {
                        if(err.status !== 403){
                            layer.msg('移除失败，请检查中台管理权限', {icon: 2});
                        }
                    }
                });
            });
        } else if(obj.event === 'edit'){
            // 🎯 【行内编辑修改备注】：完美承接你 admin.py 中的 @router.put("/groups/{group_id}/toggle")
            layer.prompt({
                title: '修改工作室 ['+ data.group_name +'] 的备注说明',
                value: data.description === '暂无说明' ? '' : data.description,
                formType: 2
            }, function(text, index){
                layer.load(2);
                $.ajax({
                    url: '/admin/groups/' + data.id + '/toggle',
                    type: 'PUT',
                    data: JSON.stringify({ is_active: data.is_active, description: text }),
                    contentType: 'application/json',
                    success: function(res){
                        layer.closeAll('loading');
                        layer.close(index);
                        layer.msg('备注信息更新成功！', {icon: 1});
                        table.reload('groupTable'); // 顺畅刷新网格看最新修改后的备注
                    },
                    error: function(err){
                        layer.closeAll('loading');
                        if(err.status !== 403){
                            layer.msg('修改失败，管理权限校验不匹配！', {icon: 2});
                        }
                    }
                });
            });
        }
    });
});
</script>
</body>
</html>
