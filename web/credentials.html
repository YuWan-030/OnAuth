<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>凭证与激活码管理 - OnAuth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        body { background-color: #f2f2f2; padding: 20px; }
        .layui-card-header { font-weight: bold; }
        .secret-box { background: #2f3542; color: #ff7f50; padding: 10px; font-family: monospace; border-radius: 4px; word-break: break-all; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-header">🔑 OnAuth 多租户架构 - 授权凭证与激活码大厅</div>
        <div class="layui-card-body">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-sm layui-btn-warm" id="btn-add-cred">
                    <i class="layui-icon layui-icon-key"></i> 签发新授权凭证
                </button>
            </div>
            <table class="layui-hide" id="credTable" lay-filter="credTable"></table>
        </div>
    </div>
</div>

<script type="text/html" id="switchTpl">
    {% raw %}
    <input type="checkbox" name="is_active" value="{{= d.client_id }}" lay-skin="switch" lay-text="正常|挂起" lay-filter="credActiveSwitch" {{= d.is_active ? 'checked' : '' }}>
    {% endraw %}
</script>

<script type="text/html" id="barDemo">
    {% raw %}
    <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="config">配置续期</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">物理吊销</a>
    {% endraw %}
</script>

<div id="addCredModal" style="display: none; padding: 20px;">
    <form class="layui-form" id="credForm" lay-filter="credForm">
        <div class="layui-form-item">
            <label class="layui-form-label">所属独立应用</label>
            <div class="layui-input-block">
                <select name="app_id" id="appSelect" lay-verify="required">
                    <option value="">-- 请选择关联的目标应用 --</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">凭证别名</label>
            <div class="layui-input-block">
                <input type="text" name="credential_name" lay-verify="required" placeholder="如：生产环境通道 / 体验版" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">权限Scope</label>
            <div class="layui-input-block">
                <input type="text" name="scope" value="read" lay-verify="required" placeholder="多个权限用空格隔开" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">有效天数</label>
            <div class="layui-input-block">
                <input type="number" name="valid_days" value="365" lay-verify="required" class="layui-input">
            </div>
        </div>
    </form>
</div>

<div id="configModal" style="display: none; padding: 20px;">
    <form class="layui-form" id="configForm" lay-filter="configForm">
        <input type="hidden" name="client_id">
        <div class="layui-form-item">
            <label class="layui-form-label">裁剪 Scope</label>
            <div class="layui-input-block">
                <input type="text" name="scope" lay-verify="required" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">追加天数</label>
            <div class="layui-input-block">
                <input type="number" name="add_days" value="30" lay-verify="required" class="layui-input">
            </div>
        </div>
    </form>
</div>

<script>
layui.use(['table', 'form', 'layer'], function(){
    var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.$;

    // 1. 数据网格初始化
    table.render({
        elem: '#credTable',
        url: '/admin/credentials/flat_list',
        // ❌ 彻底净化静态 token headers，自动通过浏览器底层的 HttpOnly Cookie 传递安全凭证进行动态鉴权
        cols: [[
            {field: 'id', title: '编号', width: 70, sort: true, align: 'center'},
            {field: 'group_name', title: '所属工作室', width: 140, style:'color:#722ed1;'},
            {field: 'app_name', title: '关联应用', width: 140, style:'color:#1e9fff;'},
            {field: 'credential_name', title: '凭证别名', width: 130},
            {field: 'client_id', title: 'Client ID (公钥)', width: 180, style:'font-family: monospace;'},
            {field: 'scope', title: 'Scope 作用域', width: 120},
            {field: 'expire_at', title: '到期时间', width: 170},
            {field: 'is_active', title: '安全控制', width: 100, templet: '#switchTpl', align: 'center'},
            {fixed: 'right', title: '资产操作', toolbar: '#barDemo', width: 175, align: 'center'}
        ]],
        parseData: function(res){ return { "code": 0, "msg": "", "count": res.length, "data": res }; },
        // ✨ 前端安全路由守卫：检测到网格由于登录会话过期返回 HTTP 401 时，强行执行全局阻断与降级
        error: function(res){
            if(res.status === 401){
                layer.msg('会话已失效或您尚未登录，请重新验证管理员身份！', {icon: 2, time: 1500}, function(){
                    window.top.location.href = '/login';
                });
            }
        }
    });

    // 2. 监听同步开关（启用/挂起）
    form.on('switch(credActiveSwitch)', function(obj){
        var clientId = this.value;
        var isActive = obj.elem.checked;
        $.ajax({
            url: '/admin/credentials/' + clientId + '/status',
            type: 'PUT',
            data: JSON.stringify({ is_active: isActive }),
            contentType: 'application/json',
            success: function(res){ layer.msg(res.msg || '安全防线状态已同步！', {icon: 1}); },
            error: function(err){
                obj.elem.checked = !isActive;
                form.render('checkbox');
                if(err.status === 401){
                    layer.msg('鉴权阻断，请登录后重试！', {icon: 2}, function(){ window.top.location.href = '/login'; });
                } else {
                    layer.msg('中台通信故障，同步失败', {icon: 2});
                }
            }
        });
    });

    // 3. 监听行按钮事件（配置续期与吊销）
    table.on('tool(credTable)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            layer.confirm('确定彻底吊销并抹除凭证 ['+data.credential_name+']？对应的第三方客户端将瞬间失去全部访问权限！', {icon: 3, title: '安全审计吊销确认'}, function(index){
                $.ajax({
                    url: '/admin/credentials/' + data.client_id,
                    type: 'DELETE',
                    success: function(res){ layer.msg(res.msg || '凭证已被物理吊销', {icon: 1}); obj.del(); layer.close(index); },
                    error: function(err) {
                        if(err.status === 401){
                            layer.msg('越权操作！请登录管理员账号', {icon: 2}, function(){ window.top.location.href = '/login'; });
                        } else {
                            layer.msg('吊销失败，管理凭证不匹配', {icon: 2});
                        }
                    }
                });
            });
        } else if(obj.event === 'config'){
            form.val('configForm', { "client_id": data.client_id, "scope": data.scope });

            layer.open({
                type: 1,
                title: '⚙️ 凭证资产配置与延期中心',
                content: $('#configModal'),
                area: ['450px', '260px'],
                btn: ['保存配置', '取消'],
                yes: function(index){
                    var confData = form.val('configForm');
                    $.ajax({
                        url: '/admin/credentials/' + confData.client_id + '/config?scope=' + encodeURIComponent(confData.scope) + '&add_days=' + confData.add_days,
                        type: 'PUT',
                        success: function(res){
                            layer.close(index);
                            layer.msg(res.msg || '配置同步成功！', {icon: 1});
                            table.reload('credTable');
                        },
                        error: function(err) {
                            if(err.status === 401){
                                layer.msg('会话已过期，请重新登录', {icon: 2}, function(){ window.top.location.href = '/login'; });
                            } else {
                                layer.msg('更新配置失败', {icon: 2});
                            }
                        }
                    });
                },
                end: function(){ $('#configModal').hide(); }
            });
        }
    });

    // 4. 签发凭证交互弹窗
    $('#btn-add-cred').on('click', function(){
        $('#appSelect').html('<option value="">-- 请选择关联的目标应用 --</option>');

        // 动态加载应用列表
        $.ajax({
            url: '/admin/apps/flat_list',
            type: 'GET',
            success: function(res){
                $.each(res, function(i, item){
                    if(item.is_active) {
                        $('#appSelect').append(new Option(item.group_name + " -> " + item.app_name, item.id));
                    }
                });
                form.render('select');
            },
            error: function(err){
                if(err.status === 401){
                    layer.msg('操作被拦截，请先登录管理员账户！', {icon: 2}, function(){ window.top.location.href = '/login'; });
                }
            }
        });

        layer.open({
            type: 1,
            title: '🔑 签发全新的商业授权凭证通道',
            content: $('#addCredModal'),
            area: ['500px', '380px'],
            btn: ['签发生成', '取消'],
            yes: function(layerIndex){
                var formData = form.val('credForm');
                if(!formData.app_id || !formData.credential_name) { layer.msg('请完整填写必填项'); return false; }

                $.ajax({
                    url: '/admin/apps/' + formData.app_id + '/credentials?credential_name=' + encodeURIComponent(formData.credential_name) + '&scope=' + encodeURIComponent(formData.scope) + '&valid_days=' + formData.valid_days,
                    type: 'POST',
                    success: function(res){
                        layer.close(layerIndex);
                        table.reload('credTable');

                        var resultHtml = '<div style="padding:20px; font-size:13px;">' +
                            '<p style="color:#2ed573; font-weight:bold; font-size:15px; margin-bottom:10px;">🎉 商业授权凭证签发成功！</p>' +
                            '<p><b>Client ID (应用公钥):</b></p><div class="secret-box">' + res.client_id + '</div>' +
                            '<p><b>Client Secret (密钥 · 仅展示一次，请妥善保存):</b></p><div class="secret-box">' + res.client_secret + '</div>' +
                            '<p><b>独立激活码 (OnAuth 特权 License Key):</b></p><div class="secret-box" style="max-height:100px; overflow-y:auto;">' + res.license_key + '</div>' +
                            '<p style="color:#ee5253;">* 请立刻复制上述凭证给对应开发者，关闭此窗口后 Secret 将彻底无法再次找回！</p></div>';

                        layer.open({
                            type: 1,
                            title: '🛡️ 核心敏感凭证快照明细',
                            content: resultHtml,
                            area: ['600px', '450px'],
                            btn: ['我已保存好'],
                            end: function(){ $('#credForm')[0].reset(); }
                        });
                    },
                    error: function(err){
                        if(err.status === 401){
                            layer.msg('操作已超时，请重新登录鉴权！', {icon: 2}, function(){ window.top.location.href = '/login'; });
                        } else {
                            layer.msg(err.responseJSON?.detail || '签发失败', {icon: 2});
                        }
                    }
                });
            },
            end: function(){ $('#addCredModal').hide(); }
        });
    });
});
</script>
</body>
</html>
