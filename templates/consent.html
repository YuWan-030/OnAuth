<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授权确认 - {{ app_name }}</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, rgba(34,197,94,0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(59,130,246,0.15), transparent 45%),
        linear-gradient(135deg, #0b1220, #111827);
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.2;
    pointer-events: none;
}

.card {
    width: 520px;
    padding: 40px;
    border-radius: 26px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
        0 40px 100px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    z-index: 1;
}

/* 🏢 资产徽标沙箱（彻底修复叠加与堆栈变形） */
.logo-container {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
}

/* 渐变几何方块，天然具备容错底色 */
.app-avatar {
    width: 100%;
    height: 100%;
    border-radius: 22px;
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* 强行锁死内部组件，防止溢出变形 */
}

/* 默认兜底火箭符号（无图时呈现，有图时利用 css 的层级天然覆盖） */
.default-rocket {
    font-size: 36px;
    user-select: none;
}

/* 真实应用图标展示层（全绝对定位，防坍塌死锁） */
.real-logo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
}

.shield-badge {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, #22c55e, #3b82f6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    border: 2px solid #111827;
    box-shadow: 0 4px 10px rgba(34,197,94,0.3);
    z-index: 2;
}

h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
}

.group-highlight {
    color: #a855f7;
    font-weight: bold;
}
.app-highlight {
    color: #22c55e;
    font-weight: bold;
}

.sub {
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 24px;
}

.risk-bar {
    padding: 12px 14px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-size: 12px;
    color: #fbbf24;
    line-height: 1.5;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.25);
}

.box {
    padding: 16px;
    border-radius: 18px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    transition: 0.2s;
}
.box:hover {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
}

.title {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.value-hierarchy {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
}
.arrow-separator {
    color: rgba(255,255,255,0.3);
    font-size: 12px;
}

.scope {
    color: #60a5fa;
    word-break: break-all;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 28px;
}

.btn {
    flex: 1;
    padding: 14px;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    outline: none;
}

.allow {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    box-shadow: 0 10px 25px rgba(34,197,94,0.25);
}
.allow:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(34,197,94,0.4);
}

.deny {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #f87171;
}
.deny:hover {
    background: rgba(248,113,113,0.12);
    border-color: rgba(248,113,113,0.3);
}

.footer {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo-container">
        <div class="app-avatar">
            <span class="default-rocket">🚀</span>

            <img src="{{ app_logo or '' }}" class="real-logo" onerror="this.style.display='none';" alt="">
        </div>
        <div class="shield-badge">🛡️</div>
    </div>

    <h1>应用授权确认</h1>
    <div class="sub">中台安全网关正在确权您的资源边界</div>

    <div class="risk-bar">
        ⚠️ 敏感授权防线：请确认您完全信任该独立软件，授权后该应用将代表您访问对应的云端业务接口资产。
    </div>

    <div class="box">
        <div class="title">当前登录账户</div>
        <div class="value" style="color: #e2e8f0;">{{ username }}</div>
    </div>

    <div class="box">
        <div class="title">申请访问的应用主体</div>
        <div class="value-hierarchy">
            <span class="group-highlight">{{ group_name }}</span>
            <span class="arrow-separator">➔</span>
            <span class="app-highlight">{{ app_name }}</span>
        </div>
    </div>

    <div class="box">
        <div class="title">请求权限范围 (Scope)</div>
        <div class="value scope">{{ scope }}</div>
    </div>

    <form action="/oauth/consent_submit" method="post">

        <input type="hidden" name="session_id" value="{{ session_id }}">
        <input type="hidden" name="client_id" value="{{ client_id }}">
        <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
        <input type="hidden" name="scope" value="{{ scope }}">
        <input type="hidden" name="state" value="{{ state }}">

        <div class="buttons">
            <button type="submit" name="action" value="allow" class="btn allow">
                同意并授权继续
            </button>

            <button type="submit" name="action" value="deny" class="btn deny">
                拒绝访问
            </button>
        </div>

    </form>

    <div class="footer">
        OnAuth Dual-Track Identity Gateway · Enterprise IAM Security
    </div>

</div>

</body>
</html>
