<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🚨 安全审计熔断 - OnAuth 云中台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* ==========================================================================
           全屏极客暗黑系背景
           ========================================================================== */
        body {
            background: radial-gradient(circle at 50% 50%, #1e293b, #0f172a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* 熔断卡片：科技感半透明悬浮面板 */
        .error-container {
            background: #ffffff;
            padding: 45px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 85%;
            border-top: 5px solid #ef4444; /* 核心警示红线 */
            position: relative;
            overflow: hidden;
        }

        /* 顶部微渐变流线反光（氛围灯效果） */
        .error-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ef4444, #f97316);
        }

        /* 图标动效 */
        .shield-icon {
            font-size: 56px;
            margin-bottom: 16px;
            animation: pulse 2s infinite ease-in-out;
        }

        /* 标题排版 */
        h1 {
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        /* ==========================================================================
           熔断元数据与状态码美化
           ========================================================================== */
        /* 状态码标签 */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #fef2f2;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            font-size: 11px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 700;
            margin: 12px 0 20px 0;
            letter-spacing: 0.5px;
        }

        /* 异常原因详情框 */
        .reason-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            text-align: left;
        }
        .reason-box p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #475569;
            word-break: break-all;
        }

        /* 提示说明 */
        .notice-text {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ==========================================================================
           安全流转控制动作
           ========================================================================== */
        .btn-return {
            display: block;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            padding: 11px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .btn-return:hover {
            opacity: 0.95;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
            transform: translateY(-1px);
        }
        .btn-return:active {
            transform: translateY(0);
        }

        /* 心跳脉冲动画，增强视觉警示效果 */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .header,
        .header-meta,
        .logo-area {
            min-width: 0;
        }
        .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        .logo-area {
            font-size: 15px !important;
        }
        .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open .side {
            transform: translateX(0);
        }
        .main,
        .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        .ruoyi-tab-container {
            height: auto !important;
        }
        .ruoyi-tab-container .layui-tab-title,
        .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .ruoyi-tab-content-wrapper,
        .layui-tab-content,
        .layui-tab-item,
        .admin-iframe {
            min-height: 70vh;
            height: auto !important;
            position: relative !important;
        }
        .layui-form-item {
            margin-bottom: 14px;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        body.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>
<body>

    <div class="error-container">
        <!-- 💡 警示图标 -->
        <div class="shield-icon">🛡️</div>

        <h1>中台安全熔断拦截</h1>

        <!-- 🎯 状态元数据 -->
        <div class="badge">EXCEPTION CODE: {{ status_code }}</div>

        <!-- 📝 核心风控详情 -->
        <div class="reason-box">
            <p><strong>审计原因：</strong>{{ detail }}</p>
        </div>

        <p class="notice-text">当前会话的资产授信流已被安全看门狗强制阻断。如确认属于合规越权或系统误判，请联系最高根管理员解除风控隔离。</p>

        <!-- 🚀 退出隔离区 -->
        <a href="/login" class="btn-return">返回安全授信中心</a>
    </div>

<script>
    /* onauth-global-ui */
    (function () {
        var versionText = "{{ APP_VERSION }}";
        var badge = document.getElementById("onauth-version-badge");
        if (badge) {
            badge.textContent = versionText;
        }
        var side = document.querySelector(".side");
        var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
        if (!side || !toggleBtn) {
            return;
        }
        document.body.classList.add("onauth-has-side");
        toggleBtn.addEventListener("click", function () {
            document.body.classList.toggle("onauth-mobile-nav-open");
        });
        document.addEventListener("click", function (evt) {
            if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                return;
            }
            if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                return;
            }
            document.body.classList.remove("onauth-mobile-nav-open");
        });
        window.addEventListener("resize", function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove("onauth-mobile-nav-open");
            }
        });
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
