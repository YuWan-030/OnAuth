<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook 接入 - OnAuth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body { margin: 0; padding: 16px; background: #f3f4f6; font-family: "Microsoft YaHei", sans-serif; }
        .card { background:#fff; border:1px solid #ebeef5; border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
        .btn-theme { background: linear-gradient(135deg,#2563eb,#1d4ed8) !important; border:none !important; border-radius:6px !important; }
        .layui-table th { background:#f8fafc !important; color:#475569 !important; }
        .form-box { padding: 14px 16px 0 6px; }
        .layui-form-label { width: 100px; }
        .layui-input-block { margin-left: 130px; }
        .tip { color:#64748b; font-size:12px; line-height:1.7; }
        .event-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-top: 6px; }
        .tag { display:inline-block; padding:2px 6px; border-radius:4px; background:#f1f5f9; border:1px solid #e2e8f0; font-family: monospace; font-size:11px; margin-right:4px; }
        .note { display:inline-block; margin-top: 4px; padding: 4px 10px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:12px; font-weight:700; }
        .template-tip { color:#64748b; font-size:12px; line-height:1.7; }
        .template-hidden { display:none; }
        .preset-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .header,
        .header-meta,
        .logo-area {
            min-width: 0;
        }
        .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        .logo-area {
            font-size: 15px !important;
        }
        .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open .side {
            transform: translateX(0);
        }
        .main,
        .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        .ruoyi-tab-container {
            height: auto !important;
        }
        .ruoyi-tab-container .layui-tab-title,
        .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .ruoyi-tab-content-wrapper,
        .layui-tab-content,
        .layui-tab-item,
        .admin-iframe {
            min-height: 70vh;
            height: auto !important;
            position: relative !important;
        }
        .layui-form-item {
            margin-bottom: 14px;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        body.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>
<body>
<div class="card">
    <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;">
        <div>
            <div style="font-size:16px; font-weight:700; color:#0f172a;">Webhook 接入中心</div>
            <div class="tip">当前只显示你拥有的订阅配置；可用于接收空间申请、审核、分配和应用事件。</div>
            <span class="note">没有 webhook 权限时会显示正常提示</span>
        </div>
        <button class="layui-btn btn-theme" id="btn-add-webhook"><i class="layui-icon layui-icon-add-1"></i> 新建 Webhook</button>
    </div>
    <table class="layui-hide" id="webhookTable" lay-filter="webhookTable"></table>
</div>

<div class="card" style="margin-top:14px;">
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px;">
        <select id="logWebhookFilter" class="layui-input" style="width:260px;">
            <option value="">全部投递日志</option>
        </select>
        <button class="layui-btn layui-btn-primary" id="btn-refresh-logs">刷新日志</button>
    </div>
    <table class="layui-hide" id="webhookLogTable"></table>
</div>

<div id="webhookTpl" style="display:none;">
    <form class="layui-form form-box" lay-filter="webhookForm">
        <div class="layui-form-item">
            <label class="layui-form-label">名称</label>
            <div class="layui-input-block"><input type="text" name="name" lay-verify="required" class="layui-input" placeholder="例如：空间审核回调"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">回调地址</label>
            <div class="layui-input-block"><input type="url" name="url" lay-verify="required|url" class="layui-input" placeholder="https://example.com/webhook"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">Secret</label>
            <div class="layui-input-block"><input type="text" name="secret" class="layui-input" placeholder="可选验签密钥"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">事件</label>
            <div class="layui-input-block event-grid">
                <input type="checkbox" value="tenant_space.apply" title="空间申请" lay-skin="primary" checked>
                <input type="checkbox" value="tenant_space.review" title="空间审核" lay-skin="primary" checked>
                <input type="checkbox" value="tenant_space.assign" title="空间分配" lay-skin="primary">
                <input type="checkbox" value="tenant_admin.create" title="管理员注册" lay-skin="primary">
                <input type="checkbox" value="tenant_app.create" title="应用创建" lay-skin="primary">
                <input type="checkbox" value="tenant_credential.create" title="凭证签发" lay-skin="primary">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">发送模板</label>
            <div class="layui-input-block">
                <select name="template_type" class="layui-input webhook-template-select">
                    <option value="onauth_default">OnAuth 默认 JSON</option>
                    <option value="wecom_markdown">企业微信 Markdown</option>
                    <option value="wecom_template_card">企业微信 文本通知模板卡片</option>
                    <option value="dingtalk_markdown">钉钉 Markdown</option>
                    <option value="feishu_text">飞书 Text</option>
                    <option value="custom_json">自定义 JSON 模板</option>
                </select>
                <div class="template-tip">模板变量: <code>{event_type}</code> <code>{sent_at}</code> <code>{payload_json}</code> <code>{payload_xxx}</code></div>
            </div>
        </div>

        <div class="layui-form-item template-hidden webhook-custom-template-wrap">
            <label class="layui-form-label">自定义模板</label>
            <div class="layui-input-block">
                <textarea name="custom_template" class="layui-textarea" style="min-height:120px;" placeholder='{"msg_type":"text","content":{"text":"事件 {event_type}\\n内容: {payload_json}"}}'></textarea>
                <div class="preset-row">
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs btn-template-preset" data-preset="wecom">企业微信示例</button>
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs btn-template-preset" data-preset="dingtalk">钉钉示例</button>
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs btn-template-preset" data-preset="feishu">飞书示例</button>
                </div>
            </div>
        </div>
    </form>
</div>

<script type="text/html" id="eventTpl">
{% raw %}
{{# layui.each(d.events, function(_, item){ }}<span class="tag">{{ window.webhookEventLabel(item) }}</span>{{# }); }}
{% endraw %}
</script>

<script type="text/html" id="statusTpl">
{% raw %}
<input type="checkbox" value="{{d.id}}" lay-skin="switch" lay-text="启用|停用" lay-filter="statusSwitch" {{ d.is_active ? 'checked' : '' }}>
{% endraw %}
</script>

<script type="text/html" id="toolTpl">
{% raw %}
<div style="display:flex;gap:6px;align-items:center;justify-content:center;">
    <button class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit">编辑</button>
    <button class="layui-btn layui-btn-xs" style="background:#0f766e;color:#fff;" lay-event="template">模板</button>
    <button class="layui-btn layui-btn-xs" style="background:#7c3aed;color:#fff;" lay-event="test">测试</button>
    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</button>
</div>
{% endraw %}
</script>

<script type="text/html" id="templateTpl">
{% raw %}
<span class="tag">{{ d.template_type || 'onauth_default' }}</span>
{% endraw %}
</script>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
<script>
layui.use(['table','form','layer','util'], function(){
    const table = layui.table, form = layui.form, layer = layui.layer, $ = layui.$;
    const util = layui.util;
    let WEBHOOK_EVENT_LABELS = {};

    const TEMPLATE_PRESETS = {
        wecom: {
            msgtype: 'markdown',
            markdown: {
                content: '**OnAuth 事件通知**\\n> 事件: `{event_type}`\\n> 时间: {sent_at}\\n> 明细: {payload_json}'
            }
        },
        dingtalk: {
            msgtype: 'markdown',
            markdown: {
                title: 'OnAuth {event_type}',
                text: '### OnAuth 事件通知\\n- 事件: `{event_type}`\\n- 时间: {sent_at}\\n- 明细: {payload_json}'
            }
        },
        feishu: {
            msg_type: 'text',
            content: {
                text: 'OnAuth 事件 {event_type}\\n时间: {sent_at}\\n明细: {payload_json}'
            }
        }
    };

    function normalizeTemplateType(raw) {
        const value = (raw || '').toString().trim();
        return value || 'onauth_default';
    }

    function webhookEventLabel(eventType) {
        const raw = (eventType || '').toString();
        const cn = WEBHOOK_EVENT_LABELS[raw];
        return cn ? `${cn} (${raw})` : raw;
    }
    window.webhookEventLabel = webhookEventLabel;

    function loadWebhookMeta(done) {
        $.ajax({
            url: '/api/v1/webhook/template.options',
            type: 'GET',
            dataType: 'json',
            success: function(res) {
                if (res && res.status === 'success' && res.event_labels && typeof res.event_labels === 'object') {
                    WEBHOOK_EVENT_LABELS = res.event_labels;
                }
            },
            complete: function() {
                if (typeof done === 'function') done();
            }
        });
    }

    function bindTemplateSelector(layero, options) {
        const templateOnly = !!(options && options.templateOnly);
        const $select = layero.find('.webhook-template-select');
        const $customWrap = layero.find('.webhook-custom-template-wrap');
        const $customTextarea = layero.find('textarea[name="custom_template"]');
        function refreshVisibility() {
            const isCustom = ($select.val() || '') === 'custom_json';
            $customWrap.toggleClass('template-hidden', !(isCustom || templateOnly));
            if ((isCustom || templateOnly) && !$customTextarea.val().trim()) {
                $customTextarea.val(JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2));
            }
        }
        $select.on('change', refreshVisibility);
        layero.find('.btn-template-preset').on('click', function(){
            const presetName = ($(this).data('preset') || '').toString();
            const preset = TEMPLATE_PRESETS[presetName];
            if (!preset) return;
            $select.val('custom_json');
            layero.find('textarea[name="custom_template"]').val(JSON.stringify(preset, null, 2));
            form.render('select');
            refreshVisibility();
        });
        refreshVisibility();
    }

    function collectDialogPayload(layero) {
        const name = layero.find('input[name="name"]').val().trim();
        const url = layero.find('input[name="url"]').val().trim();
        const secret = layero.find('input[name="secret"]').val().trim();
        const templateType = normalizeTemplateType(layero.find('select[name="template_type"]').val());
        let customTemplate = layero.find('textarea[name="custom_template"]').val().trim();
        const events = [];
        layero.find('.event-grid input[type="checkbox"]:checked').each(function(){ events.push($(this).val()); });

        if (!name || !url || events.length === 0) {
            layer.msg('名称、地址和事件至少选择一个', {icon: 2});
            return null;
        }
        if (templateType === 'custom_json' && !customTemplate) {
            customTemplate = JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2);
            layero.find('textarea[name="custom_template"]').val(customTemplate);
        }

        return {
            name,
            url,
            secret: secret || null,
            events,
            template_type: templateType,
            custom_template: templateType === 'custom_json' ? customTemplate : null
        };
    }

    function collectTemplateOnlyPayload(layero, rowData) {
        const templateType = normalizeTemplateType(layero.find('select[name="template_type"]').val());
        let customTemplate = layero.find('textarea[name="custom_template"]').val().trim();
        if (templateType === 'custom_json' && !customTemplate) {
            customTemplate = JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2);
            layero.find('textarea[name="custom_template"]').val(customTemplate);
        }
        return {
            id: rowData.id,
            template_type: templateType,
            custom_template: templateType === 'custom_json' ? customTemplate : null
        };
    }

    function openWebhookDialog(mode, rowData, options){
        const isEdit = mode === 'edit';
        const focusCustomTemplate = !!(options && options.focusCustomTemplate);
        const templateOnly = !!(options && options.templateOnly);
        layer.open({
            type: 1,
            title: templateOnly ? `编辑模板 #${rowData.id}` : (isEdit ? `编辑 Webhook #${rowData.id}` : '新建 Webhook'),
            area: templateOnly ? ['760px','700px'] : ['640px','700px'],
            content: $('#webhookTpl').html(),
            btn: [templateOnly ? '保存模板' : (isEdit ? '保存' : '创建'), '取消'],
            success: function(layero){
                form.render();
                bindTemplateSelector(layero, {templateOnly: templateOnly});
                if (templateOnly) {
                    layero.find('input[name="name"]').closest('.layui-form-item').hide();
                    layero.find('input[name="url"]').closest('.layui-form-item').hide();
                    layero.find('input[name="secret"]').closest('.layui-form-item').hide();
                    layero.find('.event-grid').closest('.layui-form-item').hide();
                }
                if (isEdit && rowData) {
                    layero.find('input[name="name"]').val(rowData.name || '');
                    layero.find('input[name="url"]').val(rowData.url || '');
                    layero.find('input[name="secret"]').val(rowData.secret || '');
                    layero.find('.event-grid input[type="checkbox"]').prop('checked', false);
                    (rowData.events || []).forEach(function(item){
                        layero.find('.event-grid input[value="' + item + '"]').prop('checked', true);
                    });
                    layero.find('select[name="template_type"]').val(normalizeTemplateType(rowData.template_type));
                    layero.find('textarea[name="custom_template"]').val(rowData.custom_template || '');
                    form.render();
                }
                if (focusCustomTemplate) {
                    const $select = layero.find('select[name="template_type"]');
                    if (normalizeTemplateType($select.val()) !== 'custom_json') {
                        $select.val('custom_json');
                    }
                    const $textarea = layero.find('textarea[name="custom_template"]');
                    if (!$textarea.val().trim()) {
                        $textarea.val(JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2));
                    }
                    form.render('select');
                }
                layero.find('.webhook-template-select').trigger('change');
                if (templateOnly) {
                    layero.find('textarea[name="custom_template"]').css('min-height', '360px');
                }
                if (focusCustomTemplate) {
                    setTimeout(function(){
                        layero.find('textarea[name="custom_template"]').trigger('focus');
                    }, 0);
                }
            },
            yes: function(index, layero){
                const payload = templateOnly ? collectTemplateOnlyPayload(layero, rowData) : collectDialogPayload(layero);
                if (!payload) return false;
                if (!templateOnly) {
                    payload.is_active = isEdit ? !!rowData.is_active : true;
                    if (isEdit) payload.id = rowData.id;
                }

                $.ajax({
                    url: isEdit ? '/api/v1/webhook/config.update' : '/api/v1/webhook/config.create',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function(res){
                        if (res.status === 'success') {
                            layer.msg(res.message || (isEdit ? '更新成功' : '创建成功'), {icon: 1});
                            layer.close(index);
                            loadTable();
                            loadLogTable();
                        } else {
                            layer.msg(res.message || (isEdit ? '更新失败' : '创建失败'), {icon: 2});
                        }
                    },
                    error: function(xhr){ layer.msg(xhr.responseJSON?.detail || (isEdit ? '更新失败' : '创建失败'), {icon: 2}); }
                });
            }
        });
    }

    function triggerTestPush(rowData) {
        layer.confirm(`对 [${rowData.name}] 发送一条模拟测试消息？`, function(index){
            $.ajax({
                url: '/api/v1/webhook/test.push',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({id: rowData.id}),
                success: function(res){
                    if (res.status === 'success') {
                        layer.msg(res.message || '测试推送已发起', {icon: 1});
                        loadLogTable();
                    } else {
                        layer.msg(res.message || '测试推送失败', {icon: 2});
                    }
                },
                error: function(xhr){ layer.msg(xhr.responseJSON?.detail || '测试推送失败', {icon: 2}); }
            });
            layer.close(index);
        });
    }

    $.ajaxSetup({
        complete: function(xhr) {
            const detail = xhr.responseJSON?.detail || xhr.responseJSON?.message || '';
            if (xhr.status === 401) {
                window.top.location.href = '/login';
                return;
            }
            if (xhr.status === 403 && detail) {
                layer.msg(detail, {icon: 2, time: 2500});
            }
        }
    });

    function loadTable(){
        table.render({
            elem: '#webhookTable',
            id: 'tenantWebhookTable',
            url: '/api/v1/webhook/config.list',
            page: false,
            parseData: function(res){
                const data = res.data || [];
                data.forEach(function(item){
                    item.template_type = normalizeTemplateType(item.template_type);
                });
                return {code: res.status === 'success' ? 0 : 500, msg: res.message || '', count: data.length, data: data};
            },
            cols: [[
                {field:'id', title:'ID', width:80},
                {field:'name', title:'名称', minWidth:160},
                {field:'url', title:'回调地址', minWidth:260},
                {field:'events', title:'事件', minWidth:240, templet:'#eventTpl'},
                {field:'template_type', title:'模板', width:140, templet:'#templateTpl'},
                {field:'is_active', title:'状态', width:120, templet:'#statusTpl'},
                {field:'creator_id', title:'创建者', width:120},
                {fixed:'right', title:'操作', width:270, toolbar:'#toolTpl'}
            ]],
            done: function(res){
                const rows = Array.isArray(res.data) ? res.data : [];
                const $filter = $('#logWebhookFilter');
                const selected = $filter.val() || '';
                $filter.empty().append('<option value="">全部投递日志</option>');
                rows.forEach(function(item){
                    $filter.append('<option value="' + item.id + '">' + item.name + ' (#' + item.id + ')</option>');
                });
                if (selected) {
                    $filter.val(selected);
                }
                form.render('select');
            }
        });
    }

    function loadLogTable(){
        const webhookId = ($('#logWebhookFilter').val() || '').trim();
        const reqUrl = webhookId ? '/api/v1/webhook/logs.list?webhook_id=' + encodeURIComponent(webhookId) : '/api/v1/webhook/logs.list';
        table.render({
            elem: '#webhookLogTable',
            id: 'tenantWebhookLogTable',
            url: reqUrl,
            page: false,
            parseData: function(res){
                const data = res.data || [];
                return {code: res.status === 'success' ? 0 : 500, msg: res.message || '', count: data.length, data: data};
            },
            cols: [[
                {field:'log_id', title:'日志ID', width:80},
                {field:'event_type', title:'事件', width:160},
                {field:'status_code', title:'HTTP', width:80},
                {field:'duration_ms', title:'耗时(ms)', width:90},
                {field:'is_success', title:'结果', width:90, templet: function(d){ return d.is_success ? '<span style="color:#15803d;">成功</span>' : '<span style="color:#b91c1c;">失败</span>'; }},
                {field:'response_body', title:'响应', minWidth:220, templet: function(d){ return util.escape((d.response_body || '-').slice(0, 200)); }},
                {field:'timestamp', title:'时间', width:170}
            ]]
        });
    }

    $('#btn-add-webhook').on('click', function(){
        openWebhookDialog('create', null);
    });

    form.on('switch(statusSwitch)', function(data){
        $.ajax({
            url: '/api/v1/webhook/config.update',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({id: parseInt(data.value, 10), is_active: data.elem.checked}),
            success: function(res){
                if (res.status !== 'success') layer.msg(res.message || '更新失败', {icon: 2});
                loadLogTable();
            },
            error: function(xhr){ layer.msg(xhr.responseJSON?.detail || '更新失败', {icon: 2}); loadTable(); }
        });
    });

    table.on('tool(webhookTable)', function(obj){
        if (obj.event === 'edit') {
            openWebhookDialog('edit', obj.data);
            return;
        }
        if (obj.event === 'template') {
            openWebhookDialog('edit', obj.data, {focusCustomTemplate: true, templateOnly: true});
            return;
        }
        if (obj.event === 'test') {
            triggerTestPush(obj.data);
            return;
        }
        if (obj.event === 'del') {
            layer.confirm(`确认删除 ${obj.data.name} ?`, function(index){
                $.ajax({
                    url: `/api/v1/webhook/config.delete?id=${obj.data.id}`,
                    type: 'DELETE',
                    success: function(res){
                        if (res.status === 'success') {
                            layer.msg(res.message || '删除成功', {icon: 1});
                            layer.close(index);
                            loadTable();
                            loadLogTable();
                        } else {
                            layer.msg(res.message || '删除失败', {icon: 2});
                        }
                    },
                    error: function(xhr){ layer.msg(xhr.responseJSON?.detail || '删除失败', {icon: 2}); }
                });
            });
        }
    });

    $('#btn-refresh-logs').on('click', function(){ loadLogTable(); });
    $('#logWebhookFilter').on('change', function(){ loadLogTable(); });

    loadWebhookMeta(function(){
        loadTable();
        loadLogTable();
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        var versionText = "{{ APP_VERSION }}";
        var badge = document.getElementById("onauth-version-badge");
        if (badge) {
            badge.textContent = versionText;
        }
        var side = document.querySelector(".side");
        var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
        if (!side || !toggleBtn) {
            return;
        }
        document.body.classList.add("onauth-has-side");
        toggleBtn.addEventListener("click", function () {
            document.body.classList.toggle("onauth-mobile-nav-open");
        });
        document.addEventListener("click", function (evt) {
            if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                return;
            }
            if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                return;
            }
            document.body.classList.remove("onauth-mobile-nav-open");
        });
        window.addEventListener("resize", function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove("onauth-mobile-nav-open");
            }
        });
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
