<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租户概览 - OnAuth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        body { background: #f3f4f6; padding: 15px; font-family: "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
        .layui-fluid { padding: 0; }
        .layui-card { background: #fff; border: 1px solid #ebeef5; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        .title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .item { flex: 1; min-width: 220px; padding: 12px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .label { color: #64748b; font-size: 12px; margin-bottom: 6px; }
        .value { color: #111827; font-size: 15px; font-weight: 700; word-break: break-all; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-theme { background: linear-gradient(135deg, #2563eb, #1d4ed8) !important; border: none !important; border-radius: 6px !important; }
        .btn-light { border-radius: 6px !important; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .status-pending { background: #fef3c7; color: #b45309; }
        .status-approved { background: #dcfce7; color: #15803d; }
        .status-rejected { background: #fee2e2; color: #b91c1c; }
        .status-unknown { background: #e2e8f0; color: #334155; }
        .top-note { display:inline-block; margin-top: 4px; padding: 4px 10px; border-radius: 999px; background:#eef2ff; color:#4338ca; font-size:12px; font-weight:700; }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 3010;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(10px);
        cursor: pointer;
    }
    .onauth-burger,
    .onauth-burger::before,
    .onauth-burger::after {
        display: block;
        width: 16px;
        height: 2px;
        border-radius: 2px;
        background: #ffffff;
        content: "";
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .onauth-burger {
        position: relative;
        margin: 0 auto;
    }
    .onauth-burger::before {
        position: absolute;
        left: 0;
        top: -5px;
    }
    .onauth-burger::after {
        position: absolute;
        left: 0;
        top: 5px;
    }
    body.onauth-mobile-nav-open .onauth-burger {
        background: transparent;
    }
    body.onauth-mobile-nav-open .onauth-burger::before {
        top: 0;
        transform: rotate(45deg);
    }
    body.onauth-mobile-nav-open .onauth-burger::after {
        top: 0;
        transform: rotate(-45deg);
    }
    .onauth-mobile-mask {
        display: none;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        body:not(.onauth-shell) {
            padding: 10px !important;
        }
        .layui-fluid,
        .layui-container {
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        .layui-card {
            margin-bottom: 12px;
            border-radius: 12px;
        }
        .layui-card-header {
            min-height: 40px;
            height: auto !important;
            line-height: 1.4 !important;
            padding: 10px 12px !important;
        }
        .layui-card-body {
            padding: 12px !important;
        }
        .layui-btn {
            height: 34px;
            line-height: 34px;
            padding: 0 10px;
            font-size: 13px;
        }
        .layui-btn + .layui-btn {
            margin-left: 6px;
        }
        .layui-inline {
            display: block !important;
            margin-right: 0 !important;
            margin-bottom: 8px;
        }
        .layui-input-inline,
        .layui-form-select,
        .layui-textarea {
            width: 100% !important;
        }
        .layui-layer {
            max-width: 94vw !important;
            max-height: 90vh !important;
            left: 3vw !important;
        }
        .layui-layer-page .layui-layer-content {
            overflow: auto !important;
        }
        .layui-table-view,
        .layui-table-box,
        .layui-table-body,
        .layui-table-main {
            overflow-x: auto !important;
        }
        /* Mobile: disable duplicated fixed columns to avoid data being covered */
        .layui-table-fixed,
        .layui-table-fixed-l,
        .layui-table-fixed-r,
        .layui-table-patch {
            display: none !important;
        }
        .layui-table-view .layui-table-box {
            overflow-x: auto !important;
        }
        .layui-table-cell {
            height: auto !important;
            line-height: 1.5 !important;
        }
        .layui-table-cell .layui-btn {
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area,
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: 52px !important;
            min-height: 52px;
            padding: 6px 10px 6px 50px !important;
            gap: 8px;
            flex-wrap: nowrap;
            align-items: center;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            flex: 1;
            max-width: calc(100% - 86px);
            font-size: 13px !important;
            line-height: 1;
        }
        body.onauth-shell .logo-area > div:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .logo-icon {
            width: 26px !important;
            height: 26px !important;
            margin-right: 6px !important;
            font-size: 14px !important;
        }
        body.onauth-shell .header-meta .pill,
        body.onauth-shell .tenant-user-area #tenant-name,
        body.onauth-shell .tenant-user-area #tenant-status,
        body.onauth-shell .user-info-area #tenant-pill {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item,
        body.onauth-shell .tenant-user-area .layui-nav-item {
            line-height: 32px !important;
        }
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            margin-right: 8px;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a,
        body.onauth-shell .tenant-user-area .layui-nav-item > a {
            width: 72px !important;
            min-width: 72px !important;
            max-width: 72px !important;
            padding: 0 18px 0 6px !important;
            font-size: 12px !important;
            justify-content: flex-start !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a span,
        body.onauth-shell .tenant-user-area .layui-nav-item > a span {
            display: inline-block !important;
            max-width: 2.6em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a i,
        body.onauth-shell .tenant-user-area .layui-nav-item > a i {
            margin-right: 4px !important;
        }
        body.onauth-shell .user-info-area .layui-nav .layui-nav-more,
        body.onauth-shell .tenant-user-area .layui-nav .layui-nav-more {
            right: 2px !important;
        }
        body.onauth-shell .user-info-area .layui-nav-child,
        body.onauth-shell .tenant-user-area .layui-nav-child {
            left: auto !important;
            right: 0 !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(74vw, 250px) !important;
            max-width: 250px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            box-shadow: 14px 0 28px rgba(15, 23, 42, 0.22);
            z-index: 3005 !important;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            background: rgba(31, 41, 55, 0.97) !important;
            backdrop-filter: blur(10px);
        }
        body.onauth-shell .side-menu {
            width: 100% !important;
        }
        body.onauth-shell .side-menu .layui-nav-item > a,
        body.onauth-shell .side-menu .layui-nav-child dd a {
            padding-left: 14px !important;
            font-size: 13px !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            height: 36px !important;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
            padding-right: 0 !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab .layui-tab-bar,
        body.onauth-shell .layui-tab .layui-tab-bar {
            display: none !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title::-webkit-scrollbar,
        body.onauth-shell .layui-tab-title::-webkit-scrollbar {
            display: none;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li,
        body.onauth-shell .layui-tab-title li {
            line-height: 36px !important;
            height: 36px !important;
            padding: 0 10px !important;
            font-size: 13px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close,
        body.onauth-shell .layui-tab-title li .layui-tab-close {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            border-radius: 999px;
            color: #64748b !important;
            background: rgba(148, 163, 184, 0.18);
            font-size: 12px;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover,
        body.onauth-shell .layui-tab-title li .layui-tab-close:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.88);
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: calc(100vh - 100px);
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        body.onauth-shell .onauth-mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            z-index: 3003;
        }
        body.onauth-mobile-nav-open.onauth-shell .onauth-mobile-mask {
            display: block;
        }
        body.onauth-mobile-nav-open.onauth-shell {
            overflow: hidden !important;
        }
    }
</style>
</head>
<body>
<div class="layui-card">
    <div class="title">当前账号</div>
    <div class="row">
        <div class="item"><div class="label">用户名</div><div class="value" id="username">-</div></div>
        <div class="item"><div class="label">昵称</div><div class="value" id="nickname">-</div></div>
        <div class="item"><div class="label">角色</div><div class="value" id="roles">-</div></div>
    </div>
</div>

<div class="layui-card">
    <div class="title">租户空间状态</div>
    <div class="top-note" id="group-note">空间信息加载中...</div>
    <div class="row">
        <div class="item"><div class="label">空间名称</div><div class="value" id="group-name">-</div></div>
        <div class="item"><div class="label">空间识别码</div><div class="value" id="group-code">-</div></div>
        <div class="item"><div class="label">审批状态</div><div class="value"><span id="group-status" class="status-badge status-unknown">UNKNOWN</span></div></div>
        <div class="item"><div class="label">到期时间</div><div class="value" id="group-expire-at">-</div></div>
        <div class="item"><div class="label">审批备注</div><div class="value" id="group-review-note">-</div></div>
    </div>
</div>

<div class="layui-card">
    <div class="title">快捷入口</div>
    <div class="actions">
        <button class="layui-btn btn-theme" id="btn-apps">管理应用</button>
        <button class="layui-btn layui-btn-primary btn-light" id="btn-creds">管理凭证</button>
        <button class="layui-btn layui-btn-primary btn-light" id="btn-users">邀请成员</button>
        <button class="layui-btn layui-btn-primary btn-light" id="btn-sessions">在线会话</button>
        <button class="layui-btn layui-btn-primary btn-light" id="btn-copy-code">复制识别码</button>
    </div>
</div>

<script>
layui.use(['layer'], function(){
    const layer = layui.layer, $ = layui.$;

    $.ajaxSetup({
        complete: function(xhr) {
            const detail = xhr.responseJSON?.detail || xhr.responseJSON?.message || '';
            if (xhr.status === 401) {
                window.top.location.href = '/login';
                return;
            }
            if (xhr.status === 403 && detail) {
                layer.msg(detail, {icon: 2, time: 2500});
            }
        }
    });

    function setStatusBadge(status) {
        const badge = $('#group-status');
        const normalized = (status || 'unknown').toLowerCase();
        badge.removeClass('status-pending status-approved status-rejected status-unknown');
        if (normalized === 'pending') badge.addClass('status-pending').text('PENDING');
        else if (normalized === 'approved') badge.addClass('status-approved').text('APPROVED');
        else if (normalized === 'rejected') badge.addClass('status-rejected').text('REJECTED');
        else badge.addClass('status-unknown').text(normalized.toUpperCase());
    }

    function loadProfile() {
        $.get('/auth/me', function(res){
            if (res.status !== 'success') {
                layer.msg(res.message || '加载失败', {icon: 2});
                return;
            }
            const data = res.data || {};
            $('#group-note').text(data.group_name ? '空间已绑定，点击下方功能快速进入管理' : '当前账号尚未创建空间，请先申请创建空间');
            $('#username').text(data.username || '-');
            $('#nickname').text(data.nickname || '-');
            $('#roles').text((data.roles || []).join(', ') || '-');
            $('#group-name').text(data.group_name || '-');
            $('#group-code').text(data.group_code || '-');
            $('#group-expire-at').text(data.group_expire_at || '永久有效/待审批');
            $('#group-review-note').text(data.group_review_note || '-');
            setStatusBadge(data.group_status);
        }).fail(function(){
            layer.msg('用户画像加载失败', {icon: 2});
        });
    }

    loadProfile();

    $('#btn-apps').on('click', function(){ window.location.href = '/tenant/apps'; });
    $('#btn-creds').on('click', function(){ window.location.href = '/tenant/credentials'; });
    $('#btn-users').on('click', function(){ window.location.href = '/tenant/users'; });
    $('#btn-sessions').on('click', function(){ window.location.href = '/tenant/sessions'; });
    $('#btn-copy-code').on('click', function(){
        const code = $('#group-code').text().trim();
        if (!code || code === '-') return layer.msg('暂无租户识别码', {icon: 4});
        navigator.clipboard?.writeText(code).then(function(){
            layer.msg('识别码已复制', {icon: 1});
        }).catch(function(){
            window.prompt('复制租户识别码：', code);
        });
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            var mask = document.createElement("div");
            mask.className = "onauth-mobile-mask";
            document.body.appendChild(mask);
            function closeMobileNav() {
                document.body.classList.remove("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
            function toggleMobileNav() {
                var willOpen = !document.body.classList.contains("onauth-mobile-nav-open");
                document.body.classList.toggle("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.addEventListener("click", toggleMobileNav);
            mask.addEventListener("click", closeMobileNav);
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                closeMobileNav();
            });
            side.addEventListener("click", function (evt) {
                // Only collapse drawer when a child menu item is clicked.
                var childMenuLink = evt.target.closest(".layui-nav-child dd a");
                if (childMenuLink) {
                    closeMobileNav();
                }
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    closeMobileNav();
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation"><span class="onauth-burger" aria-hidden="true"></span></button>
</body>
</html>
