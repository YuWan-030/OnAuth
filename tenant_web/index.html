<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnAuth - 租户中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #f3f4f6; font-family: "Microsoft YaHei", sans-serif; }
        .header {
            height: 60px; background: #0f172a; color: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 999;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .logo-badge { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#2563eb,#1d4ed8); display: flex; align-items: center; justify-content: center; }
        .header-meta { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.85); font-size: 13px; }
        .pill { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.08); }
        .pill.ok { background: rgba(34,197,94,.16); color: #86efac; }
        .pill.warn { background: rgba(245,158,11,.16); color: #fde68a; }
        .pill.muted { background: rgba(148,163,184,.16); color: #cbd5e1; }
        .tenant-user-area .layui-nav { background: transparent; padding: 0; }
        .tenant-user-area .layui-nav-item { line-height: 60px; }
        .tenant-user-area .layui-nav-item > a { color: #fff !important; padding: 0 12px !important; font-size: 14px; }
        .tenant-user-area .layui-nav-child a { color: #333 !important; }
        .logout-btn-icon { margin-right: 5px; color: #ff5722; }
        .pwd-btn-icon { margin-right: 5px; color: #1e9fff; }
        .side {
            position: fixed; top: 60px; left: 0; bottom: 0; width: 230px; background: #111827; overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,.05);
        }
        .main { position: fixed; left: 230px; top: 60px; right: 0; bottom: 0; background: #f3f4f6; }
        .iframe-page { width: 100%; height: 100%; border: none; background: #fff; }
        .layui-nav-tree { background: transparent !important; width: 230px; }
        .layui-nav-tree .layui-nav-item > a { color: rgba(255,255,255,.82) !important; height: 48px; line-height: 48px; }
        .layui-nav-tree .layui-nav-item > a:hover { background: rgba(255,255,255,.04); }
        .layui-nav-tree .layui-this > a { background: linear-gradient(90deg,#2563eb,#1d4ed8) !important; color: #fff !important; }
        .layui-nav-tree .layui-nav-child { background: rgba(0,0,0,.18) !important; }
        .layui-nav-tree .layui-nav-child dd a { color: rgba(255,255,255,.72) !important; padding-left: 48px; height: 42px; line-height: 42px; }
    </style>
</head>
<body>
<div class="header">
    <div class="logo"><div class="logo-badge">🏢</div>OnAuth 租户中心</div>
    <div class="header-meta">
        <span class="pill" id="tenant-name">租户未加载</span>
        <span class="pill" id="tenant-status">状态未知</span>
        <div class="tenant-user-area">
            <ul class="layui-nav">
                <li class="layui-nav-item">
                    <a href="javascript:;" id="current-user">未登录</a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:;" id="btn-change-password"><i class="layui-icon layui-icon-password pwd-btn-icon"></i>修改密码</a></dd>
                        <dd><a href="javascript:;" id="btn-logout"><i class="layui-icon layui-icon-logout logout-btn-icon"></i>退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="side">
    <ul class="layui-nav layui-nav-tree" lay-filter="tenant-nav">
        <li class="layui-nav-item layui-this"><a href="javascript:;" data-src="/tenant/profile">概览</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/apply">申请创建空间</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/apps">应用管理</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/credentials">凭证管理</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/users">成员邀请</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/audit">操作日志</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/webhook">Webhook 接入</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-src="/tenant/settings">空间设置</a></li>
    </ul>
</div>
<div class="main">
    <iframe id="tenant-frame" class="iframe-page" src="/tenant/profile"></iframe>
</div>
<div id="pwd-dialog-template" style="display:none;">
    <div class="layui-form" lay-filter="tenantPwdForm">
        <div class="layui-form-item">
            <label class="layui-form-label">当前密码</label>
            <div class="layui-input-block"><input type="password" name="current_password" class="layui-input" placeholder="请输入当前密码"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">新密码</label>
            <div class="layui-input-block"><input type="password" name="new_password" class="layui-input" placeholder="请输入新密码"></div>
        </div>
    </div>
</div>

<script>
layui.use(['element', 'layer', 'form'], function(){
    const element = layui.element, layer = layui.layer, form = layui.form, $ = layui.$;

    $.ajaxSetup({
        complete: function(xhr) {
            const detail = xhr.responseJSON?.detail || xhr.responseJSON?.message || '';
            if (xhr.status === 401) {
                window.top.location.href = '/login';
                return;
            }
            if (xhr.status === 403 && detail) {
                layer.msg(detail, {icon: 2, time: 2500});
            }
        }
    });

    function setPill(selector, text, cls) {
        $(selector).removeClass('ok warn muted').addClass(cls || 'muted').text(text);
    }

    function loadProfile() {
        $.get('/auth/me', function(res){
            if (res.status !== 'success') {
                layer.msg(res.message || '租户信息加载失败', {icon: 2});
                return;
            }
            const data = res.data || {};
            $('#current-user').text(data.nickname || data.username || '租户管理员');
            if (data.group_name) {
                $('#tenant-name').text(data.group_name);
            } else {
                $('#tenant-name').text('尚未创建空间');
            }
            const status = (data.group_status || 'unknown').toLowerCase();
            const isActive = data.group_is_active !== false;
            if (status === 'approved' && isActive) setPill('#tenant-status', 'APPROVED', 'ok');
            else if (status === 'approved' && !isActive) setPill('#tenant-status', 'FUSED', 'warn');
            else if (status === 'pending') setPill('#tenant-status', 'PENDING', 'warn');
            else if (status === 'rejected') setPill('#tenant-status', 'REJECTED', 'warn');
            else setPill('#tenant-status', (data.group_status || 'unknown').toUpperCase(), 'muted');
        }).fail(function(){
            layer.msg('租户信息加载失败', {icon: 2});
        });
    }

    loadProfile();

    $('#btn-change-password').on('click', function(){
        const dlg = layer.open({
            type: 1,
            title: '修改当前账户密码',
            area: ['440px','300px'],
            content: $('#pwd-dialog-template').html(),
            btn: ['确认修改', '取消'],
            success: function(layero){
                form.render(null, 'tenantPwdForm');
                layero.find('.layui-layer-btn0').css({
                    'background': 'linear-gradient(135deg,#2563eb,#1d4ed8)',
                    'border-color': '#2563eb'
                });
            },
            yes: function(index, layero){
                const current_password = layero.find('input[name="current_password"]').val().trim();
                const new_password = layero.find('input[name="new_password"]').val().trim();
                if (!current_password || !new_password) {
                    layer.msg('密码不能为空', {icon: 2});
                    return false;
                }
                if (new_password.length < 6) {
                    layer.msg('新密码至少6位', {icon: 2});
                    return false;
                }
                $.ajax({
                    url: '/auth/change_password',
                    type: 'POST',
                    data: { current_password: current_password, new_password: new_password },
                    success: function(res){
                        if (res.status === 'success') {
                            layer.close(index);
                            layer.alert('密码修改成功，请重新登录', {icon: 1, title: '系统通知', closeBtn: 0}, function(){
                                $.post('/auth/logout', function(){
                                    window.location.href = '/login';
                                });
                            });
                        } else {
                            layer.msg(res.message || '修改失败', {icon: 2});
                        }
                    },
                    error: function(xhr){
                        layer.msg(xhr.responseJSON?.detail || '修改失败', {icon: 2});
                    }
                });
            }
        });
    });

    $('#btn-logout').on('click', function(){
        layer.confirm('确定退出当前系统吗？', {icon: 3, title: '系统提示'}, function(){
            $.post('/auth/logout', function(){
                window.location.href = '/login';
            }).fail(function(xhr){
                layer.msg(xhr.responseJSON?.detail || '退出失败', {icon: 2});
            });
        });
    });

    element.on('nav(tenant-nav)', function(elem){
        const src = elem.attr('data-src');
        if (src) $('#tenant-frame').attr('src', src);
    });
});
</script>
</body>
</html>
