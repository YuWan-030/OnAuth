<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnAuth - 租户中心</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f5f7fb;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* ==========================================================================
           顶部 Header
           ========================================================================== */
        .header {
            height: 60px;
            background: #111827;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg,#2563eb,#1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(37,99,235,.35);
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pill {
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,.08);
            font-size: 12px;
            font-weight: 500;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pill.ok { background: rgba(34,197,94,.16); color: #4ade80; }
        .pill.warn { background: rgba(245,158,11,.16); color: #fcd34d; }
        .pill.muted { background: rgba(148,163,184,.16); color: #cbd5e1; }

        .tenant-user-area .layui-nav { background: transparent; padding: 0; }
        .tenant-user-area .layui-nav-item { line-height: 60px; display: inline-block; vertical-align: middle; }
        .tenant-user-area .layui-nav-item > a {
            color: #fff !important;
            padding: 0 28px 0 10px !important;
            font-size: 14px;
            display: flex !important;
            align-items: center;
            justify-content: flex-start;
            height: 60px;
            max-width: 220px;
        }

        .tenant-user-area .layui-nav-item > a span#current-user {
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 140px;
        }

        .tenant-user-area .layui-nav-item > a i.layui-icon-username { margin-right: 6px; font-size: 16px; }
        .tenant-user-area .layui-nav-child a { color: #333 !important; }

        .tenant-user-area .layui-nav .layui-nav-more {
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            margin-top: -2px !important;
            right: 8px !important;
            border-top-color: rgba(255, 255, 255, 0.7) !important;
        }

        .tenant-user-area .layui-nav .layui-nav-mored {
            margin-top: -8px !important;
            border-top-color: transparent !important;
            border-bottom-color: rgba(255, 255, 255, 0.7) !important;
        }

        .logout-btn-icon { margin-right: 5px; color: #ff5722; }
        .pwd-btn-icon { margin-right: 5px; color: #1e9fff; }

        /* ==========================================================================
           左侧侧边栏菜单
           ========================================================================== */
        .side {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: #1f2937;
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid rgba(255,255,255,.04);
            z-index: 100;
        }

        .side::-webkit-scrollbar { width: 5px; }
        .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 10px; }

        .side-menu { width: 220px; background: transparent !important; padding-top: 10px; }
        .side-menu .layui-nav-item > a {
            height: 48px;
            line-height: 48px;
            padding-left: 22px !important;
            font-size: 14px;
            color: rgba(255,255,255,.82) !important;
            transition: all .2s ease;
        }

        .side-menu .layui-nav-item > a:hover { background: rgba(255,255,255,.04); }
        .side-menu .layui-nav-item i { margin-right: 12px; font-size: 16px; }
        .side-menu .layui-this > a {
            background: linear-gradient(90deg,#2563eb,#1d4ed8) !important;
            color: #fff !important;
        }

        /* ==========================================================================
           RuoYi 风格核心实现：多标签卡片导航架构区
           ========================================================================== */
        .main-body {
            position: fixed;
            left: 220px;
            top: 60px;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: #f3f4f6;
            z-index: 90;
        }

        /* 标签栏基础底座形态 */
        .ruoyi-tab-container {
            height: 40px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            position: relative;
        }

        /* 强力覆盖 Layui 默认 Tab 样式，转为若依轻量卡片样式 */
        .ruoyi-tab-container .layui-tab {
            margin: 0 !important;
            border: none !important;
        }
        .ruoyi-tab-container .layui-tab-title {
            height: 40px !important;
            border: none !important;
            background: #fafafa !important;
            padding-right: 60px; /* 留出空间给右侧一键关闭按钮 */
        }
        .ruoyi-tab-container .layui-tab-title li {
            height: 40px !important;
            line-height: 40px !important;
            border-right: 1px solid #f3f4f6 !important;
            border-bottom: none !important;
            color: #4b5563 !important;
            font-size: 13px;
            padding: 0 16px !important;
            transition: all 0.15s ease;
        }
        .ruoyi-tab-container .layui-tab-title li:hover {
            background: #f1f5f9;
            color: #111827 !important;
        }
        /* 激活状态：变成白底、加粗、并带有若依蓝指示线 */
        .ruoyi-tab-container .layui-tab-title .layui-this {
            background: #fff !important;
            color: #2563eb !important;
            font-weight: 600;
        }
        .ruoyi-tab-container .layui-tab-title .layui-this:after {
            height: 3px !important;
            background-color: #2563eb !important;
            top: 0 !important;
            border: none !important;
        }
        /* 标签内的小关闭叉号 */
        .ruoyi-tab-container .layui-tab-title li .layui-tab-close {
            font-size: 12px;
            margin-left: 6px;
            color: #9ca3af;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover {
            background-color: #ef4444 !important;
            color: #fff !important;
        }

        /* 容器核心：让 Iframe 主体充满剩余视口高度 */
        .ruoyi-tab-content-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .admin-iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            display: none; /* 默认隐藏，通过 JS 控制当前激活节点 block */
        }
        .admin-iframe.active {
            display: block;
        }

        /* ==========================================================================
           右键上下文菜单与快捷选项样式
           ========================================================================== */
        .ruoyi-context-menu {
            position: absolute;
            background: #fff;
            border: 1px solid #dcdfe6;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 5px 0;
            z-index: 2000;
            display: none;
            min-width: 110px;
        }
        .ruoyi-context-menu li {
            list-style: none;
            padding: 8px 16px;
            color: #606266;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ruoyi-context-menu li:hover {
            background-color: #f5f7fa;
            color: #2563eb;
        }
        .ruoyi-context-menu li i { font-size: 14px; }

        /* ==========================================================================
           修改密码弹窗样式
           ========================================================================== */
        .pwd-form-wrapper { padding: 25px 25px 15px 15px; }
        .pwd-form-wrapper .layui-form-label { width: 70px !important; padding: 9px 5px !important; text-align: right; }
        .pwd-form-wrapper .layui-input-block { margin-left: 85px !important; }
        .pwd-form-wrapper .layui-input { border-radius: 6px !important; border-color: #d1d5db !important; height: 38px; transition: all .2s ease; }
        .pwd-form-wrapper .layui-input:focus { border-color: #2563eb !important; box-shadow: 0 0 0 2px rgba(37, 99, 235, .15) !important; }
        .btn-theme-submit { background: linear-gradient(90deg, #2563eb, #1d4ed8) !important; color: #fff !important; border-radius: 6px !important; border: none !important; box-shadow: 0 4px 12px rgba(37, 99, 235, .2); }
        .btn-theme-cancel { border-radius: 6px !important; }
        .layui-layer-content { overflow: hidden !important; }
    </style>
</head>

<body>

<div class="header">
    <div class="logo-area">
        <div class="logo-icon">🏢</div>
        <div>OnAuth · 租户中心</div>
    </div>

    <div class="header-meta">
        <span class="pill status-muted" id="tenant-name">正在加载租户...</span>
        <span class="pill status-muted" id="tenant-status">...</span>

        <div class="tenant-user-area">
            <ul class="layui-nav" lay-filter="headerNav">
                <li class="layui-nav-item">
                    <a href="javascript:;">
                        <i class="layui-icon layui-icon-username"></i>
                        <span id="current-user">加载中...</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:;" id="btn-change-password"><i class="layui-icon layui-icon-password pwd-btn-icon"></i>修改密码</a></dd>
                        <hr>
                        <dd><a href="javascript:;" id="btn-logout"><i class="layui-icon layui-icon-logout logout-btn-icon"></i>安全退出</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>
</div>

<div class="side">
    <ul class="layui-nav layui-nav-tree side-menu" lay-filter="tenant-nav">
        <li class="layui-nav-item layui-this">
            <a href="javascript:;" data-id="profile" data-src="/tenant/profile">
                <i class="layui-icon layui-icon-home"></i><span>概览</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="apply" data-src="/tenant/apply">
                <i class="layui-icon layui-icon-add-circle"></i><span>申请创建空间</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="apps" data-src="/tenant/apps">
                <i class="layui-icon layui-icon-app"></i><span>应用管理</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="credentials" data-src="/tenant/credentials">
                <i class="layui-icon layui-icon-key"></i><span>凭证管理</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="users" data-src="/tenant/users">
                <i class="layui-icon layui-icon-group"></i><span>成员邀请</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="audit" data-src="/tenant/audit">
                <i class="layui-icon layui-icon-form"></i><span>操作日志</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="webhook" data-src="/tenant/webhook">
                <i class="layui-icon layui-icon-util"></i><span>Webhook 接入</span>
            </a>
        </li>
        <li class="layui-nav-item">
            <a href="javascript:;" data-id="settings" data-src="/tenant/settings">
                <i class="layui-icon layui-icon-set"></i><span>空间设置</span>
            </a>
        </li>
    </ul>
</div>

<div class="main-body">
    <div class="ruoyi-tab-container">
        <div class="layui-tab" lay-filter="ruoyiTabs" lay-allowclose="true">
            <ul class="layui-tab-title">
                <li lay-id="profile" class="layui-this" lay-allowclose="false">概览</li>
            </ul>
        </div>
    </div>

    <div class="ruoyi-tab-content-wrapper" id="iframe-viewport">
        <iframe data-id="profile" class="admin-iframe active" src="/tenant/profile"></iframe>
    </div>
</div>

<ul class="ruoyi-context-menu" id="tab-context-menu">
    <li id="m-refresh"><i class="layui-icon layui-icon-refresh"></i>刷新当前</li>
    <li id="m-close-current"><i class="layui-icon layui-icon-close"></i>关闭当前</li>
    <li id="m-close-others"><i class="layui-icon layui-icon-subtraction"></i>关闭其他</li>
    <li id="m-close-all"><i class="layui-icon layui-icon-clear"></i>关闭全部</li>
</ul>

<div id="pwd-dialog-template" style="display:none;">
    <div class="pwd-form-wrapper">
        <form class="layui-form" lay-filter="tenantPwdForm">
            <div class="layui-form-item">
                <label class="layui-form-label">当前密码</label>
                <div class="layui-input-block">
                    <input type="password" name="current_password" placeholder="请输入原登录密码" autocomplete="off" lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">新密码</label>
                <div class="layui-input-block">
                    <input type="password" name="new_password" placeholder="请输入新密码（至少6位）" autocomplete="off" lay-verify="required|passLength" class="layui-input js-new-password">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">确认密码</label>
                <div class="layui-input-block">
                    <input type="password" name="confirm_password" placeholder="请再次输入新密码" autocomplete="off" lay-verify="required|passConfirm" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" style="text-align:right; margin-top:28px; margin-bottom:0;">
                <button type="button" class="layui-btn layui-btn-primary btn-theme-cancel" id="btn-pwd-cancel">取消</button>
                <button type="submit" class="layui-btn btn-theme-submit" lay-submit lay-filter="submitPwd">确认修改</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>

<script>
layui.use(['element', 'jquery', 'layer', 'form'], function(){
    const $ = layui.$;
    const element = layui.element;
    const layer = layui.layer;
    const form = layui.form;

    let contextMenuTargetId = null; // 右键选中的 Tab 项绑定的唯一 ID

    // 全局 AJAX 中断校验
    $.ajaxSetup({
        complete: function(xhr) {
            const detail = xhr.responseJSON?.detail || xhr.responseJSON?.message || '';
            if(xhr.status === 401) { window.top.location.href = '/login'; return; }
            if (xhr.status === 403 && detail) { layer.msg(detail, {icon: 2, time: 2500}); }
        }
    });

    function setPill(selector, text, cls) {
        $(selector).removeClass('ok warn muted').addClass(cls || 'muted').text(text);
    }

    // 载入顶部基础账户概要明细
    function loadProfile() {
        $.ajax({
            url: '/auth/me',
            type: 'GET',
            success: function(res){
                if (res.status !== 'success') {
                    layer.msg(res.message || '租户信息加载失败', {icon: 2});
                    $('#current-user').text('未登录');
                    return;
                }
                const data = res.data || {};
                let displayName = data.nickname ? data.nickname : (data.username || '租户管理员');
                $('#current-user').text(displayName);

                element.render('nav', 'headerNav');

                if (data.group_name) { $('#tenant-name').text(data.group_name); }
                else { $('#tenant-name').text('尚未创建空间'); }

                const status = (data.group_status || 'unknown').toLowerCase();
                const isActive = data.group_is_active !== false;
                if (status === 'approved' && isActive) setPill('#tenant-status', 'APPROVED', 'ok');
                else if (status === 'approved' && !isActive) setPill('#tenant-status', 'FUSED', 'warn');
                else if (status === 'pending') setPill('#tenant-status', 'PENDING', 'warn');
                else if (status === 'rejected') setPill('#tenant-status', 'REJECTED', 'warn');
                else setPill('#tenant-status', (data.group_status || 'unknown').toUpperCase(), 'muted');
            },
            error: function() { $('#current-user').text('未登录'); }
        });
    }
    loadProfile();

    // ==========================================================================
    // RuoYi 多标签页生命周期控制器调度中心
    // ==========================================================================

    // 1. 监听左侧菜单点击项，判断并创建/切换对应标签
    element.on('nav(tenant-nav)', function(elem){
        const id = elem.attr('data-id');
        const src = elem.attr('data-src');
        const title = elem.find('span').text();

        if (!src || !id) return;

        // 检查 Tab 卡片是否存在
        const existTab = $(`.layui-tab-title li[lay-id="${id}"]`);
        if (existTab.length === 0) {
            // 动态注入新标签项
            element.tabAdd('ruoyiTabs', {
                title: title,
                id: id
            });
            // 动态组装并渲染其绑定的独立 iframe 视口
            const newIframe = `<iframe data-id="${id}" class="admin-iframe" src="${src}"></iframe>`;
            $('#iframe-viewport').append(newIframe);
        }

        // 调度显示指定 Tab
        element.tabChange('ruoyiTabs', id);
    });

    // 2. 监听 Tab 选项卡物理切换事件，联动显隐 Iframe 视口群
    element.on('tab(ruoyiTabs)', function(data){
        const layId = $(this).attr('lay-id');

        // 联动切换 Iframe 显隐激活状态
        $('#iframe-viewport iframe').removeClass('active');
        $(`#iframe-viewport iframe[data-id="${layId}"]`).addClass('active');

        // 联动左侧菜单的高亮同步状态流转
        $('.side-menu .layui-nav-item').removeClass('layui-this');
        const currentMenu = $(`.side-menu a[data-id="${layId}"]`);
        if (currentMenu.length > 0) {
            currentMenu.parent().addClass('layui-this');
        }
    });

    // 3. 监听 Tab 的物理点击关闭事件（从 DOM 同步卸载废弃 Iframe）
    element.on('tabDelete(ruoyiTabs)', function(data){
        const layId = $(this).parent().attr('lay-id');
        $(`#iframe-viewport iframe[data-id="${layId}"]`).remove();
    });

    // ==========================================================================
    // RuoYi 右键菜单高级路由机制
    // ==========================================================================

    // 拦截 Tab 导航栏的鼠标右键行为
    $(document).on('contextmenu', '.ruoyi-tab-title li', function(e){
        e.preventDefault();
        const layId = $(this).attr('lay-id');
        contextMenuTargetId = layId;

        // 如果是固定不可关闭的固定首页(如概览)，屏蔽关闭按钮项的视觉响应
        if(layId === 'profile') {
            $('#m-close-current').addClass('layui-disabled').css('color', '#c2c2c2');
        } else {
            $('#m-close-current').removeClass('layui-disabled').css('color', '');
        }

        // 计算定位绝对坐标，平滑唤出右键浮窗
        $('#tab-context-menu').css({
            left: e.clientX + 'px',
            top: e.clientY + 'px'
        }).fadeIn(150);
    });

    // 全局环境点击，自动隐蔽上下文菜单
    $(document).on('click', function(){
        $('#tab-context-menu').fadeOut(100);
    });

    // 右键动作分发器：刷新当前
    $('#m-refresh').click(function(){
        if (!contextMenuTargetId) return;
        const targetIframe = $(`#iframe-viewport iframe[data-id="${contextMenuTargetId}"]`);
        if (targetIframe.length) {
            // 执行 iframe 的局部 DOM 重刷
            targetIframe.attr('src', targetIframe.attr('src'));
            layer.msg('页面已局部刷新', {offset: 'b', id: 'refresh-tips', time: 1000});
        }
    });

    // 右键动作分发器：关闭当前
    $('#m-close-current').click(function(){
        if (!contextMenuTargetId || contextMenuTargetId === 'profile') return;
        element.tabDelete('ruoyiTabs', contextMenuTargetId);
    });

    // 右键动作分发器：关闭其他
    $('#m-close-others').click(function(){
        if (!contextMenuTargetId) return;
        $('.ruoyi-tab-title li').each(function(){
            const id = $(this).attr('lay-id');
            if (id !== 'profile' && id !== contextMenuTargetId) {
                element.tabDelete('ruoyiTabs', id);
            }
        });
        element.tabChange('ruoyiTabs', contextMenuTargetId);
    });

    // 右键动作分发器：关闭全部
    $('#m-close-all').click(function(){
        $('.ruoyi-tab-title li').each(function(){
            const id = $(this).attr('lay-id');
            if (id !== 'profile') {
                element.tabDelete('ruoyiTabs', id);
            }
        });
        element.tabChange('ruoyiTabs', 'profile');
    });

    // ==========================================================================
    // 退出、修改密码等次级基础事务
    // ==========================================================================
    function executeLogout(quietly, successMsg) {
        $.ajax({
            url: '/auth/logout',
            type: 'POST',
            complete: function(){
                layer.closeAll('loading');
                document.cookie = "sso_session_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                if(!quietly) {
                    layer.msg(successMsg || '已安全退出', { icon: 1, time: 1500 }, function(){ window.location.href = '/login'; });
                } else {
                    window.location.href = '/login';
                }
            }
        });
    }

    form.verify({
        passLength: function(value){ if(value && value.length < 6) { return '新密码长度至少 6 位'; } },
        passConfirm: function(value, item){
            const $form = $(item).closest('form');
            const newPwd = $form.find('.js-new-password').val();
            if(value !== newPwd) { return '两次输入的密码不一致'; }
        }
    });

    $('#btn-change-password').click(function(e){
        e.preventDefault();
        let pwdIndex = layer.open({
            type: 1,
            title: '修改当前账户密码',
            area: ['440px','330px'],
            content: $('#pwd-dialog-template').html(),
            success: function(layero){
                form.render(null, 'tenantPwdForm');
                layero.find('#btn-pwd-cancel').click(function(){ layer.close(pwdIndex); });
            }
        });

        form.on('submit(submitPwd)', function(data){
            layer.load(2);
            $.ajax({
                url: '/auth/change_password',
                type: 'POST',
                data: { current_password: data.field.current_password, new_password: data.field.new_password },
                success: function(res){
                    layer.closeAll('loading');
                    if(res.status === 'success') {
                        layer.close(pwdIndex);
                        layer.alert('密码修改成功，请重新登录', { icon: 1, title: '系统通知', closeBtn: 0 }, function(){
                            layer.load(2);
                            executeLogout(true);
                        });
                    } else { layer.msg(res.message || '修改失败', { icon: 2 }); }
                },
                error: function(xhr){
                    layer.closeAll('loading');
                    let errorMsg = xhr.responseJSON?.detail || '系统通信异常';
                    layer.msg('修改失败：' + errorMsg, { icon: 2, time: 3000 });
                }
            });
            return false;
        });
    });

    $('#btn-logout').click(function(e){
        e.preventDefault();
        layer.confirm('确定退出当前系统吗？', { icon: 3, title: '系统提示' }, function(){
            layer.load(2);
            executeLogout(false, '退出成功');
        });
    });
});
</script>
</body>
</html>
