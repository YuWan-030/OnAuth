<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请创建空间 - OnAuth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body { margin: 0; padding: 16px; background: #f3f4f6; font-family: "Microsoft YaHei", sans-serif; }
        .card { background:#fff; border:1px solid #ebeef5; border-radius:10px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
        .title { font-size: 16px; font-weight: 700; color:#0f172a; margin-bottom: 10px; }
        .tip { font-size: 12px; color:#64748b; line-height: 1.7; margin-bottom: 16px; }
        .btn-theme { background: linear-gradient(135deg,#2563eb,#1d4ed8) !important; border: none !important; border-radius: 6px !important; }
        .layui-form-label { width: 100px; }
        .layui-input-block { margin-left: 130px; }
        .badge { display:inline-block; padding:4px 10px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:12px; font-weight:700; margin-bottom: 10px; }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 56px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            font-size: 15px !important;
        }
        body.onauth-shell .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: 70vh;
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>
<body>
<div class="card">
    <div class="title">申请创建租户空间</div>
    <div class="badge">审核通过后可创建应用与接入 Webhook</div>
    <div class="tip">如果你当前没有空间，请先提交申请；审核通过后才能创建应用、签发凭证以及接入 Webhook。</div>

    <form class="layui-form" lay-filter="applyForm">
        <div class="layui-form-item">
            <label class="layui-form-label">空间名称</label>
            <div class="layui-input-block">
                <input type="text" name="group_name" lay-verify="required" placeholder="请输入空间名称" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">空间说明</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="可选：填写空间用途、团队说明" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn btn-theme" lay-submit lay-filter="submitApply">提交申请</button>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
<script>
layui.use(['form','layer'], function(){
    const form = layui.form, layer = layui.layer, $ = layui.$;

    function extractErrorMessage(xhr, fallback) {
        const res = xhr && xhr.responseJSON ? xhr.responseJSON : null;
        if (!res) {
            const text = (xhr && xhr.responseText ? String(xhr.responseText) : '').trim();
            return text || fallback || '申请失败';
        }

        if (typeof res.detail === 'string' && res.detail.trim()) {
            return res.detail.trim();
        }

        if (Array.isArray(res.detail) && res.detail.length) {
            const first = res.detail[0] || {};
            const loc = Array.isArray(first.loc) ? first.loc.join('.') : '';
            const msg = first.msg || first.message || '';
            return [loc, msg].filter(Boolean).join(': ') || fallback || '申请失败';
        }

        if (typeof res.message === 'string' && res.message.trim()) {
            return res.message.trim();
        }

        if (typeof res.msg === 'string' && res.msg.trim()) {
            return res.msg.trim();
        }

        if (typeof res.detail === 'number' || typeof res.detail === 'boolean') {
            return String(res.detail);
        }

        return fallback || '申请失败';
    }

    $.ajaxSetup({
        complete: function(xhr) {
            const detail = extractErrorMessage(xhr, '');
            if (xhr.status === 401) {
                window.top.location.href = '/login';
                return;
            }
            if (xhr.status === 403 && detail) {
                layer.msg(detail, {icon: 2, time: 2500});
            }
        }
    });

    form.on('submit(submitApply)', function(data){
        const payload = {
            group_name: (data.field.group_name || '').trim(),
            description: (data.field.description || '').trim()
        };
        if (!payload.group_name) {
            layer.msg('空间名称不能为空', {icon: 2});
            return false;
        }
        $.ajax({
            url: '/tenant/space/apply',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function(res){
                if (res.status === 'success') {
                    layer.alert(`申请已提交，空间识别码：<b>${res.data?.group_code || ''}</b>`, {icon: 1, title: '提交成功'}, function(){
                        window.location.href = '/tenant/error';
                    });
                } else {
                    layer.msg(res.message || res.detail || '申请失败', {icon: 2});
                }
            },
            error: function(xhr){
                layer.msg(extractErrorMessage(xhr, '申请失败'), {icon: 2});
            }
        });
        return false;
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.addEventListener("click", function () {
                document.body.classList.toggle("onauth-mobile-nav-open");
            });
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                document.body.classList.remove("onauth-mobile-nav-open");
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    document.body.classList.remove("onauth-mobile-nav-open");
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
