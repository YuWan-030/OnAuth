<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户中心 - OnAuth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body {
            background-color: #f4f5f7; /* 对齐参考文件的底色 */
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           1. 顶部页头卡片 (完全继承参考文件的现代卡片组件封装)
           ========================================================================== */
        .page-header-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .page-title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }
        .tip {
            color: #64748b;
            font-size: 13px;
            font-weight: 400;
        }

        /* ==========================================================================
           2. 主体栅格及卡片风格 (延续参考文件的扁平现代化中台质感)
           ========================================================================== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 左右两栏对等分布 */
            gap: 16px;
            align-items: start;
        }

        .main-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .card-head-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-hint {
            font-size: 12px;
            color: #94a3b8;
        }

        /* ==========================================================================
           3. 数据属性行精细化排版
           ========================================================================== */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .info-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #f1f5f9;
        }
        .info-label {
            width: 100px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }
        .info-value {
            flex: 1;
            color: #0f172a;
            font-weight: 600;
            font-size: 13px;
            word-break: break-all;
            text-align: right;
        }

        /* 状态条横幅 */
        .status-banner {
            padding: 10px 14px;
            border-radius: 6px;
            background-color: #f0fdf4;
            color: #16a34a;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 14px;
            border: 1px solid #dcfce7;
        }
        .status-banner.no-group {
            background-color: #fef2f2;
            color: #ef4444;
            border-color: #fee2e2;
        }

        /* ==========================================================================
           4. 按钮控制集群 (继承自参考文件的全套按钮设计规范)
           ========================================================================== */
        .table-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 科技蓝主按钮 */
        .btn-prime {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border-radius: 6px !important;
            height: 36px !important;
            line-height: 36px !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            padding: 0 16px !important;
            border: none !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .btn-prime:hover { opacity: 0.95; }

        /* 边框次要按钮 */
        .btn-sec {
            border: 1px solid #d1d5db !important;
            background-color: #fff !important;
            color: #4b5563 !important;
            border-radius: 6px !important;
            height: 36px !important;
            line-height: 34px !important;
            font-size: 13px !important;
            padding: 0 14px !important;
            font-weight: 500;
        }
        .btn-sec:hover { border-color: #9ca3af !important; background-color: #f9fafb !important; color: #111827 !important; }

        /* 镂空高危警示按钮 */
        .btn-outline-danger {
            border: 1px solid rgba(239, 68, 68, 0.2) !important;
            background-color: rgba(239, 68, 68, 0.01) !important;
            color: #ef4444 !important;
            border-radius: 6px !important;
            height: 36px !important;
            line-height: 34px !important;
            font-size: 13px !important;
            padding: 0 14px !important;
            font-weight: 600;
        }
        .btn-outline-danger:hover { background-color: #ef4444 !important; color: #fff !important; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15); }

        /* ==========================================================================
           5. 徽章（Badges）组件规范
           ========================================================================== */
        .group-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .session-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .session-badge.status-current { background-color: #dcfce7; color: #16a34a; }
        .session-badge.status-other { background-color: #fef3c7; color: #d97706; }
        .session-badge.status-danger { background-color: #fee2e2; color: #dc2626; }
        .session-badge.status-neutral { background-color: #f1f5f9; color: #475569; }

        .inline-tip { color: #94a3b8; font-size: 12px; margin-top: 12px; line-height: 1.5; }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .header,
        .header-meta,
        .logo-area {
            min-width: 0;
        }
        .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        .logo-area {
            font-size: 15px !important;
        }
        .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open .side {
            transform: translateX(0);
        }
        .main,
        .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        .ruoyi-tab-container {
            height: auto !important;
        }
        .ruoyi-tab-container .layui-tab-title,
        .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .ruoyi-tab-content-wrapper,
        .layui-tab-content,
        .layui-tab-item,
        .admin-iframe {
            min-height: 70vh;
            height: auto !important;
            position: relative !important;
        }
        .layui-form-item {
            margin-bottom: 14px;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        body.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>
<body>

<div class="page-header-card">
    <div class="page-title-area">
        <h2 class="card-title">个人控制中心</h2>
        <span class="tip">查看当前账户核心标识属性、多租户关联空间底座以及安全生命周期管控。</span>
    </div>
</div>

<div class="dashboard-grid">
    <div class="main-card">
        <div class="card-head-area">
            <h3 class="card-title">凭证与账户信息</h3>
            <span class="card-hint">账号基础身份映射</span>
        </div>
        <div class="info-list">
            <div class="info-row"><div class="info-label">用户名</div><div class="info-value" id="profile-username">-</div></div>
            <div class="info-row"><div class="info-label">用户昵称</div><div class="info-value" id="profile-nickname">-</div></div>
            <div class="info-row">
                <div class="info-label">系统角色</div>
                <div class="info-value" style="display:flex; justify-content:flex-end;">
                    <span id="profile-roles" class="session-badge status-neutral">-</span>
                </div>
            </div>
        </div>

        <div class="card-head-area" style="margin-top: 32px;">
            <h3 class="card-title">会话与高危安全控制</h3>
            <span class="card-hint">账户生命周期自毁</span>
        </div>
        <div class="table-actions">
            <button class="layui-btn btn-sec" id="btn-logout">
                <i class="layui-icon layui-icon-logout"></i> 退出系统
            </button>
            <button class="layui-btn btn-outline-danger" id="btn-unregister">
                <i class="layui-icon layui-icon-delete"></i> 申请注销账户
            </button>
        </div>
        <div class="inline-tip">警告：注销操作将会永久粉碎当前绑定的账户和会话令牌，且该行为不可逆。</div>
    </div>

    <div class="main-card">
        <div class="card-head-area">
            <h3 class="card-title">关联租户空间</h3>
            <span class="card-hint">多租户隔离架构</span>
        </div>

        <div id="group-note" class="status-banner">空间信息加载中...</div>

        <div class="info-list">
            <div class="info-row"><div class="info-label">空间名称</div><div class="info-value" id="profile-group-name">-</div></div>
            <div class="info-row"><div class="info-label">空间识别码</div><div class="info-value" id="profile-group-code" style="font-family: monospace; color: #2563eb;">-</div></div>
            <div class="info-row">
                <div class="info-label">空间状态</div>
                <div class="info-value" style="display:flex; justify-content:flex-end;">
                    <span id="profile-group-status" class="session-badge status-other">WAITING</span>
                </div>
            </div>
        </div>

        <div class="group-meta">
            <span class="session-badge status-other" id="profile-group-expire-pill">待审批/待续期</span>
            <span class="session-badge status-neutral" id="profile-role-pill">USER</span>
        </div>

        <div class="table-actions" style="margin-top: 24px; padding-top: 18px; border-top: 1px dashed #e2e8f0;">
            <button class="layui-btn btn-prime" id="btn-copy-group">
                <i class="layui-icon layui-icon-file"></i> 复制识别码
            </button>
            <button class="layui-btn btn-sec" id="btn-open-sessions">
                <i class="layui-icon layui-icon-username"></i> 在线会话管理
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
<script>
layui.use(['layer'], function(){
    const layer = layui.layer, $ = layui.$;

    function extractErrorMessage(xhr, fallback) {
        const res = xhr && xhr.responseJSON ? xhr.responseJSON : null;
        if (!res) {
            const text = (xhr && xhr.responseText ? String(xhr.responseText) : '').trim();
            return text || fallback || '请求失败';
        }
        if (typeof res.detail === 'string' && res.detail.trim()) return res.detail.trim();
        if (Array.isArray(res.detail) && res.detail.length) {
            const first = res.detail[0] || {};
            return (first.msg || first.message || fallback || '请求失败');
        }
        if (typeof res.message === 'string' && res.message.trim()) return res.message.trim();
        return fallback || '请求失败';
    }

    $.ajaxSetup({
        complete: function(xhr) {
            const detail = xhr.responseJSON?.detail || xhr.responseJSON?.message || '';
            if (xhr.status === 401) {
                window.top.location.href = '/login';
                return;
            }
            if (xhr.status === 403 && detail) {
                layer.msg(detail, {icon: 2, time: 2500});
            }
        }
    });

    function setStatusBadge(status) {
        const badge = $('#profile-group-status');
        const note = $('#group-note');
        const normalized = (status || 'unknown').toLowerCase();

        badge.removeClass('status-current status-other status-danger');
        note.removeClass('no-group');

        if (normalized === 'pending') {
            badge.addClass('status-other').text('PENDING');
        } else if (normalized === 'approved') {
            badge.addClass('status-current').text('APPROVED');
        } else if (normalized === 'rejected') {
            badge.addClass('status-danger').text('REJECTED');
        } else {
            badge.addClass('status-other').text(normalized.toUpperCase());
        }
    }

    function loadProfile() {
        $.get('/auth/me', function(res){
            if (res.status !== 'success') {
                layer.msg(res.message || '用户画像加载失败', {icon: 2});
                return;
            }
            const data = res.data || {};

            if(data.group_name) {
                $('#group-note').removeClass('no-group').text('✨ 空间已绑定，可使用左侧或下方的入口进行独立会话管理');
            } else {
                $('#group-note').addClass('no-group').text('💡 当前账号尚未创建空间，请先申请创建空间底座');
            }

            $('#profile-username').text(data.username || '-');
            $('#profile-nickname').text(data.nickname || '-');
            $('#profile-roles').text((data.roles || []).join(' / ') || '-');
            $('#profile-group-name').text(data.group_name || '-');
            $('#profile-group-code').text(data.group_code || '-');
            $('#profile-group-expire-pill').text(data.group_expire_at || '待审批/待续期');
            $('#profile-role-pill').text((data.roles || []).join(' / ') || 'USER');
            setStatusBadge(data.group_status);
        }).fail(function(xhr){
            layer.msg(extractErrorMessage(xhr, '用户画像加载失败'), {icon: 2});
        });
    }

    loadProfile();

    $('#btn-copy-group').on('click', function(){
        const code = $('#profile-group-code').text().trim();
        if (!code || code === '-') {
            layer.msg('暂无空间识别码', {icon: 4});
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(() => {
                layer.msg('识别码已成功复制', {icon: 1});
            }).catch(() => {
                layer.msg('复制失败，请手动选择复制', {icon: 2});
            });
        } else {
            window.prompt('复制以下识别码：', code);
        }
    });

    $('#btn-open-sessions').on('click', function(){
        window.location.href = '/user/sessions';
    });

    $('#btn-logout').on('click', function(){
        layer.confirm('确定要退出当前管理系统吗？', {icon: 3, title: '安全提示'}, function(){
            const loading = layer.load(2);
            $.post('/auth/logout', function(){
                layer.close(loading);
                window.location.href = '/login';
            }).fail(function(xhr){
                layer.close(loading);
                layer.msg(extractErrorMessage(xhr, '退出失败'), {icon: 2});
            });
        });
    });

    $('#btn-unregister').on('click', function(){
        layer.prompt({
            title: '请输入当前密码以确认注销',
            formType: 1,
            success: function(layero) {
                layero.find('.layui-layer-btn0').css({
                    'background': '#ef4444',
                    'border-color': '#ef4444',
                    'box-shadow': '0 4px 12px rgba(239, 68, 68, 0.15)'
                });
            }
        }, function(value, index){
            const passwordVal = (value || '').trim();
            if (!passwordVal) {
                layer.msg('密码不能为空', {icon: 2});
                return false;
            }

            const loading = layer.load(2);
            $.ajax({
                url: '/auth/unregister',
                type: 'DELETE',
                contentType: 'application/x-www-form-urlencoded',
                data: { confirm_password: passwordVal },
                success: function(res){
                    layer.close(loading);
                    layer.close(index);
                    layer.alert(res.message || '账户已成功注销', {
                        icon: 1,
                        title: '注销成功',
                        closeBtn: 0
                    }, function(){
                        layer.load(2);
                        window.location.href = '/login';
                    });
                },
                error: function(xhr){
                    layer.close(loading);
                    layer.msg(extractErrorMessage(xhr, '注销失败'), {icon: 2, time: 3000});
                }
            });
        });
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        var versionText = "{{ APP_VERSION }}";
        var badge = document.getElementById("onauth-version-badge");
        if (badge) {
            badge.textContent = versionText;
        }
        var side = document.querySelector(".side");
        var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
        if (!side || !toggleBtn) {
            return;
        }
        document.body.classList.add("onauth-has-side");
        toggleBtn.addEventListener("click", function () {
            document.body.classList.toggle("onauth-mobile-nav-open");
        });
        document.addEventListener("click", function (evt) {
            if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                return;
            }
            if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                return;
            }
            document.body.classList.remove("onauth-mobile-nav-open");
        });
        window.addEventListener("resize", function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove("onauth-mobile-nav-open");
            }
        });
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
