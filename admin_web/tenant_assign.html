<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间分配 - OnAuth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        /* ==========================================================================
           中台全局现代画布与盒模型修正
           ========================================================================== */
        *, *:before, *:after {
            box-sizing: border-box; /* 强行修正所有元素的盒模型，防止 padding 撑开错位 */
        }
        body {
            margin: 0;
            padding: 16px;
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* ==========================================================================
           左右双翼高级卡片舱（弹性盒绝对对齐）
           ========================================================================== */
        .flex-container {
            display: flex;
            gap: 16px;
            align-items: stretch; /* 终极武器：让左右两个卡片在任何时候都绝对等高 */
            flex-wrap: wrap;
        }

        .panel-left {
            flex: 1;
            min-width: 60%; /* 保证桌面端有大广角视线 */
        }

        .panel-right {
            width: 360px; /* 控制台宽度固定，彻底消灭拉伸和变形 */
            flex-shrink: 0;
        }

        @media screen and (max-width: 992px) {
            .flex-container { flex-direction: column; }
            .panel-left, .panel-right { width: 100%; }
        }

        .panel-card {
            background: #fff;
            border: 1px solid #ebeef5;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            padding: 20px;
            height: 100%; /* 继承父级等高 */
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           高级渐变与辅助组件
           ========================================================================== */
        .btn-theme-gradient {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 0 20px !important;
            height: 38px !important;
            line-height: 38px !important;
            font-size: 13px !important;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-theme-gradient:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-auxiliary {
            background: #fff !important;
            color: #475569 !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 6px !important;
            height: 34px !important;
            line-height: 32px !important;
            font-size: 13px !important;
            padding: 0 12px !important;
            transition: all 0.2s;
        }
        .btn-auxiliary:hover {
            border-color: #2563eb !important;
            color: #2563eb !important;
            background: #f8fafc !important;
        }

        /* ==========================================================================
           表格视觉修剪
           ========================================================================== */
        .layui-table-view {
            border: 1px solid #ebeef5 !important;
            border-radius: 8px !important;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02) !important;
            margin-top: 12px;
            flex: 1; /* 让表格自适应填满卡片剩余空间 */
        }
        .layui-table th {
            background-color: #f8fafc !important;
            color: #475569 !important;
            font-weight: 600;
            height: 44px;
            border-bottom: 1px solid #ebeef5 !important;
        }
        .layui-table td {
            border-bottom: 1px solid #f1f5f9 !important;
            color: #334155;
            height: 46px;
        }

        /* ==========================================================================
           右侧紧凑控制面板（彻底清理错位样式）
           ========================================================================== */
        .control-header {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            padding-bottom: 14px;
            border-bottom: 1px dashed #e2e8f0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-header i { color: #2563eb; font-size: 16px; }

        /* 强制覆盖 Layui 原本错位的表单左位移布局 */
        .vertical-form .layui-form-item {
            margin-bottom: 20px;
            clear: both;
        }
        .vertical-form .layui-form-label {
            color: #475569;
            font-weight: 500;
            width: 100% !important; /* 宽度撑满，不要挤在一行 */
            text-align: left !important;
            padding: 0 0 8px 0 !important;
            line-height: 1.5;
            float: none !important;
        }
        .vertical-form .layui-input-block {
            margin-left: 0 !important; /* 清空 Layui 默认保留的 110px 左边距 */
            float: none !important;
            width: 100% !important;
        }

        .vertical-form .layui-input,
        .vertical-form .layui-select,
        .vertical-form .layui-form-select input {
            border-radius: 6px !important;
            border-color: #cbd5e1 !important;
            height: 38px !important;
        }
        .vertical-form .layui-input:focus,
        .vertical-form .layui-form-select input:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12) !important;
        }

        /* 开关美化 */
        .layui-form-switch { border-radius: 20px; margin-top: 0; }
        .layui-form-onswitch {
            border-color: #2563eb !important;
            background-color: #2563eb !important;
        }

        .tip-box {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
            margin-top: 4px;
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 3010;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(10px);
        cursor: pointer;
    }
    .onauth-burger,
    .onauth-burger::before,
    .onauth-burger::after {
        display: block;
        width: 16px;
        height: 2px;
        border-radius: 2px;
        background: #ffffff;
        content: "";
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .onauth-burger {
        position: relative;
        margin: 0 auto;
    }
    .onauth-burger::before {
        position: absolute;
        left: 0;
        top: -5px;
    }
    .onauth-burger::after {
        position: absolute;
        left: 0;
        top: 5px;
    }
    body.onauth-mobile-nav-open .onauth-burger {
        background: transparent;
    }
    body.onauth-mobile-nav-open .onauth-burger::before {
        top: 0;
        transform: rotate(45deg);
    }
    body.onauth-mobile-nav-open .onauth-burger::after {
        top: 0;
        transform: rotate(-45deg);
    }
    .onauth-mobile-mask {
        display: none;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        body:not(.onauth-shell) {
            padding: 10px !important;
        }
        .layui-fluid,
        .layui-container {
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        .layui-card {
            margin-bottom: 12px;
            border-radius: 12px;
        }
        .layui-card-header {
            min-height: 40px;
            height: auto !important;
            line-height: 1.4 !important;
            padding: 10px 12px !important;
        }
        .layui-card-body {
            padding: 12px !important;
        }
        .layui-btn {
            height: 34px;
            line-height: 34px;
            padding: 0 10px;
            font-size: 13px;
        }
        .layui-btn + .layui-btn {
            margin-left: 6px;
        }
        .layui-inline {
            display: block !important;
            margin-right: 0 !important;
            margin-bottom: 8px;
        }
        .layui-input-inline,
        .layui-form-select,
        .layui-textarea {
            width: 100% !important;
        }
        .layui-layer {
            max-width: 94vw !important;
            max-height: 90vh !important;
            left: 3vw !important;
        }
        .layui-layer-page .layui-layer-content {
            overflow: auto !important;
        }
        .layui-table-view,
        .layui-table-box,
        .layui-table-body,
        .layui-table-main {
            overflow-x: auto !important;
        }
        /* Mobile: disable duplicated fixed columns to avoid data being covered */
        .layui-table-fixed,
        .layui-table-fixed-l,
        .layui-table-fixed-r,
        .layui-table-patch {
            display: none !important;
        }
        .layui-table-view .layui-table-box {
            overflow-x: auto !important;
        }
        .layui-table-cell {
            height: auto !important;
            line-height: 1.5 !important;
        }
        .layui-table-cell .layui-btn {
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area,
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: 52px !important;
            min-height: 52px;
            padding: 6px 10px 6px 50px !important;
            gap: 8px;
            flex-wrap: nowrap;
            align-items: center;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            flex: 1;
            max-width: calc(100% - 86px);
            font-size: 13px !important;
            line-height: 1;
        }
        body.onauth-shell .logo-area > div:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .logo-icon {
            width: 26px !important;
            height: 26px !important;
            margin-right: 6px !important;
            font-size: 14px !important;
        }
        body.onauth-shell .header-meta .pill,
        body.onauth-shell .tenant-user-area #tenant-name,
        body.onauth-shell .tenant-user-area #tenant-status,
        body.onauth-shell .user-info-area #tenant-pill {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item,
        body.onauth-shell .tenant-user-area .layui-nav-item {
            line-height: 32px !important;
        }
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            margin-right: 8px;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a,
        body.onauth-shell .tenant-user-area .layui-nav-item > a {
            width: 72px !important;
            min-width: 72px !important;
            max-width: 72px !important;
            padding: 0 18px 0 6px !important;
            font-size: 12px !important;
            justify-content: flex-start !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a span,
        body.onauth-shell .tenant-user-area .layui-nav-item > a span {
            display: inline-block !important;
            max-width: 2.6em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a i,
        body.onauth-shell .tenant-user-area .layui-nav-item > a i {
            margin-right: 4px !important;
        }
        body.onauth-shell .user-info-area .layui-nav .layui-nav-more,
        body.onauth-shell .tenant-user-area .layui-nav .layui-nav-more {
            right: 2px !important;
        }
        body.onauth-shell .user-info-area .layui-nav-child,
        body.onauth-shell .tenant-user-area .layui-nav-child {
            left: auto !important;
            right: 0 !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(74vw, 250px) !important;
            max-width: 250px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            box-shadow: 14px 0 28px rgba(15, 23, 42, 0.22);
            z-index: 3005 !important;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            background: rgba(31, 41, 55, 0.97) !important;
            backdrop-filter: blur(10px);
        }
        body.onauth-shell .side-menu {
            width: 100% !important;
        }
        body.onauth-shell .side-menu .layui-nav-item > a,
        body.onauth-shell .side-menu .layui-nav-child dd a {
            padding-left: 14px !important;
            font-size: 13px !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            height: 36px !important;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
            padding-right: 0 !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab .layui-tab-bar,
        body.onauth-shell .layui-tab .layui-tab-bar {
            display: none !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title::-webkit-scrollbar,
        body.onauth-shell .layui-tab-title::-webkit-scrollbar {
            display: none;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li,
        body.onauth-shell .layui-tab-title li {
            line-height: 36px !important;
            height: 36px !important;
            padding: 0 10px !important;
            font-size: 13px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close,
        body.onauth-shell .layui-tab-title li .layui-tab-close {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            border-radius: 999px;
            color: #64748b !important;
            background: rgba(148, 163, 184, 0.18);
            font-size: 12px;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover,
        body.onauth-shell .layui-tab-title li .layui-tab-close:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.88);
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: calc(100vh - 100px);
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        body.onauth-shell .onauth-mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            z-index: 3003;
        }
        body.onauth-mobile-nav-open.onauth-shell .onauth-mobile-mask {
            display: block;
        }
        body.onauth-mobile-nav-open.onauth-shell {
            overflow: hidden !important;
        }
    }
</style>
</head>
<body>

<div class="layui-fluid">
    <!-- 使用现代弹性盒子，彻底干掉因 Layui 响应式 padding 产生的计算错位 -->
    <div class="flex-container">

        <!-- 📐 左侧翼：监控大盘（宽度自适应扩张） -->
        <div class="panel-left">
            <div class="panel-card">
                <div style="display:flex; justify-content: space-between; align-items:flex-start; gap: 10px; margin-bottom: 14px;">
                    <div>
                        <div style="font-size: 16px; font-weight: 700; color: #0f172a;">租户空间分配中心</div>
                        <div class="tip-box">集中监管调度系统中已就绪的组织空间资产。</div>
                    </div>
                    <button class="layui-btn btn-auxiliary" id="btn-refresh">
                        <i class="layui-icon layui-icon-refresh"></i> 异步刷新
                    </button>
                </div>
                <!-- 核心数据网格 -->
                <table class="layui-hide" id="groupTable" lay-filter="groupTable"></table>
            </div>
        </div>

        <!-- ⚡ 右侧翼：控制舱（宽度精准固定 360px，防形变） -->
        <div class="panel-right">
            <div class="panel-card" style="background: #fafafa; border-color: #e2e8f0;">
                <div class="control-header">
                    <i class="layui-icon layui-icon-slider"></i> 快速指派控制舱
                </div>

                <form class="layui-form vertical-form" lay-filter="assignForm">
                    <div class="layui-form-item">
                        <label class="layui-form-label">指派组织空间</label>
                        <div class="layui-input-block">
                            <select name="group_id" lay-search lay-verify="required" id="groupSelect">
                                <option value="">正在载入空间实体...</option>
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">目标租户管理员</label>
                        <div class="layui-input-block">
                            <select name="user_id" lay-search lay-verify="required" id="userSelect">
                                <option value="">正在拉取合规账号...</option>
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item" style="background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 25px;">
                        <label class="layui-form-label" style="font-size:13px; font-weight: 600;">空间拓扑绑定</label>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                            <div class="tip-box" style="margin-top:0; color: #94a3b8; max-width: 75%;">管理员主组织架构将同步对齐该空间。</div>
                            <input type="checkbox" name="bind_user_group" checked lay-skin="switch" lay-text="开启|关闭">
                        </div>
                    </div>

                    <div class="layui-form-item" style="margin-top: auto; padding-top: 20px;">
                        <!-- margin-top: auto 保证无论左边多高，按钮都优雅被吸附在右侧控制舱最底部 -->
                        <div class="layui-input-block">
                            <button class="layui-btn btn-theme-gradient" lay-submit lay-filter="submitAssign" style="width: 100%;">
                                <i class="layui-icon layui-icon-release"></i> 执行资产分配
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script>
layui.use(['table','layer','form'], function(){
    const table = layui.table, layer = layui.layer, form = layui.form, $ = layui.$;

    let groupCache = [];
    let userCache = [];

    function loadGroups(){
        $.get('/admin/groups/list', function(res){
            const data = Array.isArray(res) ? res : (res.data || res || []);
            groupCache = data.filter(item => item.status === 'approved' || item.is_active === true);
            const html = ['<option value="">-- 输入中台识别码检索 --</option>'];
            groupCache.forEach(item => {
                html.push(`<option value="${item.id}">${item.group_name} [${item.group_code || '未定义'}]</option>`);
            });
            $('#groupSelect').html(html.join(''));
            form.render('select');
        });
    }

    function loadUsers(){
        $.get('/admin/users/list?limit=100', function(res){
            const data = res.data || [];
            userCache = data.filter(item => (item.roles || []).includes('tenant_admin') || (item.roles || []).includes('super_admin'));
            const html = ['<option value="">-- 输入用户名/昵称检索 --</option>'];
            userCache.forEach(item => {
                html.push(`<option value="${item.id}">${item.nickname || item.username} (${item.username})</option>`);
            });
            $('#userSelect').html(html.join(''));
            form.render('select');
        });
    }

    function loadTable(){
        table.render({
            elem: '#groupTable',
            url: '/admin/groups/list',
            page: false,
            parseData: function(res){
                const data = Array.isArray(res) ? res : (res.data || []);
                return {code: 0, msg: '', count: data.length, data: data};
            },
            cols: [[
                {field:'id', title:'ID', width:70, sort: true, align: 'center'},
                {field:'group_name', title:'空间名称/组织实体', minWidth:150, style: 'font-weight: 500;'},
                {field:'group_code', title:'识别码', width:120, style: 'color: #2563eb; font-family: monospace;'},
                {field:'owner', title:'负责人', width:110},
                {field:'status', title:'风控状态', width:90, align: 'center', templet: function(d){
                    if(d.status === 'approved' || d.is_active) {
                        return '<span style="color:#16a34a;font-size:12px;">● 已授信</span>';
                    }
                    return '<span style="color:#64748b;font-size:12px;">待校验</span>';
                }},
                {field:'expire_at', title:'到期时间', width:160}
            ]],
            error: function(res){
                if(res.status === 401){
                    layer.msg('会话已失效，请重新登录账号', {icon: 2}, function(){
                        window.top.location.href = '/login';
                    });
                }
            }
        });
    }

    form.on('submit(submitAssign)', function(data){
        const payload = {
            user_id: parseInt(data.field.user_id, 10),
            bind_user_group: data.field.bind_user_group === 'on'
        };
        const groupId = parseInt(data.field.group_id, 10);
        if (!groupId || !payload.user_id) {
            layer.msg('空间实体与目标管理员不可为空', {icon: 2});
            return false;
        }

        var loading = layer.msg('中台资产映射更新中...', {icon: 16, shade: 0.1, time: 0});
        $.ajax({
            url: `/admin/groups/${groupId}/assign`,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function(res){
                layer.close(loading);
                if (res.status === 'success') {
                    layer.msg(res.message || '资产分派并下发完毕', {icon: 1});
                    loadGroups();
                    loadUsers();
                    loadTable();
                } else {
                    layer.msg(res.message || '分配请求遭遇内部阻断', {icon: 2});
                }
            },
            error: function(xhr){
                layer.close(loading);
                if(xhr.status === 401) {
                    layer.msg('登录凭证已过期', {icon: 2}, function(){ window.top.location.href = '/login'; });
                } else {
                    layer.msg(xhr.responseJSON?.detail || '资产映射失败', {icon: 2});
                }
            }
        });
        return false;
    });

    $('#btn-refresh').on('click', function(){
        loadGroups();
        loadUsers();
        loadTable();
    });

    loadGroups();
    loadUsers();
    loadTable();
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            var mask = document.createElement("div");
            mask.className = "onauth-mobile-mask";
            document.body.appendChild(mask);
            function closeMobileNav() {
                document.body.classList.remove("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
            function toggleMobileNav() {
                var willOpen = !document.body.classList.contains("onauth-mobile-nav-open");
                document.body.classList.toggle("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.addEventListener("click", toggleMobileNav);
            mask.addEventListener("click", closeMobileNav);
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                closeMobileNav();
            });
            side.addEventListener("click", function (evt) {
                // Only collapse drawer when a child menu item is clicked.
                var childMenuLink = evt.target.closest(".layui-nav-child dd a");
                if (childMenuLink) {
                    closeMobileNav();
                }
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    closeMobileNav();
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation"><span class="onauth-burger" aria-hidden="true"></span></button>
</body>
</html>
