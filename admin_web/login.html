<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>身份凭证确认 - OnAuth 云中台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico?v=20260526" type="image/x-icon" sizes="any">
    <link rel="shortcut icon" href="/favicon.ico?v=20260526" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        /* ==========================================================================
           全屏星空灰背景与垂直居中容器
           ========================================================================== */
        body {
            background: radial-gradient(circle at 50% 50%, #f8fafc, #e2e8f0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

            -webkit-font-smoothing: antialiased;
        }

        /* 登录卡片美化：高级扁平化无边框，带微阴影 */
        .login-container {
            width: 360px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #ebeef5;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 0;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            width: fit-content;
            margin: 0 auto 28px;
        }

        .page-title-group {
            min-width: 0;
            flex: 0 1 auto;
        }

        /* 主标题排版 */
        .login-title {
            font-size: 20px;
            font-weight: 700;
            text-align: left;
            margin: 0;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.7;
        }

        /* 表单间距微调 */
        .layui-form-item { margin-bottom: 20px; position: relative; }

        /* ==========================================================================
           输入框与图标精细化加工
           ========================================================================== */
        .layui-input {
            border-radius: 6px !important;
            border-color: #cbd5e1 !important;
            height: 42px;
            padding-left: 38px !important; /* 给图标预留空间 */
            transition: all 0.2s ease-in-out;
            font-size: 14px;
        }
        .layui-input:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
        }

        /* 内嵌式输入框前置图标 */
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            z-index: 10;
            pointer-events: none;
        }

        /* ==========================================================================
           安全提交按钮与注册流转链路
           ========================================================================== */
        /* 核心渐变蓝登录按钮 */
        .btn-login-theme {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 14px !important;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-login-theme:hover { opacity: 0.95; color: #fff !important; }
        .btn-login-theme:active { transform: scale(0.98); }

        /* 底部流转区域 */
        .link-reg {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .link-reg a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .link-reg a:hover {
            color: #2563eb;
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */

        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);

        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 3010;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(10px);
        cursor: pointer;
    }
    .onauth-burger,
    .onauth-burger::before,
    .onauth-burger::after {
        display: block;
        width: 16px;
        height: 2px;
        border-radius: 2px;
        background: #ffffff;
        content: "";
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .onauth-burger {
        position: relative;
        margin: 0 auto;
    }
    .onauth-burger::before {
        position: absolute;
        left: 0;
        top: -5px;
    }
    .onauth-burger::after {
        position: absolute;
        left: 0;
        top: 5px;
    }
    body.onauth-mobile-nav-open .onauth-burger {
        background: transparent;
    }
    body.onauth-mobile-nav-open .onauth-burger::before {
        top: 0;
        transform: rotate(45deg);
    }
    body.onauth-mobile-nav-open .onauth-burger::after {
        top: 0;
        transform: rotate(-45deg);
    }
    .onauth-mobile-mask {
        display: none;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;

            max-width: 94vw !important;

        body.onauth-shell .header,

            flex-wrap: nowrap;

            position: sticky !important;

        body.onauth-shell .logo-area {

        body.onauth-shell .user-info-area .layui-nav-item > a,
        body.onauth-shell .tenant-user-area .layui-nav-item > a {
            width: 72px !important;
            min-width: 72px !important;
            max-width: 72px !important;

        body.onauth-shell .user-info-area .layui-nav-item > a span,
        body.onauth-shell .tenant-user-area .layui-nav-item > a span {

        body.onauth-shell .user-info-area .layui-nav-item > a i,

        body.onauth-shell .user-info-area .layui-nav .layui-nav-more,
        body.onauth-shell .tenant-user-area .layui-nav .layui-nav-more {

        body.onauth-shell .user-info-area .layui-nav-child,
        body.onauth-shell .tenant-user-area .layui-nav-child {
            left: auto !important;
            right: 0 !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(74vw, 250px) !important;
            max-width: 250px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            box-shadow: 14px 0 28px rgba(15, 23, 42, 0.22);
            z-index: 3005 !important;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            background: rgba(31, 41, 55, 0.97) !important;

        }
        body.onauth-shell .side-menu {
            width: 100% !important;
        }
        body.onauth-shell .side-menu .layui-nav-item > a,
        body.onauth-shell .side-menu .layui-nav-child dd a {
            padding-left: 14px !important;
            font-size: 13px !important;

        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);

        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            height: 36px !important;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
            padding-right: 0 !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab .layui-tab-bar,
        body.onauth-shell .layui-tab .layui-tab-bar {
            display: none !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title::-webkit-scrollbar,
        body.onauth-shell .layui-tab-title::-webkit-scrollbar {

        body.onauth-shell .layui-tab-title li {

        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close,
        body.onauth-shell .layui-tab-title li .layui-tab-close {
            display: inline-flex !important;
            align-items: center;

            border-radius: 999px;
            color: #64748b !important;
            background: rgba(148, 163, 184, 0.18);
            font-size: 12px;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover,
        body.onauth-shell .layui-tab-title li .layui-tab-close:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.88);
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: calc(100vh - 100px);
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        body.onauth-shell .onauth-mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            z-index: 3003;
        }
        body.onauth-mobile-nav-open.onauth-shell .onauth-mobile-mask {
            display: block;
        }
        body.onauth-mobile-nav-open.onauth-shell {

    }
</style>
</head>
<body>

<div class="login-container">
    <div class="page-header">
        <div class="logo"><img src="/favicon.ico?v=20260527" alt="OnAuth Logo"></div>
        <div class="page-title-group">
            <div class="login-title">运营管理中台</div>
            <div class="page-subtitle">身份凭证确认</div>
        </div>
    </div>

    <form class="layui-form" lay-filter="loginForm">
        <!-- 账户输入域 -->
        <div class="layui-form-item">
            <i class="layui-icon layui-icon-username input-icon"></i>
            <input type="text" name="username" lay-verify="required" lay-reqtext="请输入安全访问账户" placeholder="请输入账户" class="layui-input" autocomplete="off">
        </div>

        <!-- 凭证输入域 -->
        <div class="layui-form-item">
            <i class="layui-icon layui-icon-password input-icon"></i>
            <input type="password" name="password" lay-verify="required" lay-reqtext="请输入登录认证密码" placeholder="请输入登录密码" class="layui-input" autocomplete="off">
        </div>

        <!-- 验证码输入域（动态显示） -->
        <div class="layui-form-item" id="captchaRow" style="display:none;">
            <i class="layui-icon layui-icon-vercode input-icon"></i>
            <input type="text" name="captcha_code" placeholder="请输入验证码" class="layui-input" autocomplete="off" style="padding-right: 120px;">
            <input type="hidden" name="captcha_token" id="captchaToken">
            <img id="captchaImage" alt="验证码" style="position:absolute; right:8px; top:50%; transform: translateY(-50%); height:32px; cursor:pointer; border-radius:4px;">
        </div>

        <!-- 授信登录动作 -->
        <div class="layui-form-item" style="margin-top: 26px; margin-bottom: 5px;">
            <button class="layui-btn layui-btn-fluid btn-login-theme" lay-submit lay-filter="doLogin">安全验证并登录</button>
        </div>

        <!-- 属性下摆跳转 -->
        <div class="link-reg">
            <a href="/register">还没有中台账号？申请注册网络凭证 &raquo;</a>
        </div>
    </form>
</div>

<script>
layui.use(['form', 'layer'], function(){
    var form = layui.form, layer = layui.layer, $ = layui.$;

    const loadCaptcha = function(){
        $.get('/system/captcha', function(res){
            if (!res || res.code !== 200) {
                return;
            }
            $('#captchaToken').val(res.data.token);
            $('#captchaImage').attr('src', res.data.image);
            $('#captchaRow').show();
        });
    };

    $('#captchaImage').on('click', function(){
        loadCaptcha();
    });

    // 🛡️ 边界防御：防 Iframe 跨域嵌套与点击劫持
    if (window !== window.top) {
        window.top.location.href = window.location.href;
    }

    // 监听授信提交
    form.on('submit(doLogin)', function(data){
        const loading = layer.load(2);

        $.ajax({
            url: '/admin/token',
            type: 'POST',
            data: JSON.stringify(data.field),
            contentType: 'application/json',
            success: function(res){
                layer.close(loading);
                layer.msg('凭证授信成功，正在引导注入...', {icon: 1, time: 1000}, function(){
                    // 核心 HttpOnly Cookie 已就绪，直接流转主舱顶层域
                    window.top.location.href = '/index';
                });
            },
            error: function(err){
                layer.close(loading);
                const res = err.responseJSON || {};
                if (res.captcha_required) {
                    $('#captchaToken').val(res.captcha_token || '');
                    $('#captchaImage').attr('src', res.captcha_image || '');
                    $('#captchaRow').show();
                }
                // 精细化读取拦截网格下发的详细错误
                var errMsg = res.message || res.detail || '身份认证失败，凭证不正确';
                layer.msg(errMsg, {icon: 2, shift: 6});
            }
        });
        return false;
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            var mask = document.createElement("div");
            mask.className = "onauth-mobile-mask";
            document.body.appendChild(mask);
            function closeMobileNav() {
                document.body.classList.remove("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
            function toggleMobileNav() {
                var willOpen = !document.body.classList.contains("onauth-mobile-nav-open");
                document.body.classList.toggle("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.addEventListener("click", toggleMobileNav);
            mask.addEventListener("click", closeMobileNav);
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                closeMobileNav();
            });
            side.addEventListener("click", function (evt) {
                // Only collapse drawer when a child menu item is clicked.
                var childMenuLink = evt.target.closest(".layui-nav-child dd a");
                if (childMenuLink) {
                    closeMobileNav();
                }
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    closeMobileNav();
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation"><span class="onauth-burger" aria-hidden="true"></span></button>
</body>
</html>
