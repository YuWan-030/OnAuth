<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>身份凭证确认 - OnAuth 云中台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        /* ==========================================================================
           全屏星空灰背景与垂直居中容器
           ========================================================================== */
        body {
            background: radial-gradient(circle at 50% 50%, #f8fafc, #e2e8f0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 登录卡片美化：高级扁平化无边框，带微阴影 */
        .login-container {
            width: 360px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #ebeef5;
        }

        /* 主标题排版 */
        .login-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        /* 表单间距微调 */
        .layui-form-item { margin-bottom: 20px; position: relative; }

        /* ==========================================================================
           输入框与图标精细化加工
           ========================================================================== */
        .layui-input {
            border-radius: 6px !important;
            border-color: #cbd5e1 !important;
            height: 42px;
            padding-left: 38px !important; /* 给图标预留空间 */
            transition: all 0.2s ease-in-out;
            font-size: 14px;
        }
        .layui-input:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
        }

        /* 内嵌式输入框前置图标 */
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            z-index: 10;
            pointer-events: none;
        }

        /* ==========================================================================
           安全提交按钮与注册流转链路
           ========================================================================== */
        /* 核心渐变蓝登录按钮 */
        .btn-login-theme {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 14px !important;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-login-theme:hover { opacity: 0.95; color: #fff !important; }
        .btn-login-theme:active { transform: scale(0.98); }

        /* 底部流转区域 */
        .link-reg {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .link-reg a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .link-reg a:hover {
            color: #2563eb;
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .header,
        .header-meta,
        .logo-area {
            min-width: 0;
        }
        .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        .logo-area {
            font-size: 15px !important;
        }
        .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open .side {
            transform: translateX(0);
        }
        .main,
        .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        .ruoyi-tab-container {
            height: auto !important;
        }
        .ruoyi-tab-container .layui-tab-title,
        .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .ruoyi-tab-content-wrapper,
        .layui-tab-content,
        .layui-tab-item,
        .admin-iframe {
            min-height: 70vh;
            height: auto !important;
            position: relative !important;
        }
        .layui-form-item {
            margin-bottom: 14px;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        body.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-title">🔐 OnAuth 运营管理中台</div>

    <form class="layui-form" lay-filter="loginForm">
        <!-- 账户输入域 -->
        <div class="layui-form-item">
            <i class="layui-icon layui-icon-username input-icon"></i>
            <input type="text" name="username" lay-verify="required" lay-reqtext="请输入安全访问账户" placeholder="请输入账户" class="layui-input" autocomplete="off">
        </div>

        <!-- 凭证输入域 -->
        <div class="layui-form-item">
            <i class="layui-icon layui-icon-password input-icon"></i>
            <input type="password" name="password" lay-verify="required" lay-reqtext="请输入登录认证密码" placeholder="请输入登录密码" class="layui-input" autocomplete="off">
        </div>

        <!-- 验证码输入域（动态显示） -->
        <div class="layui-form-item" id="captchaRow" style="display:none;">
            <i class="layui-icon layui-icon-vercode input-icon"></i>
            <input type="text" name="captcha_code" placeholder="请输入验证码" class="layui-input" autocomplete="off" style="padding-right: 120px;">
            <input type="hidden" name="captcha_token" id="captchaToken">
            <img id="captchaImage" alt="验证码" style="position:absolute; right:8px; top:50%; transform: translateY(-50%); height:32px; cursor:pointer; border-radius:4px;">
        </div>

        <!-- 授信登录动作 -->
        <div class="layui-form-item" style="margin-top: 26px; margin-bottom: 5px;">
            <button class="layui-btn layui-btn-fluid btn-login-theme" lay-submit lay-filter="doLogin">安全验证并登录</button>
        </div>

        <!-- 属性下摆跳转 -->
        <div class="link-reg">
            <a href="/register">还没有中台账号？申请注册网络凭证 &raquo;</a>
        </div>
    </form>
</div>

<script>
layui.use(['form', 'layer'], function(){
    var form = layui.form, layer = layui.layer, $ = layui.$;

    const loadCaptcha = function(){
        $.get('/system/captcha', function(res){
            if (!res || res.code !== 200) {
                return;
            }
            $('#captchaToken').val(res.data.token);
            $('#captchaImage').attr('src', res.data.image);
            $('#captchaRow').show();
        });
    };

    $('#captchaImage').on('click', function(){
        loadCaptcha();
    });

    // 🛡️ 边界防御：防 Iframe 跨域嵌套与点击劫持
    if (window !== window.top) {
        window.top.location.href = window.location.href;
    }

    // 监听授信提交
    form.on('submit(doLogin)', function(data){
        const loading = layer.load(2);

        $.ajax({
            url: '/admin/token',
            type: 'POST',
            data: JSON.stringify(data.field),
            contentType: 'application/json',
            success: function(res){
                layer.close(loading);
                layer.msg('凭证授信成功，正在引导注入...', {icon: 1, time: 1000}, function(){
                    // 核心 HttpOnly Cookie 已就绪，直接流转主舱顶层域
                    window.top.location.href = '/index';
                });
            },
            error: function(err){
                layer.close(loading);
                const res = err.responseJSON || {};
                if (res.captcha_required) {
                    $('#captchaToken').val(res.captcha_token || '');
                    $('#captchaImage').attr('src', res.captcha_image || '');
                    $('#captchaRow').show();
                }
                // 精细化读取拦截网格下发的详细错误
                var errMsg = res.message || res.detail || '身份认证失败，凭证不正确';
                layer.msg(errMsg, {icon: 2, shift: 6});
            }
        });
        return false;
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.addEventListener("click", function () {
                document.body.classList.toggle("onauth-mobile-nav-open");
            });
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                document.body.classList.remove("onauth-mobile-nav-open");
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    document.body.classList.remove("onauth-mobile-nav-open");
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
