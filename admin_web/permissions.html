<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>权限节点管理 - OnAuth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body {
            padding: 15px;
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }
        .card-wrapper {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            border: 1px solid #ebeef5;
        }
        .action-bar { margin-bottom: 15px; }

        .btn-theme-blue {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px !important;
            height: 36px !important;
            line-height: 36px !important;
            padding: 0 16px !important;
            font-size: 13px !important;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .layui-table-view { border: 1px solid #ebeef5 !important; border-radius: 6px !important; overflow: hidden; }
        .layui-table th { background-color: #f8fafc !important; color: #475569 !important; font-weight: 600; height: 44px; }
        .layui-table td { height: 48px; }

        .btn-matrix-ops { background: transparent !important; border-radius: 4px !important; padding: 0 8px !important; transition: all 0.2s; font-size: 12px !important; }

        /* 正常状态下的粉碎删除按钮 */
        .btn-matrix-del { color: #ef4444 !important; border: 1px solid rgba(239, 68, 68, 0.2) !important; cursor: pointer; }
        .btn-matrix-del:hover { background: #fef2f2 !important; border-color: #ef4444 !important; }

        /* 专门用于 7 个黄金核心根节点的置灰禁用样式 */
        .btn-matrix-del-disabled {
            color: #94a3b8 !important;
            border: 1px solid #e2e8f0 !important;
            background: #f1f5f9 !important;
            cursor: not-allowed !important;
            opacity: 0.6;
        }

        .pop-matrix-container { padding: 25px 30px 10px 10px; }
        .layui-form-label { color: #4b5563; font-weight: 500; width: 95px; }
        .layui-input-block { margin-left: 125px; }

        .layui-input, .layui-textarea {
            border-radius: 6px !important;
            border-color: #d1d5db !important;
            transition: all 0.2s;
        }
        .layui-input { height: 36px; }
        .layui-input:focus, .layui-textarea:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 56px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            font-size: 15px !important;
        }
        body.onauth-shell .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: 70vh;
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>
<body>

<div class="card-wrapper">
    <div class="action-bar">
        <button class="layui-btn btn-theme-blue" id="btn-add-perm">
            <i class="layui-icon layui-icon-add-1" style="font-size:13px; margin-right:3px;"></i> 创建全新核心权限节点
        </button>
    </div>

    <table id="perm-table" lay-filter="permTable"></table>
</div>

<script type="text/html" id="table-bar">
    {% raw %}
    <div style="display: flex; gap: 6px; justify-content: center; align-items: center; height: 100%;">
        <button class="layui-btn layui-btn-xs btn-matrix-ops btn-matrix-del-disabled" lay-event="disabled_del_tip">不可删除</button>
    </div>
    {% endraw %}
</script>

<div id="perm-dialog" style="display: none;">
    <form class="layui-form pop-matrix-container" id="actual-perm-form">
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444">*</span> 节点标识键</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" placeholder="如：admin:write, user:delete" class="layui-input" autocomplete="off">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">职责描述</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="请输入当前原子的权限节点范围明细描述..." class="layui-textarea" style="height: 80px; resize: none;"></textarea>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
<script>
layui.use(['table', 'form', 'layer'], function(){
    const table = layui.table;
    const form = layui.form;
    const layer = layui.layer;
    const $ = layui.$;

    // 1. 数据资产表格主网格渲染
    table.render({
        elem: '#perm-table',
        url: '/api/v1/permission/node.list',
        parseData: function(res) {
            return {
                "code": res.status === "success" ? 0 : 500,
                "msg": res.message || "",
                "count": res.count || 0,
                "data": res.data || []
            };
        },
        page: true,
        limit: 20,
        escape: true,
        cols: [[
            {field: 'permission_id', title: '节点内部 ID', width: 120, sort: true, align: 'center'},
            {field: 'name', title: '权限节点唯一标识键 (name)', width: 280, style: 'font-family: monospace; font-weight: 600; color: #1e293b;'},
            {field: 'description', title: '职责细节描述描述'},
            {title: '全维审计操作', width: 150, toolbar: '#table-bar', align: 'center', fixed: 'right', escape: false}
        ]]
    });

    // 2. 统一安全的 HTTP 交互请求流
    function executeAjax(url, method, data, callback) {
        const loading = layer.load(2);
        $.ajax({
            url: url,
            type: method,
            data: JSON.stringify(data || {}),
            contentType: 'application/json',
            dataType: 'json',
            success: function(res) {
                layer.close(loading);
                if(res.status === 'success') {
                    layer.msg(res.message || '操作同步成功', {icon: 1, time: 1200});
                    if(callback) callback(res);
                } else {
                    layer.msg(res.message || '执行链路被阻断', {icon: 2});
                }
            },
            error: function(xhr) {
                layer.close(loading);
                layer.msg(xhr.responseJSON?.detail || '网关通信异常，拒绝响应', {icon: 2, time: 3000});
                table.reload('perm-table');
            }
        });
    }

    // 3. 唤起节点添加对话框
    $('#btn-add-perm').click(function(){
        layer.open({
            type: 1,
            title: '🚀 签发注册全新原子权限节点',
            area: ['480px', '315px'],
            content: $('#perm-dialog').html(),
            btn: ['核准部署', '撤回'],
            success: function(layero){
                layero.find('.layui-layer-btn0').css({
                    'background': 'linear-gradient(135deg, #2563eb, #1d4ed8)',
                    'border-color': '#2563eb'
                });
            },
            yes: function(layerIndex, layero) {
                const name = layero.find('input[name="name"]').val().trim();
                const description = layero.find('textarea[name="description"]').val().trim();

                if(!name) {
                    layer.msg('核心标识键不可留空', {icon: 5, shift: 6});
                    return false;
                }

                const queryData = { name: name, description: description };
                executeAjax('/api/v1/permission/permission.create', 'POST', queryData, function(){
                    layer.close(layerIndex);
                    table.reload('perm-table');
                });
            }
        });
    });

    // 4. 行内删除监听器
    table.on('tool(permTable)', function(obj){
        const data = obj.data;
        if(obj.event === 'disabled_del_tip') {
            layer.msg('核心安全策略：该节点属于系统全局根授信底层底座，禁止物理擦除！', {icon: 4});
        }
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.addEventListener("click", function () {
                document.body.classList.toggle("onauth-mobile-nav-open");
            });
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                document.body.classList.remove("onauth-mobile-nav-open");
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    document.body.classList.remove("onauth-mobile-nav-open");
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
