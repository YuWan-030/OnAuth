<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Webhook 事件回调集成中心 - OnAuth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body {
            padding: 15px;
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }
        .card-wrapper {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            border: 1px solid #ebeef5;
            margin-bottom: 15px;
        }
        .action-bar { margin-bottom: 15px; }

        .btn-theme-blue {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px !important;
            height: 36px !important;
            line-height: 36px !important;
            padding: 0 16px !important;
            font-size: 13px !important;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .layui-table-view { border: 1px solid #ebeef5 !important; border-radius: 6px !important; overflow: hidden; }
        .layui-table th { background-color: #f8fafc !important; color: #475569 !important; font-weight: 600; height: 44px; }
        .layui-table td { height: 48px; }

        .btn-matrix-ops { background: transparent !important; border-radius: 4px !important; padding: 0 8px !important; transition: all 0.2s; font-size: 12px !important; }
        .btn-matrix-edit { color: #2563eb !important; border: 1px solid rgba(37, 99, 235, 0.25) !important; cursor: pointer; }
        .btn-matrix-edit:hover { background: #eff6ff !important; border-color: #2563eb !important; }
        .btn-matrix-test { color: #7c3aed !important; border: 1px solid rgba(124, 58, 237, 0.25) !important; cursor: pointer; }
        .btn-matrix-test:hover { background: #f5f3ff !important; border-color: #7c3aed !important; }
        .btn-matrix-del { color: #ef4444 !important; border: 1px solid rgba(239, 68, 68, 0.2) !important; cursor: pointer; }
        .btn-matrix-del:hover { background: #fef2f2 !important; border-color: #ef4444 !important; }

        .pop-matrix-container { padding: 25px 30px 20px 20px; }
        .layui-form-label { color: #4b5563; font-weight: 500; width: 100px; }
        .layui-input-block { margin-left: 130px; }

        .layui-input { height: 36px; border-radius: 6px !important; border-color: #d1d5db !important; }
        .layui-input:focus { border-color: #2563eb !important; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important; }

        .event-checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-top: 6px; }
        .badge-event { background-color: #f1f5f9; color: #475569; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-family: monospace; border: 1px solid #e2e8f0; margin-right: 4px; display: inline-block; }
        .template-tip { color: #64748b; font-size: 12px; line-height: 1.7; }
        .template-hidden { display: none; }
        .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 3010;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(10px);
        cursor: pointer;
    }
    .onauth-burger,
    .onauth-burger::before,
    .onauth-burger::after {
        display: block;
        width: 16px;
        height: 2px;
        border-radius: 2px;
        background: #ffffff;
        content: "";
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .onauth-burger {
        position: relative;
        margin: 0 auto;
    }
    .onauth-burger::before {
        position: absolute;
        left: 0;
        top: -5px;
    }
    .onauth-burger::after {
        position: absolute;
        left: 0;
        top: 5px;
    }
    body.onauth-mobile-nav-open .onauth-burger {
        background: transparent;
    }
    body.onauth-mobile-nav-open .onauth-burger::before {
        top: 0;
        transform: rotate(45deg);
    }
    body.onauth-mobile-nav-open .onauth-burger::after {
        top: 0;
        transform: rotate(-45deg);
    }
    .onauth-mobile-mask {
        display: none;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area,
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: 52px !important;
            min-height: 52px;
            padding: 6px 10px 6px 50px !important;
            gap: 8px;
            flex-wrap: nowrap;
            align-items: center;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            flex: 1;
            max-width: calc(100% - 86px);
            font-size: 13px !important;
            line-height: 1;
        }
        body.onauth-shell .logo-area > div:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .logo-icon {
            width: 26px !important;
            height: 26px !important;
            margin-right: 6px !important;
            font-size: 14px !important;
        }
        body.onauth-shell .header-meta .pill,
        body.onauth-shell .tenant-user-area #tenant-name,
        body.onauth-shell .tenant-user-area #tenant-status,
        body.onauth-shell .user-info-area #tenant-pill {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item,
        body.onauth-shell .tenant-user-area .layui-nav-item {
            line-height: 32px !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a,
        body.onauth-shell .tenant-user-area .layui-nav-item > a {
            width: 36px !important;
            min-width: 36px !important;
            max-width: 36px !important;
            padding: 0 16px 0 4px !important;
            font-size: 12px !important;
            justify-content: center !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a span,
        body.onauth-shell .tenant-user-area .layui-nav-item > a span {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a i,
        body.onauth-shell .tenant-user-area .layui-nav-item > a i {
            margin-right: 0 !important;
        }
        body.onauth-shell .user-info-area .layui-nav .layui-nav-more,
        body.onauth-shell .tenant-user-area .layui-nav .layui-nav-more {
            right: 2px !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(74vw, 250px) !important;
            max-width: 250px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            box-shadow: 14px 0 28px rgba(15, 23, 42, 0.22);
            z-index: 3005 !important;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            background: rgba(31, 41, 55, 0.97) !important;
            backdrop-filter: blur(10px);
        }
        body.onauth-shell .side-menu {
            width: 100% !important;
        }
        body.onauth-shell .side-menu .layui-nav-item > a,
        body.onauth-shell .side-menu .layui-nav-child dd a {
            padding-left: 14px !important;
            font-size: 13px !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            height: 36px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li,
        body.onauth-shell .layui-tab-title li {
            line-height: 36px !important;
            height: 36px !important;
            padding: 0 10px !important;
            font-size: 13px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close,
        body.onauth-shell .layui-tab-title li .layui-tab-close {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            border-radius: 999px;
            color: #64748b !important;
            background: rgba(148, 163, 184, 0.18);
            font-size: 12px;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover,
        body.onauth-shell .layui-tab-title li .layui-tab-close:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.88);
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: calc(100vh - 100px);
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        body.onauth-shell .onauth-mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            z-index: 3003;
        }
        body.onauth-mobile-nav-open.onauth-shell .onauth-mobile-mask {
            display: block;
        }
        body.onauth-mobile-nav-open.onauth-shell {
            overflow: hidden !important;
        }
    }
</style>
</head>
<body>

<div class="card-wrapper">
    <div class="action-bar">
        <button class="layui-btn btn-theme-blue" id="btn-add-webhook">
            <i class="layui-icon layui-icon-add-1" style="font-size:13px; margin-right:3px;"></i> 配置全新 Webhook 订阅端点
        </button>
    </div>

    <table id="webhook-table" lay-filter="webhookTable"></table>
</div>

<div class="card-wrapper">
    <div class="action-bar" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <select id="log-webhook-filter" class="layui-input" style="width:280px;">
            <option value="">全部 Webhook 日志</option>
        </select>
        <button class="layui-btn layui-btn-primary" id="btn-refresh-logs">刷新投递日志</button>
    </div>
    <table id="webhook-log-table"></table>
</div>

<script type="text/html" id="table-bar">
    {% raw %}
    <div style="display: flex; gap: 6px; justify-content: center; align-items: center; height: 100%;">
        <button class="layui-btn layui-btn-xs btn-matrix-ops btn-matrix-edit" lay-event="edit">编辑</button>
        <button class="layui-btn layui-btn-xs btn-matrix-ops" style="color:#0f766e;border:1px solid rgba(15,118,110,.25);" lay-event="template">编辑模板</button>
        <button class="layui-btn layui-btn-xs btn-matrix-ops btn-matrix-test" lay-event="test">测试推送</button>
        <button class="layui-btn layui-btn-xs btn-matrix-ops btn-matrix-del" lay-event="del">断开端点</button>
    </div>
    {% endraw %}
</script>

<script type="text/html" id="status-tpl">
    {% raw %}
    <input type="checkbox" name="is_active" value="{{d.id}}" lay-skin="switch" lay-text="活动|挂起" lay-filter="statusSwitch" {{ d.is_active ? 'checked' : '' }}>
    {% endraw %}
</script>

<script type="text/html" id="events-tpl">
    {% raw %}
    <div>
        {{# layui.each(d.events, function(index, item){ }}
            <span class="badge-event">{{ window.webhookEventLabel(item) }}</span>
        {{# }); }}
    </div>
    {% endraw %}
</script>

<script type="text/html" id="template-tpl">
    {% raw %}
    <span class="badge-event">{{ d.template_type || 'onauth_default' }}</span>
    {% endraw %}
</script>

<div id="webhook-dialog" style="display: none;">
    <form class="layui-form pop-matrix-container" id="actual-webhook-form" lay-filter="webhookForm">
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444">*</span> 订阅名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" required lay-verify="required" placeholder="如：生产环境商户同步" class="layui-input" autocomplete="off">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444">*</span> 回调 URL</label>
            <div class="layui-input-block">
                <input type="url" name="url" required lay-verify="required|url" placeholder="接收 POST 请求的完整 HTTPS 终点路径" class="layui-input" autocomplete="off">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">验签密钥 (Secret)</label>
            <div class="layui-input-block">
                <input type="text" name="secret" placeholder="可选：用于生成 X-OnAuth-Signature 的 HmacSHA256 密钥" class="layui-input" autocomplete="off">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444">*</span> 订阅事件</label>
            <div class="layui-input-block event-checkbox-grid">
                <input type="checkbox" name="events[tenant_space.apply]" title="空间申请" value="tenant_space.apply" lay-skin="primary" checked>
                <input type="checkbox" name="events[tenant_space.review]" title="空间审核" value="tenant_space.review" lay-skin="primary">
                <input type="checkbox" name="events[tenant_space.assign]" title="空间分配" value="tenant_space.assign" lay-skin="primary">
                <input type="checkbox" name="events[user.create]" title="用户创建" value="user.create" lay-skin="primary" checked>
                <input type="checkbox" name="events[user.delete]" title="用户移除" value="user.delete" lay-skin="primary">
                <input type="checkbox" name="events[role.update]" title="权限修调" value="role.update" lay-skin="primary">
                <input type="checkbox" name="events[auth.login]" title="授信登录" value="auth.login" lay-skin="primary">
                <input type="checkbox" name="events[tenant_admin.create]" title="租户管理员注册" value="tenant_admin.create" lay-skin="primary">
                <input type="checkbox" name="events[tenant_app.create]" title="应用创建" value="tenant_app.create" lay-skin="primary">
                <input type="checkbox" name="events[tenant_credential.create]" title="凭证签发" value="tenant_credential.create" lay-skin="primary">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444">*</span> 发送模板</label>
            <div class="layui-input-block">
                <select name="template_type" class="layui-input webhook-template-select">
                    <option value="onauth_default">OnAuth 默认 JSON</option>
                    <option value="wecom_markdown">企业微信 Markdown</option>
                    <option value="wecom_template_card">企业微信 文本通知模板卡片</option>
                    <option value="dingtalk_markdown">钉钉 Markdown</option>
                    <option value="feishu_text">飞书 Text</option>
                    <option value="custom_json">自定义 JSON 模板</option>
                </select>
                <div class="template-tip">模板变量: <code>{event_type}</code> <code>{sent_at}</code> <code>{payload_json}</code> 以及 <code>{payload_xxx}</code></div>
            </div>
        </div>

        <div class="layui-form-item template-hidden webhook-custom-template-wrap">
            <label class="layui-form-label">自定义模板</label>
            <div class="layui-input-block">
                <textarea name="custom_template" class="layui-textarea" style="min-height:120px;" placeholder='{"msg_type":"text","content":{"text":"事件 {event_type}\\n内容: {payload_json}"}}'></textarea>
                <div class="preset-row">
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs btn-template-preset" data-preset="wecom">企业微信示例</button>
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs btn-template-preset" data-preset="dingtalk">钉钉示例</button>
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs btn-template-preset" data-preset="feishu">飞书示例</button>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
<script>
layui.use(['table', 'form', 'layer', 'util'], function(){
    const table = layui.table;
    const form = layui.form;
    const layer = layui.layer;
    const util = layui.util;
    const $ = layui.$;
    let WEBHOOK_EVENT_LABELS = {};

    const TEMPLATE_PRESETS = {
        wecom: {
            msgtype: 'markdown',
            markdown: {
                content: '**OnAuth 事件通知**\\n> 事件: `{event_type}`\\n> 时间: {sent_at}\\n> 明细: {payload_json}'
            }
        },
        dingtalk: {
            msgtype: 'markdown',
            markdown: {
                title: 'OnAuth {event_type}',
                text: '### OnAuth 事件通知\\n- 事件: `{event_type}`\\n- 时间: {sent_at}\\n- 明细: {payload_json}'
            }
        },
        feishu: {
            msg_type: 'text',
            content: {
                text: 'OnAuth 事件 {event_type}\\n时间: {sent_at}\\n明细: {payload_json}'
            }
        }
    };

    function normalizeTemplateType(raw) {
        const value = (raw || '').toString().trim();
        return value || 'onauth_default';
    }

    function webhookEventLabel(eventType) {
        const raw = (eventType || '').toString();
        const cn = WEBHOOK_EVENT_LABELS[raw];
        return cn ? `${cn} (${raw})` : raw;
    }
    window.webhookEventLabel = webhookEventLabel;

    function loadWebhookMeta(done) {
        $.ajax({
            url: '/api/v1/webhook/template.options',
            type: 'GET',
            dataType: 'json',
            success: function(res) {
                if (res && res.status === 'success' && res.event_labels && typeof res.event_labels === 'object') {
                    WEBHOOK_EVENT_LABELS = res.event_labels;
                }
            },
            complete: function() {
                if (typeof done === 'function') done();
            }
        });
    }

    function bindTemplateSelector(layero, options) {
        const templateOnly = !!(options && options.templateOnly);
        const $select = layero.find('.webhook-template-select');
        const $customWrap = layero.find('.webhook-custom-template-wrap');
        const $customTextarea = layero.find('textarea[name="custom_template"]');
        function refreshVisibility() {
            const isCustom = ($select.val() || '') === 'custom_json';
            $customWrap.toggleClass('template-hidden', !(isCustom || templateOnly));
            if ((isCustom || templateOnly) && !$customTextarea.val().trim()) {
                $customTextarea.val(JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2));
            }
        }
        $select.on('change', refreshVisibility);
        layero.find('.btn-template-preset').on('click', function(){
            const presetName = ($(this).data('preset') || '').toString();
            const preset = TEMPLATE_PRESETS[presetName];
            if (!preset) return;
            $select.val('custom_json');
            layero.find('textarea[name="custom_template"]').val(JSON.stringify(preset, null, 2));
            form.render('select');
            refreshVisibility();
        });
        refreshVisibility();
    }

    function collectDialogPayload(layero) {
        const name = layero.find('input[name="name"]').val().trim();
        const url = layero.find('input[name="url"]').val().trim();
        const secret = layero.find('input[name="secret"]').val().trim();
        const templateType = normalizeTemplateType(layero.find('select[name="template_type"]').val());
        let customTemplate = layero.find('textarea[name="custom_template"]').val().trim();
        const selectedEvents = [];
        layero.find('.event-checkbox-grid input[type="checkbox"]:checked').each(function(){
            selectedEvents.push($(this).val());
        });

        if(!name || !url) {
            layer.msg('关键字段不可为空', {icon: 5, shift: 6});
            return null;
        }
        if(selectedEvents.length === 0) {
            layer.msg('请至少订阅一个事件', {icon: 5, shift: 6});
            return null;
        }
        if (templateType === 'custom_json' && !customTemplate) {
            customTemplate = JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2);
            layero.find('textarea[name="custom_template"]').val(customTemplate);
        }

        return {
            name: name,
            url: url,
            secret: secret ? secret : null,
            events: selectedEvents,
            template_type: templateType,
            custom_template: templateType === 'custom_json' ? customTemplate : null
        };
    }

    function collectTemplateOnlyPayload(layero, rowData) {
        const templateType = normalizeTemplateType(layero.find('select[name="template_type"]').val());
        let customTemplate = layero.find('textarea[name="custom_template"]').val().trim();
        if (templateType === 'custom_json' && !customTemplate) {
            customTemplate = JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2);
            layero.find('textarea[name="custom_template"]').val(customTemplate);
        }
        return {
            id: rowData.id,
            template_type: templateType,
            custom_template: templateType === 'custom_json' ? customTemplate : null
        };
    }

    function openWebhookDialog(mode, rowData, options) {
        const isEdit = mode === 'edit';
        const focusCustomTemplate = !!(options && options.focusCustomTemplate);
        const templateOnly = !!(options && options.templateOnly);
        layer.open({
            type: 1,
            title: templateOnly ? `编辑模板 #${rowData.id}` : (isEdit ? `编辑 Webhook 配置 #${rowData.id}` : '注册全新 Webhook 异步分发端点'),
            area: templateOnly ? ['760px', '700px'] : ['620px', '680px'],
            content: $('#webhook-dialog').html(),
            btn: [templateOnly ? '保存模板' : (isEdit ? '保存修改' : '核准接入'), '取消'],
            success: function(layero){
                form.render();
                bindTemplateSelector(layero, {templateOnly: templateOnly});

                if (templateOnly) {
                    layero.find('input[name="name"]').closest('.layui-form-item').hide();
                    layero.find('input[name="url"]').closest('.layui-form-item').hide();
                    layero.find('input[name="secret"]').closest('.layui-form-item').hide();
                    layero.find('.event-checkbox-grid').closest('.layui-form-item').hide();
                }

                if (isEdit && rowData) {
                    layero.find('input[name="name"]').val(rowData.name || '');
                    layero.find('input[name="url"]').val(rowData.url || '');
                    layero.find('input[name="secret"]').val(rowData.secret || '');
                    layero.find('.event-checkbox-grid input[type="checkbox"]').prop('checked', false);
                    (rowData.events || []).forEach(function(item){
                        layero.find('.event-checkbox-grid input[value="' + item + '"]').prop('checked', true);
                    });
                    layero.find('select[name="template_type"]').val(normalizeTemplateType(rowData.template_type));
                    layero.find('textarea[name="custom_template"]').val(rowData.custom_template || '');
                    form.render();
                }

                if (focusCustomTemplate) {
                    const $select = layero.find('select[name="template_type"]');
                    if (normalizeTemplateType($select.val()) !== 'custom_json') {
                        $select.val('custom_json');
                    }
                    const $textarea = layero.find('textarea[name="custom_template"]');
                    if (!$textarea.val().trim()) {
                        $textarea.val(JSON.stringify(TEMPLATE_PRESETS.wecom, null, 2));
                    }
                    form.render('select');
                }
                layero.find('.webhook-template-select').trigger('change');
                if (templateOnly) {
                    layero.find('textarea[name="custom_template"]').css('min-height', '360px');
                }
                if (focusCustomTemplate) {
                    setTimeout(function(){
                        layero.find('textarea[name="custom_template"]').trigger('focus');
                    }, 0);
                }

                layero.find('.layui-layer-btn0').css({
                    'background': 'linear-gradient(135deg, #2563eb, #1d4ed8)',
                    'border-color': '#2563eb'
                });
            },
            yes: function(layerIndex, layero) {
                const payload = templateOnly ? collectTemplateOnlyPayload(layero, rowData) : collectDialogPayload(layero);
                if (!payload) return false;
                if (!templateOnly) {
                    payload.is_active = isEdit ? !!rowData.is_active : true;
                    if (isEdit) payload.id = rowData.id;
                }

                executeAjax(
                    isEdit ? '/api/v1/webhook/config.update' : '/api/v1/webhook/config.create',
                    'POST',
                    JSON.stringify(payload),
                    'application/json',
                    function(){
                        layer.close(layerIndex);
                        table.reload('webhook-table');
                    }
                );
            }
        });
    }

    function triggerTestPush(rowData) {
        layer.confirm(`对 [${rowData.name}] 发送一条模拟事件做联通测试？`, {
            icon: 3,
            title: '测试推送'
        }, function(index){
            executeAjax(
                '/api/v1/webhook/test.push',
                'POST',
                JSON.stringify({id: rowData.id}),
                'application/json',
                function(){
                    layer.close(index);
                    loadWebhookLogs();
                }
            );
        });
    }

    function loadWebhookConfigs() {
        table.render({
            elem: '#webhook-table',
            id: 'webhook-table',
            url: '/api/v1/webhook/config.list',
            parseData: function(res) {
                const rows = Array.isArray(res.data) ? res.data : [];
                rows.forEach(function(item){
                    item.template_type = normalizeTemplateType(item.template_type);
                });
                return { "code": res.status === "success" ? 0 : 500, "msg": res.message || "", "data": rows };
            },
            page: false,
            escape: true,
            cols: [[
                {field: 'id', title: '配置 ID', width: 80, sort: true, align: 'center'},
                {field: 'name', title: '订阅端点名称', width: 180, style: 'font-weight: 600; color: #1e293b;'},
                {field: 'url', title: '物理接收网关 URL (POST)', width: 280, style: 'font-family: monospace; color: #2563eb;'},
                {field: 'events', title: '订阅的原子事件域', width: 260, templet: '#events-tpl', escape: false},
                {field: 'template_type', title: '发送模板', width: 160, templet: '#template-tpl', align: 'center', escape: false},
                {field: 'creator_id', title: '所有权归属 (Creator)', width: 130, align: 'center', style: 'color: #64748b; font-family: monospace;'},
                {field: 'is_active', title: '服务状态', width: 110, templet: '#status-tpl', align: 'center', escape: false},
                {title: '操作', width: 320, toolbar: '#table-bar', align: 'center', fixed: 'right', escape: false}
            ]],
            done: function(res){
                const rows = Array.isArray(res.data) ? res.data : [];
                const $filter = $('#log-webhook-filter');
                const selected = $filter.val() || '';
                $filter.empty().append('<option value="">全部 Webhook 日志</option>');
                rows.forEach(function(item){
                    $filter.append('<option value="' + item.id + '">' + item.name + ' (#' + item.id + ')</option>');
                });
                if (selected) {
                    $filter.val(selected);
                }
                form.render('select');
            }
        });
    }

    function loadWebhookLogs() {
        const webhookId = ($('#log-webhook-filter').val() || '').trim();
        const reqUrl = webhookId ? '/api/v1/webhook/logs.list?webhook_id=' + encodeURIComponent(webhookId) : '/api/v1/webhook/logs.list';
        table.render({
            elem: '#webhook-log-table',
            id: 'webhook-log-table',
            url: reqUrl,
            parseData: function(res){
                return {"code": res.status === 'success' ? 0 : 500, "msg": res.message || '', "data": res.data || []};
            },
            page: false,
            cols: [[
                {field:'log_id', title:'日志ID', width:90, sort:true},
                {field:'webhook_id', title:'Webhook', width:90},
                {field:'event_type', title:'事件类型', width:170},
                {field:'status_code', title:'HTTP', width:80, align:'center'},
                {field:'duration_ms', title:'耗时(ms)', width:90, align:'center'},
                {field:'is_success', title:'结果', width:90, templet: function(d){ return d.is_success ? '<span style="color:#15803d;">成功</span>' : '<span style="color:#b91c1c;">失败</span>'; }},
                {field:'response_body', title:'响应摘要', minWidth:220, templet: function(d){ return util.escape((d.response_body || '-').slice(0, 200)); }},
                {field:'timestamp', title:'时间', width:170}
            ]]
        });
    }

    function executeAjax(url, method, data, contentType = 'application/x-www-form-urlencoded', callback) {
        const loading = layer.load(2);
        $.ajax({
            url: url,
            type: method,
            data: data,
            contentType: contentType,
            dataType: 'json',
            success: function(res) {
                layer.close(loading);
                if(res.status === 'success') {
                    layer.msg(res.message || '操作同步成功', {icon: 1, time: 1200});
                    if(callback) callback(res);
                    loadWebhookLogs();
                } else {
                    layer.msg(res.message || '执行链路被阻断', {icon: 2});
                }
            },
            error: function(xhr) {
                layer.close(loading);
                layer.msg(xhr.responseJSON?.detail || '网关通信异常，拒绝响应', {icon: 2, time: 3000});
                table.reload('webhook-table');
            }
        });
    }

    $('#btn-add-webhook').click(function(){
        openWebhookDialog('create', null);
    });

    form.on('switch(statusSwitch)', function(data){
        const payload = {id: parseInt(data.value, 10), is_active: data.elem.checked};
        executeAjax('/api/v1/webhook/config.update', 'POST', JSON.stringify(payload), 'application/json');
    });

    table.on('tool(webhookTable)', function(obj){
        const data = obj.data;
        if (obj.event === 'edit') {
            openWebhookDialog('edit', data);
            return;
        }
        if (obj.event === 'template') {
            openWebhookDialog('edit', data, {focusCustomTemplate: true, templateOnly: true});
            return;
        }
        if (obj.event === 'test') {
            triggerTestPush(data);
            return;
        }
        if(obj.event === 'del') {
            layer.confirm(`确认物理注销并断开订阅端点 [${data.name}] 吗？`, {
                icon: 3,
                title: 'Webhook 资产审计清退',
                success: (layero) => { layero.find('.layui-layer-btn0').css('background-color', '#ef4444'); }
            }, function(index){
                executeAjax(`/api/v1/webhook/config.delete?id=${data.id}`, 'DELETE', {}, 'application/x-www-form-urlencoded', function(){
                    layer.close(index);
                    table.reload('webhook-table');
                });
            });
        }
    });

    $('#btn-refresh-logs').on('click', function(){ loadWebhookLogs(); });
    $('#log-webhook-filter').on('change', function(){ loadWebhookLogs(); });

    loadWebhookMeta(function(){
        loadWebhookConfigs();
        loadWebhookLogs();
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            var mask = document.createElement("div");
            mask.className = "onauth-mobile-mask";
            document.body.appendChild(mask);
            function closeMobileNav() {
                document.body.classList.remove("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
            function toggleMobileNav() {
                var willOpen = !document.body.classList.contains("onauth-mobile-nav-open");
                document.body.classList.toggle("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.addEventListener("click", toggleMobileNav);
            mask.addEventListener("click", closeMobileNav);
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                closeMobileNav();
            });
            side.addEventListener("click", function (evt) {
                // Only collapse drawer when a child menu item is clicked.
                var childMenuLink = evt.target.closest(".layui-nav-child dd a");
                if (childMenuLink) {
                    closeMobileNav();
                }
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    closeMobileNav();
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation"><span class="onauth-burger" aria-hidden="true"></span></button>
</body>
