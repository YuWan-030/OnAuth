<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnAuth - 多租户授权管理中台</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f5f7fb;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* =========================
           顶部 Header
        ========================= */
        .header {
            height: 60px;
            background: #111827;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg,#2563eb,#1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(37,99,235,.35);
        }

        /* =========================
           左侧菜单
        ========================= */
        .side {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: #1f2937;
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid rgba(255,255,255,.04);
        }

        .side::-webkit-scrollbar {
            width: 5px;
        }

        .side::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.1);
            border-radius: 10px;
        }

        .side-menu {
            width: 220px;
            background: transparent !important;
            padding-top: 10px;
        }

        .side-menu .layui-nav-item > a {
            height: 48px;
            line-height: 48px;
            padding-left: 22px !important;
            font-size: 14px;
            color: rgba(255,255,255,.82) !important;
            transition: all .2s ease;
        }

        .side-menu .layui-nav-item > a:hover {
            background: rgba(255,255,255,.04);
        }

        .side-menu .layui-nav-item i {
            margin-right: 12px;
            font-size: 16px;
        }

        .side-menu .layui-nav-child {
            background: rgba(0,0,0,.18) !important;
        }

        .side-menu .layui-nav-child dd a {
            padding-left: 52px !important;
            color: rgba(255,255,255,.72) !important;
            height: 42px;
            line-height: 42px;
        }

        .side-menu .layui-nav-child dd a:hover {
            background: rgba(255,255,255,.03);
        }

        .side-menu .layui-this > a,
        .side-menu .layui-nav-child dd.layui-this a {
            background: linear-gradient(90deg,#2563eb,#1d4ed8) !important;
            color: #fff !important;
        }

        /* =========================
           主区域
        ========================= */
        .main {
            position: fixed;
            left: 220px;
            top: 60px;
            right: 0;
            bottom: 0;
            background: #f3f4f6;
        }

        .layui-tab {
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .layui-tab-title {
            height: 46px;
            background: #fff;
            border-bottom: 1px solid #ebeef5;
            padding-left: 10px;
        }

        .layui-tab-title li {
            line-height: 46px;
        }

        .layui-tab-content {
            flex: 1;
            padding: 0;
            position: relative;
            background: #f3f4f6;
        }

        .layui-tab-item {
            height: 100%;
        }

        .admin-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* =========================
           用户信息区域
        ========================= */
        .user-info-area .layui-nav {
            background: transparent;
            padding: 0;
        }

        .user-info-area .layui-nav-item {
            line-height: 60px;
        }

        .user-info-area .layui-nav-item > a {
            color: #fff !important;
            padding: 0 12px !important;
            font-size: 14px;
        }

        .user-info-area .layui-nav-child a {
            color: #333 !important;
        }

        .logout-btn-icon {
            margin-right: 5px;
            color: #ff5722;
        }

        .pwd-btn-icon {
            margin-right: 5px;
            color: #1e9fff;
        }

        /* =========================
           修改密码弹窗
        ========================= */
        .pwd-form-wrapper {
            padding: 22px 25px 5px 10px;
        }

        .layui-layer-content {
            overflow: hidden !important;
        }
        /* =========================
           修复右上角下拉箭头错位
        ========================= */
        .user-info-area .layui-nav .layui-nav-item > a {
            padding-right: 30px !important; /* 给右侧的有箭头留出固定空间 */
            display: flex;
            align-items: center;
        }

        .user-info-area .layui-nav .layui-nav-item > a i.layui-icon-username {
            margin-right: 6px;
            font-size: 16px;
            vertical-align: middle;
        }

        /* 强制修正 LayUI 自动生成的三角箭头位置 */
        .user-info-area .layui-nav .layui-nav-more {
            top: -4px !important;
            margin-top: 5px !important; /* 经典垂直居中算法 */
            right: 10px !important;
            border-top-color: rgba(255, 255, 255, 0.7) !important; /* 让未展开时的箭头颜色更柔和 */
        }


    </style>
</head>

<body>

<!-- 顶部 -->
<div class="header">
    <div class="logo-area">
        <div class="logo-icon">🛡</div>
        <div>OnAuth · 多租户统一身份认证平台</div>
    </div>

    <div class="user-info-area">
        <ul class="layui-nav" lay-filter="headerNav">
            <li class="layui-nav-item">
                <a href="javascript:;">
                    <i class="layui-icon layui-icon-username"></i>
                    <span id="current-admin-name">正在鉴权...</span>
                </a>
                <dl class="layui-nav-child">
                    <dd>
                        <a href="javascript:;" id="btn-change-password">
                            <i class="layui-icon layui-icon-password pwd-btn-icon"></i>
                            修改密码
                        </a>
                    </dd>
                    <hr>
                    <dd>
                        <a href="javascript:;" id="btn-logout">
                            <i class="layui-icon layui-icon-logout logout-btn-icon"></i>
                            安全退出
                        </a>
                    </dd>
                </dl>
            </li>
        </ul>
    </div>
</div>

<!-- 左侧菜单 -->
<div class="side">
    <ul class="layui-nav layui-nav-tree side-menu" lay-filter="sideNav">
        <!-- 工作台 -->
        <li class="layui-nav-item layui-this">
            <a href="javascript:;" data-url="/dashboard" data-id="dashboard" data-title="工作台">
                <i class="layui-icon layui-icon-home"></i>
                <span>工作台</span>
            </a>
        </li>

        <!-- 租户中心 -->
        <li class="layui-nav-item layui-nav-itemed">
            <a href="javascript:;">
                <i class="layui-icon layui-icon-group"></i>
                <span>租户中心</span>
            </a>
            <dl class="layui-nav-child">
                <dd><a href="javascript:;" data-url="/admin/groups" data-id="groups" data-title="租户管理">租户管理</a></dd>
                <dd><a href="javascript:;" data-url="/admin/users" data-id="users" data-title="用户管理">用户管理</a></dd>
            </dl>
        </li>

        <!-- 应用接入 -->
        <li class="layui-nav-item">
            <a href="javascript:;">
                <i class="layui-icon layui-icon-app"></i>
                <span>应用接入</span>
            </a>
            <dl class="layui-nav-child">
                <dd><a href="javascript:;" data-url="/admin/apps" data-id="apps" data-title="应用管理">应用管理</a></dd>
                <dd><a href="javascript:;" data-url="/admin/credentials" data-id="credentials" data-title="OAuth 凭证">OAuth 凭证</a></dd>
                <dd><a href="javascript:;" data-url="/system/callbacks" data-id="callbacks" data-title="回调配置">WebHook 配置</a></dd>
            </dl>
        </li>
            <li class="layui-nav-item">
                <a href="javascript:;">
                    <i class="layui-icon layui-icon-key"></i>
                    <span>权限中心</span>
                </a>
                <dl class="layui-nav-child">
                    <dd><a href="javascript:;" data-url="/admin/roles" data-id="roles" data-title="权限组管理">权限组管理</a></dd>
                    <dd><a href="javascript:;" data-url="/admin/permissions" data-id="permissions" data-title="权限节点">权限节点管理</a></dd>
                </dl>
            </li>

        <!-- 安全中心 -->
        <li class="layui-nav-item">
            <a href="javascript:;">
                <i class="layui-icon layui-icon-auz"></i>
                <span>安全中心</span>
            </a>
            <dl class="layui-nav-child">
                <dd><a href="javascript:;" data-url="/system/audit" data-id="audit" data-title="审计日志">审计日志</a></dd>
                <dd><a href="javascript:;" data-url="/system/sessions" data-id="sessions" data-title="在线会话">在线会话</a></dd>
                <dd><a href="javascript:;" data-url="/system/risk" data-id="risk" data-title="风险控制">风险控制</a></dd>
            </dl>
        </li>

        <!-- 系统配置 -->
        <li class="layui-nav-item">
            <a href="javascript:;">
                <i class="layui-icon layui-icon-set"></i>
                <span>系统配置</span>
            </a>
            <dl class="layui-nav-child">
                <dd><a href="javascript:;" data-url="/system/settings" data-id="settings" data-title="基础配置">基础配置</a></dd>
                <dd><a href="javascript:;" data-url="/system/notices" data-id="notices" data-title="通知公告">通知公告</a></dd>
            </dl>
        </li>
    </ul>
</div>

<!-- 主体 -->
<div class="main">
    <div class="layui-tab" lay-filter="mainTabs" lay-allowclose="true">
        <ul class="layui-tab-title">
            <li lay-id="dashboard" class="layui-this">工作台</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <iframe class="admin-iframe" src="/dashboard"></iframe>
            </div>
        </div>
    </div>
</div>

<!-- 修改密码模板 -->
<div id="pwd-dialog-template" style="display:none;">
    <div class="pwd-form-wrapper">
        <form class="layui-form" lay-filter="pwdForm">
            <div class="layui-form-item">
                <label class="layui-form-label">当前密码</label>
                <div class="layui-input-block">
                    <input type="password" name="current_password" placeholder="请输入原登录密码" autocomplete="off" lay-verify="required" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">新密码</label>
                <div class="layui-input-block">
                    <input type="password" name="new_password" placeholder="请输入新密码" autocomplete="off" lay-verify="required|passLength" class="layui-input js-new-password">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">确认密码</label>
                <div class="layui-input-block">
                    <input type="password" name="confirm_password" placeholder="请再次输入新密码" autocomplete="off" lay-verify="required|passConfirm" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item" style="text-align:right;margin-top:25px;">
                <button type="button" class="layui-btn layui-btn-primary" id="btn-pwd-cancel">取消</button>
                <button type="submit" class="layui-btn" lay-submit lay-filter="submitPwd">确认修改</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>

<script>
layui.use(['element', 'jquery', 'layer', 'form'], function(){
    const $ = layui.$;
    const element = layui.element;
    const layer = layui.layer;
    const form = layui.form;

    $.ajaxSetup({
        complete: function(xhr) {
            if(xhr.status === 401) {
                window.top.location.href = '/login';
            }
        }
    });

    // =========================
    // 获取管理员信息
    // =========================
    function fetchAdminProfile() {
        $.ajax({
            url: '/admin/profile',
            type: 'GET',
            success: function(res){
                if(res.status === 'success') {
                    let displayName = res.nickname ? res.nickname : res.username;
                    $('#current-admin-name').text(displayName);
                    element.render('nav', 'headerNav');
                }
            },
            error: function() {
                $('#current-admin-name').text('未登录');
            }
        });
    }

    fetchAdminProfile();

    // =========================
    // Tab 管理（修复：未打开则创建，无论如何都执行切换高亮）
    // =========================
    $('.side-menu [data-url]').click(function(e){
        e.preventDefault();

        const url = $(this).attr('data-url');
        const id = $(this).attr('data-id');
        const title = $(this).attr('data-title');

        const isOpen = $(`.layui-tab-title li[lay-id="${id}"]`).length > 0;

        if(!isOpen) {
            element.tabAdd('mainTabs', {
                title: title,
                content: `<iframe class="admin-iframe" src="${url}"></iframe>`,
                id: id
            });
        }
        // 确保无论新建还是已打开，都调用切换
        element.tabChange('mainTabs', id);
    });

    // =========================
    // Tab 切换联动菜单（修复：精确匹配一级和二级菜单高亮）
    // =========================
    element.on('tab(mainTabs)', function(data){
        // 获取当前被点击/切换到的 Tab 的 lay-id
        const layId = $(this).attr('lay-id');

        // 清除左侧所有菜单的激活状态 (包括一级 li 和二级 dd)
        $('.side .side-menu .layui-this').removeClass('layui-this');

        // 匹配对应的 a 标签
        const $targetA = $(`.side .side-menu [data-id="${layId}"]`);
        if($targetA.length > 0) {
            // 如果是二级菜单里的 dd
            if($targetA.parents('dd').length > 0) {
                $targetA.parent('dd').addClass('layui-this');
            } else {
                // 如果是一级菜单里的 li（如：工作台）
                $targetA.parent('li').addClass('layui-this');
            }
        }
    });

    // =========================
    // 退出登录
    // =========================
    function executeLogout(quietly, successMsg) {
        $.ajax({
            url: '/auth/logout',
            type: 'POST',
            complete: function(){
                layer.closeAll('loading');
                document.cookie = "sso_session_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

                if(!quietly) {
                    layer.msg(successMsg || '已安全退出', {
                        icon: 1,
                        time: 1500
                    }, function(){
                        window.location.href = '/login';
                    });
                } else {
                    window.location.href = '/login';
                }
            }
        });
    }

    // =========================
    // 表单验证
    // =========================
    form.verify({
        passLength: function(value){
            if(value.length < 6) {
                return '密码长度至少 6 位';
            }
        },
        passConfirm: function(value, item){
            // 修复：针对当前弹窗内部的全新表单域获取新密码组件
            const $form = $(item).closest('form');
            const newPwd = $form.find('.js-new-password').val();

            if(value !== newPwd) {
                return '两次输入的密码不一致';
            }
        }
    });

    // =========================
    // 修改密码
    // =========================
    $('#btn-change-password').click(function(e){
        e.preventDefault();

        let pwdIndex = layer.open({
            type: 1,
            title: '修改当前账户密码',
            area: ['440px','320px'], // 微调高度避免内容溢出滚动条
            content: $('#pwd-dialog-template').html(),
            success: function(layero){
                // 必须在弹窗装载完 HTML 后，针对当前弹窗内的 DOM 重新进行表单渲染
                form.render(null, 'pwdForm');

                // 绑定取消按钮事件
                layero.find('#btn-pwd-cancel').click(function(){
                    layer.close(pwdIndex);
                });
            }
        });

        form.on('submit(submitPwd)', function(data){
            layer.load(2);

            $.ajax({
                url: '/auth/change_password',
                type: 'POST',
                data: {
                    current_password: data.field.current_password,
                    new_password: data.field.new_password
                },
                success: function(res){
                    layer.closeAll('loading');
                    if(res.status === 'success') {
                        layer.close(pwdIndex);
                        layer.alert('密码修改成功，请重新登录', {
                            icon: 1,
                            title: '系统通知',
                            closeBtn: 0
                        }, function(){
                            layer.load(2);
                            executeLogout(true);
                        });
                    } else {
                        layer.msg(res.message || '修改失败', { icon: 2 });
                    }
                },
                error: function(xhr){
                    layer.closeAll('loading');
                    let errorMsg = '系统通信异常';
                    if(xhr.responseJSON && xhr.responseJSON.detail) {
                        errorMsg = xhr.responseJSON.detail;
                    }
                    layer.msg('修改失败：' + errorMsg, { icon: 2, time: 3000 });
                }
            });

            return false; // 阻止表单原生跳转
        });
    });

    // =========================
    // 安全退出确认
    // =========================
    $('#btn-logout').click(function(e){
        e.preventDefault();
        layer.confirm('确定退出当前系统吗？', {
            icon: 3,
            title: '系统提示'
        }, function(){
            layer.load(2);
            executeLogout(false, '退出成功');
        });
    });
});
</script>

</body>
</html>
