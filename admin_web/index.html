<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnAuth - 多租户授权管理中台</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f5f7fb;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* =========================
           顶部 Header
        ========================= */
        .header {
            height: 60px;
            background: #111827;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg,#2563eb,#1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(37,99,235,.35);
        }

        /* =========================
           左侧菜单
        ========================= */
        .side {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: #1f2937;
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid rgba(255,255,255,.04);
        }

        .side::-webkit-scrollbar {
            width: 5px;
        }

        .side::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.1);
            border-radius: 10px;
        }

        .side-menu {
            width: 220px;
            background: transparent !important;
            padding-top: 10px;
        }

        .side-menu .layui-nav-item > a {
            height: 48px;
            line-height: 48px;
            padding-left: 22px !important;
            font-size: 14px;
            color: rgba(255,255,255,.82) !important;
            transition: all .2s ease;
        }

        .side-menu .layui-nav-item > a:hover {
            background: rgba(255,255,255,.04);
        }

        .side-menu .layui-nav-item i {
            margin-right: 12px;
            font-size: 16px;
        }

        .side-menu .layui-nav-child {
            background: rgba(0,0,0,.18) !important;
        }

        .side-menu .layui-nav-child dd a {
            padding-left: 52px !important;
            color: rgba(255,255,255,.72) !important;
            height: 42px;
            line-height: 42px;
        }

        .side-menu .layui-nav-child dd a:hover {
            background: rgba(255,255,255,.03);
        }

        .side-menu .layui-this > a,
        .side-menu .layui-nav-child dd.layui-this a {
            background: linear-gradient(90deg,#2563eb,#1d4ed8) !important;
            color: #fff !important;
        }

        /* =========================
           主区域 & 标签页轻量调整
        ========================= */
        .main {
            position: fixed;
            left: 220px;
            top: 60px;
            right: 0;
            bottom: 0;
            background: #f3f4f6;
        }

        .layui-tab {
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .layui-tab-title {
            height: 46px;
            background: #fff;
            border-bottom: 1px solid #ebeef5;
            padding-left: 10px;
        }

        .layui-tab-title li {
            line-height: 46px;
            font-size: 14px;
            color: #333;
            transition: all .2s;
        }

        /* 核心修改：当标签被选中时，底部呈现主题蓝色的小小指示线条 */
        .layui-tab-title li.layui-this {
            color: #2563eb !important;   /* 选中文字变蓝 */
            font-weight: 600;
        }
        .layui-tab-title .layui-this:after {
            border-bottom: 2px solid #2563eb !important; /* 底部蓝色小线条 */
        }

        .layui-tab-content {
            flex: 1;
            padding: 0;
            position: relative;
            background: #f3f4f6;
        }

        .layui-tab-item {
            height: 100%;
        }

        .admin-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* =========================
           用户信息区域
        ========================= */
        .user-info-area .layui-nav {
            background: transparent;
            padding: 0;
        }

        .user-info-area .layui-nav-item {
            line-height: 60px;
        }

        .user-info-area .layui-nav-item > a {
            color: #fff !important;
            padding: 0 12px !important;
            font-size: 14px;
        }

        .user-info-area .layui-nav-child a {
            color: #333 !important;
        }

        .logout-btn-icon {
            margin-right: 5px;
            color: #ff5722;
        }

        .pwd-btn-icon {
            margin-right: 5px;
            color: #1e9fff;
        }

        /* 修改密码弹窗 */
        .pwd-form-wrapper {
            padding: 22px 25px 5px 10px;
        }

        .layui-layer-content {
            overflow: hidden !important;
        }

        .user-info-area .layui-nav .layui-nav-item > a {
            padding-right: 30px !important;
            display: flex;
            align-items: center;
        }

        .user-info-area .layui-nav .layui-nav-item > a i.layui-icon-username {
            margin-right: 6px;
            font-size: 16px;
            vertical-align: middle;
        }

        .user-info-area .layui-nav .layui-nav-more {
            top: -4px !important;
            margin-top: 5px !important;
            right: 10px !important;
            border-top-color: rgba(255, 255, 255, 0.7) !important;
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3001;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: #2563eb;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        body {
            overflow: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .header,
        .header-meta,
        .logo-area {
            min-width: 0;
        }
        .header {
            height: auto !important;
            min-height: 52px;
            padding: 8px 12px !important;
            gap: 8px;
            flex-wrap: wrap;
            position: sticky !important;
            top: 0;
        }
        .logo-area {
            font-size: 15px !important;
        }
        .logo-icon {
            width: 30px !important;
            height: 30px !important;
            margin-right: 8px !important;
            font-size: 16px !important;
        }
        .side {
            top: 52px !important;
            left: 0 !important;
            width: min(82vw, 300px) !important;
            max-width: 300px;
            transform: translateX(-105%);
            transition: transform 0.2s ease;
            box-shadow: 10px 0 24px rgba(15, 23, 42, 0.22);
            z-index: 2000 !important;
        }
        body.onauth-mobile-nav-open .side {
            transform: translateX(0);
        }
        .main,
        .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        .ruoyi-tab-container {
            height: auto !important;
        }
        .ruoyi-tab-container .layui-tab-title,
        .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .ruoyi-tab-content-wrapper,
        .layui-tab-content,
        .layui-tab-item,
        .admin-iframe {
            min-height: 70vh;
            height: auto !important;
            position: relative !important;
        }
        .layui-form-item {
            margin-bottom: 14px;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        body.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>

<script>
layui.use(['element', 'jquery', 'layer', 'form'], function(){
    const $ = layui.$;
    const element = layui.element;
    const layer = layui.layer;
    const form = layui.form;

    $.ajaxSetup({
        complete: function(xhr) {
            if(xhr.status === 401) {
                window.top.location.href = '/login';
            }
        }
    });

    // =========================
    // 获取管理员信息
    // =========================
    function fetchAdminProfile() {
        $.ajax({
            url: '/admin/profile',
            type: 'GET',
            success: function(res){
                if(res.status === 'success') {
                    let displayName = res.nickname ? res.nickname : res.username;
                    $('#current-admin-name').text(displayName);
                    element.render('nav', 'headerNav');
                }
            },
            error: function() {
                $('#current-admin-name').text('未登录');
            }
        });
    }

    fetchAdminProfile();

    // =========================
    // Tab 管理
    // =========================
    $('.side-menu [data-url]').click(function(e){
        e.preventDefault();

        const url = $(this).attr('data-url');
        const id = $(this).attr('data-id');
        const title = $(this).attr('data-title');

        const isOpen = $(`.layui-tab-title li[lay-id="${id}"]`).length > 0;

        if(!isOpen) {
            element.tabAdd('mainTabs', {
                title: title,
                content: `<iframe class="admin-iframe" src="${url}"></iframe>`,
                id: id
            });
        }
        element.tabChange('mainTabs', id);
    });

    // =========================
    // Tab 切换联动菜单
    // =========================
    element.on('tab(mainTabs)', function(data){
        const layId = $(this).attr('lay-id');
        $('.side .side-menu .layui-this').removeClass('layui-this');

        const $targetA = $(`.side .side-menu [data-id="${layId}"]`);
        if($targetA.length > 0) {
            if($targetA.parents('dd').length > 0) {
                $targetA.parent('dd').addClass('layui-this');
            } else {
                $targetA.parent('li').addClass('layui-this');
            }
        }
    });

    // =========================
    // 退出登录
    // =========================
    function executeLogout(quietly, successMsg) {
        $.ajax({
            url: '/auth/logout',
            type: 'POST',
            complete: function(){
                layer.closeAll('loading');
                document.cookie = "sso_session_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

                if(!quietly) {
                    layer.msg(successMsg || '已安全退出', {
                        icon: 1,
                        time: 1500
                    }, function(){
                        window.location.href = '/login';
                    });
                } else {
                    window.location.href = '/login';
                }
            }
        });
    }

    // =========================
    // 表单验证
    // =========================
    form.verify({
        passLength: function(value){
            if(value.length < 6) {
                return '密码长度至少 6 位';
            }
        },
        passConfirm: function(value, item){
            const $form = $(item).closest('form');
            const newPwd = $form.find('.js-new-password').val();

            if(value !== newPwd) {
                return '两次输入的密码不一致';
            }
        }
    });

    // =========================
    // 修改密码
    // =========================
    $('#btn-change-password').click(function(e){
        e.preventDefault();

        let pwdIndex = layer.open({
            type: 1,
            title: '修改当前账户密码',
            area: ['440px','320px'],
            content: $('#pwd-dialog-template').html(),
            success: function(layero){
                form.render(null, 'pwdForm');
                layero.find('#btn-pwd-cancel').click(function(){
                    layer.close(pwdIndex);
                });
            }
        });

        form.on('submit(submitPwd)', function(data){
            layer.load(2);

            $.ajax({
                url: '/auth/change_password',
                type: 'POST',
                data: {
                    current_password: data.field.current_password,
                    new_password: data.field.new_password
                },
                success: function(res){
                    layer.closeAll('loading');
                    if(res.status === 'success') {
                        layer.close(pwdIndex);
                        layer.alert('密码修改成功，请重新登录', {
                            icon: 1,
                            title: '系统通知',
                            closeBtn: 0
                        }, function(){
                            layer.load(2);
                            executeLogout(true);
                        });
                    } else {
                        layer.msg(res.message || '修改失败', { icon: 2 });
                    }
                },
                error: function(xhr){
                    layer.closeAll('loading');
                    let errorMsg = '系统通信异常';
                    if(xhr.responseJSON && xhr.responseJSON.detail) {
                        errorMsg = xhr.responseJSON.detail;
                    }
                    layer.msg('修改失败：' + errorMsg, { icon: 2, time: 3000 });
                }
            });

            return false;
        });
    });

    // =========================
    // 安全退出确认
    // =========================
    $('#btn-logout').click(function(e){
        e.preventDefault();
        layer.confirm('确定退出当前系统吗？', {
            icon: 3,
            title: '系统提示'
        }, function(){
            layer.load(2);
            executeLogout(false, '退出成功');
        });
    });
});
</script>

<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.addEventListener("click", function () {
                document.body.classList.toggle("onauth-mobile-nav-open");
            });
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                document.body.classList.remove("onauth-mobile-nav-open");
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    document.body.classList.remove("onauth-mobile-nav-open");
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation">MENU</button>
</body>
</html>
