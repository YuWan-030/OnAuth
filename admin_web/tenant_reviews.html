<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间审核 - OnAuth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/css/layui.css">
    <style>
        body { margin: 0; padding: 16px; background: #f3f4f6; font-family: "Microsoft YaHei", sans-serif; }
        .card { background: #fff; border: 1px solid #ebeef5; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        .btn-theme { background: linear-gradient(135deg,#2563eb,#1d4ed8) !important; border: none !important; border-radius: 6px !important; }
        .btn-light { border-radius: 6px !important; }
        .layui-table th { background: #f8fafc !important; color: #475569 !important; }
        .form-box { padding: 14px 16px 0 6px; }
        .layui-form-label { width: 100px; }
        .layui-input-block { margin-left: 130px; }
        .tip { color: #64748b; font-size: 12px; line-height: 1.7; margin-top: 6px; }
        .expire-helper { color: #64748b; font-size: 12px; margin-top: 6px; line-height: 1.7; }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 3010;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(10px);
        cursor: pointer;
    }
    .onauth-burger,
    .onauth-burger::before,
    .onauth-burger::after {
        display: block;
        width: 16px;
        height: 2px;
        border-radius: 2px;
        background: #ffffff;
        content: "";
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .onauth-burger {
        position: relative;
        margin: 0 auto;
    }
    .onauth-burger::before {
        position: absolute;
        left: 0;
        top: -5px;
    }
    .onauth-burger::after {
        position: absolute;
        left: 0;
        top: 5px;
    }
    body.onauth-mobile-nav-open .onauth-burger {
        background: transparent;
    }
    body.onauth-mobile-nav-open .onauth-burger::before {
        top: 0;
        transform: rotate(45deg);
    }
    body.onauth-mobile-nav-open .onauth-burger::after {
        top: 0;
        transform: rotate(-45deg);
    }
    .onauth-mobile-mask {
        display: none;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area,
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: 52px !important;
            min-height: 52px;
            padding: 6px 10px 6px 50px !important;
            gap: 8px;
            flex-wrap: nowrap;
            align-items: center;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            flex: 1;
            max-width: calc(100% - 86px);
            font-size: 13px !important;
            line-height: 1;
        }
        body.onauth-shell .logo-area > div:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .logo-icon {
            width: 26px !important;
            height: 26px !important;
            margin-right: 6px !important;
            font-size: 14px !important;
        }
        body.onauth-shell .header-meta .pill,
        body.onauth-shell .tenant-user-area #tenant-name,
        body.onauth-shell .tenant-user-area #tenant-status,
        body.onauth-shell .user-info-area #tenant-pill {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item,
        body.onauth-shell .tenant-user-area .layui-nav-item {
            line-height: 32px !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a,
        body.onauth-shell .tenant-user-area .layui-nav-item > a {
            width: 36px !important;
            min-width: 36px !important;
            max-width: 36px !important;
            padding: 0 16px 0 4px !important;
            font-size: 12px !important;
            justify-content: center !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a span,
        body.onauth-shell .tenant-user-area .layui-nav-item > a span {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a i,
        body.onauth-shell .tenant-user-area .layui-nav-item > a i {
            margin-right: 0 !important;
        }
        body.onauth-shell .user-info-area .layui-nav .layui-nav-more,
        body.onauth-shell .tenant-user-area .layui-nav .layui-nav-more {
            right: 2px !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(74vw, 250px) !important;
            max-width: 250px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            box-shadow: 14px 0 28px rgba(15, 23, 42, 0.22);
            z-index: 3005 !important;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            background: rgba(31, 41, 55, 0.97) !important;
            backdrop-filter: blur(10px);
        }
        body.onauth-shell .side-menu {
            width: 100% !important;
        }
        body.onauth-shell .side-menu .layui-nav-item > a,
        body.onauth-shell .side-menu .layui-nav-child dd a {
            padding-left: 14px !important;
            font-size: 13px !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            height: 36px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li,
        body.onauth-shell .layui-tab-title li {
            line-height: 36px !important;
            height: 36px !important;
            padding: 0 10px !important;
            font-size: 13px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close,
        body.onauth-shell .layui-tab-title li .layui-tab-close {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            border-radius: 999px;
            color: #64748b !important;
            background: rgba(148, 163, 184, 0.18);
            font-size: 12px;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover,
        body.onauth-shell .layui-tab-title li .layui-tab-close:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.88);
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: calc(100vh - 100px);
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        body.onauth-shell .onauth-mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            z-index: 3003;
        }
        body.onauth-mobile-nav-open.onauth-shell .onauth-mobile-mask {
            display: block;
        }
        body.onauth-mobile-nav-open.onauth-shell {
            overflow: hidden !important;
        }
    }
</style>
</head>
<body>
<div class="card">
    <div style="display:flex; justify-content: space-between; align-items:center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
        <div>
            <div style="font-size: 16px; font-weight: 700; color: #0f172a;">租户空间审核中心</div>
            <div class="tip">仅超级管理员可处理。通过审核时必须填写到期时间。</div>
        </div>
        <button class="layui-btn btn-theme" id="btn-refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
    </div>
    <table class="layui-hide" id="reviewTable"></table>
</div>

<div id="reviewTpl" style="display:none;">
    <div class="layui-form form-box" lay-filter="reviewFormFilter">
        <div class="layui-form-item">
            <label class="layui-form-label">审核动作</label>
            <div class="layui-input-block">
                <input type="radio" name="action" value="approve" title="通过" checked>
                <input type="radio" name="action" value="reject" title="拒绝">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">到期时间</label>
            <div class="layui-input-block">
                <input type="text" name="expire_at" placeholder="例如 2026-12-31 23:59:59" class="layui-input">
                <div class="expire-helper">通过审核时请选择到期日期时间，不再支持直接输入天数。</div>
            </div>
        </div>
        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">审批备注</label>
            <div class="layui-input-block"><textarea name="review_note" placeholder="通过说明或拒绝原因" class="layui-textarea"></textarea></div>
        </div>
    </div>
</div>

<script type="text/html" id="rowTool">
{% raw %}
<div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
    <button class="layui-btn layui-btn-xs btn-light" lay-event="review">审核</button>
    <button class="layui-btn layui-btn-xs btn-light" lay-event="expire">续期</button>
</div>
{% endraw %}
</script>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.10/dist/layui.js"></script>
<script>
layui.use(['table','layer','form','laydate'], function(){
    const table = layui.table, layer = layui.layer, form = layui.form, laydate = layui.laydate, $ = layui.$;

    function loadTable(){
        table.render({
            elem: '#reviewTable',
            url: '/admin/groups/reviews/pending',
            page: false,
            parseData: function(res){
                const data = res.data || [];
                return {code: res.status === 'success' ? 0 : 500, msg: res.message || '', count: data.length, data: data};
            },
            cols: [[
                {field:'id', title:'ID', width:80, sort:true},
                {field:'group_name', title:'空间名称', minWidth:180},
                {field:'group_code', title:'识别码', width:150},
                {field:'owner', title:'申请人', width:140},
                {field:'status', title:'状态', width:110},
                {field:'expire_at', title:'到期时间', width:180},
                {field:'review_note', title:'备注', minWidth:180},
                {fixed:'right', title:'操作', toolbar:'#rowTool', width:180, align:'center'}
            ]]
        });
    }

    function submitReview(groupId, payload, onSuccess){
        $.ajax({
            url: `/admin/groups/${groupId}/review`,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function(res){
                if (res.status === 'success') {
                    layer.msg(res.message || '审核完成', {icon: 1});
                    if (onSuccess) onSuccess();
                    loadTable();
                } else {
                    layer.msg(res.message || '审核失败', {icon: 2});
                }
            },
            error: function(xhr){
                layer.msg(xhr.responseJSON?.detail || '审核失败', {icon: 2});
            }
        });
    }

    table.on('tool(reviewTable)', function(obj){
        const data = obj.data;
        if (obj.event === 'review') {
            layer.open({
                type: 1,
                title: `审核空间：${data.group_name}`,
                area: ['560px','420px'],
                content: $('#reviewTpl').html(),
                btn: ['提交审核','取消'],
                success: function(layero){
                    form.render(null, 'reviewFormFilter');
                    layero.find('input[name="expire_at"]').val(data.expire_at || '');
                    layero.find('textarea[name="review_note"]').val(data.review_note || '');
                    laydate.render({
                        elem: layero.find('input[name="expire_at"]')[0],
                        type: 'datetime',
                        format: 'yyyy-MM-dd HH:mm:ss',
                        trigger: 'click'
                    });
                },
                yes: function(index, layero){
                    const action = layero.find('input[name="action"]:checked').val();
                    let expireAt = layero.find('input[name="expire_at"]').val().trim();

                    if (action === 'approve') {
                        if (!expireAt) {
                            layer.msg('通过审核时必须填写到期时间', {icon: 2});
                            return false;
                        }
                        expireAt = expireAt.replace(' ', 'T');
                    }

                    const formData = {
                        action: action,
                        expire_at: action === 'approve' ? expireAt : '',
                        review_note: layero.find('textarea[name="review_note"]').val().trim()
                    };
                    submitReview(data.id, formData, function(){ layer.close(index); });
                }
            });
        }
        if (obj.event === 'expire') {
            layer.prompt({title: `为 ${data.group_name} 续期`, formType: 0, value: data.expire_at || ''}, function(value, index){
                if (!value.trim()) return layer.msg('到期时间不能为空', {icon: 2});
                $.ajax({
                    url: `/admin/groups/${data.id}/expire?expire_at=${encodeURIComponent(value.trim())}`,
                    type: 'PUT',
                    success: function(res){
                        if (res.status === 'success') {
                            layer.msg(res.message || '续期成功', {icon: 1});
                            layer.close(index);
                            loadTable();
                        } else {
                            layer.msg(res.message || '续期失败', {icon: 2});
                        }
                    },
                    error: function(xhr){
                        layer.msg(xhr.responseJSON?.detail || '续期失败', {icon: 2});
                    }
                });
            });
        }
    });

    $('#btn-refresh').on('click', loadTable);
    loadTable();
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            var mask = document.createElement("div");
            mask.className = "onauth-mobile-mask";
            document.body.appendChild(mask);
            function closeMobileNav() {
                document.body.classList.remove("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
            function toggleMobileNav() {
                var willOpen = !document.body.classList.contains("onauth-mobile-nav-open");
                document.body.classList.toggle("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.addEventListener("click", toggleMobileNav);
            mask.addEventListener("click", closeMobileNav);
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                closeMobileNav();
            });
            side.addEventListener("click", function (evt) {
                // Only collapse drawer when a child menu item is clicked.
                var childMenuLink = evt.target.closest(".layui-nav-child dd a");
                if (childMenuLink) {
                    closeMobileNav();
                }
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    closeMobileNav();
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation"><span class="onauth-burger" aria-hidden="true"></span></button>
</body>
</html>
