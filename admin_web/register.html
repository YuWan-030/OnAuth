<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>注册租户管理员/使用者 - OnAuth 云中台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/css/layui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.0/layui.js"></script>
    <style>
        /* ==========================================================================
           全屏星空灰背景与垂直居中容器（与登录页严密对齐）
           ========================================================================== */
        body {
            background: radial-gradient(circle at 50% 50%, #f8fafc, #e2e8f0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 注册卡片：高级扁平化无边框，带高阶柔和阴影 */
        .reg-container {
            width: 360px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #ebeef5;
        }

        /* 注册舱主标题 */
        .reg-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        /* 表单单元间距微调 */
        .layui-form-item { margin-bottom: 20px; position: relative; }

        /* ==========================================================================
           输入场与内置图标加工
           ========================================================================== */
        .layui-input {
            border-radius: 6px !important;
            border-color: #cbd5e1 !important;
            height: 42px;
            padding-left: 38px !important; /* 给前置图标预留空间 */
            transition: all 0.2s ease-in-out;
            font-size: 14px;
        }
        .layui-input:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15) !important;
        }

        /* 输入框内衬前置微图标 */
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            z-index: 10;
            pointer-events: none;
        }

        /* ==========================================================================
           动作按钮与底部返回链路
           ========================================================================== */
        /* 中台主色：高级渐变蓝注册动作按钮 */
        .btn-reg-theme {
            background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 14px !important;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-reg-theme:hover { opacity: 0.95; color: #fff !important; }
        .btn-reg-theme:active { transform: scale(0.98); }

        /* 底部流转区域 */
        .link-back {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .link-back a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .link-back a:hover {
            color: #2563eb;
        }
    </style>
<style>
    /* onauth-global-mobile-adapt */
    .onauth-version-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3000;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #e5e7eb;
        background: rgba(17, 24, 39, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(6px);
        pointer-events: none;
    }
    .onauth-mobile-nav-toggle {
        display: none;
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 3010;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(10px);
        cursor: pointer;
    }
    .onauth-burger,
    .onauth-burger::before,
    .onauth-burger::after {
        display: block;
        width: 16px;
        height: 2px;
        border-radius: 2px;
        background: #ffffff;
        content: "";
        transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .onauth-burger {
        position: relative;
        margin: 0 auto;
    }
    .onauth-burger::before {
        position: absolute;
        left: 0;
        top: -5px;
    }
    .onauth-burger::after {
        position: absolute;
        left: 0;
        top: 5px;
    }
    body.onauth-mobile-nav-open .onauth-burger {
        background: transparent;
    }
    body.onauth-mobile-nav-open .onauth-burger::before {
        top: 0;
        transform: rotate(45deg);
    }
    body.onauth-mobile-nav-open .onauth-burger::after {
        top: 0;
        transform: rotate(-45deg);
    }
    .onauth-mobile-mask {
        display: none;
    }
    @media (max-width: 768px) {
        body {
            overflow-x: hidden !important;
            overflow-y: auto !important;
            -webkit-text-size-adjust: 100%;
        }
        .onauth-version-badge {
            right: 8px;
            bottom: 8px;
            font-size: 11px;
        }
        .layui-layer {
            max-width: 94vw !important;
            left: 3vw !important;
        }
        .layui-table-view {
            overflow-x: auto;
        }
        .layui-form-label {
            width: 100% !important;
            text-align: left !important;
            padding: 0 0 6px !important;
        }
        .layui-input-block,
        .layui-input-inline,
        .layui-form-mid {
            margin-left: 0 !important;
            width: 100% !important;
        }
        .login-container,
        .reg-container,
        .container,
        .card {
            width: min(94vw, 460px) !important;
            max-width: 94vw !important;
            padding: 20px !important;
            border-radius: 16px !important;
        }
        body.onauth-shell .header,
        body.onauth-shell .header-meta,
        body.onauth-shell .logo-area,
        body.onauth-shell .user-info-area,
        body.onauth-shell .tenant-user-area {
            min-width: 0;
        }
        body.onauth-shell .header {
            height: 52px !important;
            min-height: 52px;
            padding: 6px 10px 6px 50px !important;
            gap: 8px;
            flex-wrap: nowrap;
            align-items: center;
            position: sticky !important;
            top: 0;
        }
        body.onauth-shell .logo-area {
            flex: 1;
            max-width: calc(100% - 86px);
            font-size: 13px !important;
            line-height: 1;
        }
        body.onauth-shell .logo-area > div:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body.onauth-shell .logo-icon {
            width: 26px !important;
            height: 26px !important;
            margin-right: 6px !important;
            font-size: 14px !important;
        }
        body.onauth-shell .header-meta .pill,
        body.onauth-shell .tenant-user-area #tenant-name,
        body.onauth-shell .tenant-user-area #tenant-status,
        body.onauth-shell .user-info-area #tenant-pill {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item,
        body.onauth-shell .tenant-user-area .layui-nav-item {
            line-height: 32px !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a,
        body.onauth-shell .tenant-user-area .layui-nav-item > a {
            width: 36px !important;
            min-width: 36px !important;
            max-width: 36px !important;
            padding: 0 16px 0 4px !important;
            font-size: 12px !important;
            justify-content: center !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a span,
        body.onauth-shell .tenant-user-area .layui-nav-item > a span {
            display: none !important;
        }
        body.onauth-shell .user-info-area .layui-nav-item > a i,
        body.onauth-shell .tenant-user-area .layui-nav-item > a i {
            margin-right: 0 !important;
        }
        body.onauth-shell .user-info-area .layui-nav .layui-nav-more,
        body.onauth-shell .tenant-user-area .layui-nav .layui-nav-more {
            right: 2px !important;
        }
        body.onauth-shell .side {
            top: 52px !important;
            left: 0 !important;
            width: min(74vw, 250px) !important;
            max-width: 250px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            box-shadow: 14px 0 28px rgba(15, 23, 42, 0.22);
            z-index: 3005 !important;
            border-top-right-radius: 16px;
            border-bottom-right-radius: 16px;
            background: rgba(31, 41, 55, 0.97) !important;
            backdrop-filter: blur(10px);
        }
        body.onauth-shell .side-menu {
            width: 100% !important;
        }
        body.onauth-shell .side-menu .layui-nav-item > a,
        body.onauth-shell .side-menu .layui-nav-child dd a {
            padding-left: 14px !important;
            font-size: 13px !important;
        }
        body.onauth-mobile-nav-open.onauth-shell .side {
            transform: translateX(0);
        }
        body.onauth-shell .main,
        body.onauth-shell .main-body {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: auto !important;
            min-height: calc(100vh - 52px);
        }
        body.onauth-shell .ruoyi-tab-container {
            height: auto !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title,
        body.onauth-shell .layui-tab-title {
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            height: 36px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li,
        body.onauth-shell .layui-tab-title li {
            line-height: 36px !important;
            height: 36px !important;
            padding: 0 10px !important;
            font-size: 13px !important;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close,
        body.onauth-shell .layui-tab-title li .layui-tab-close {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            border-radius: 999px;
            color: #64748b !important;
            background: rgba(148, 163, 184, 0.18);
            font-size: 12px;
        }
        body.onauth-shell .ruoyi-tab-container .layui-tab-title li .layui-tab-close:hover,
        body.onauth-shell .layui-tab-title li .layui-tab-close:hover {
            color: #ffffff !important;
            background: rgba(239, 68, 68, 0.88);
        }
        body.onauth-shell .ruoyi-tab-content-wrapper,
        body.onauth-shell .layui-tab-content,
        body.onauth-shell .layui-tab-item,
        body.onauth-shell .admin-iframe {
            min-height: calc(100vh - 100px);
            height: auto !important;
        }
        body.onauth-shell.onauth-has-side .onauth-mobile-nav-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        body.onauth-shell .onauth-mobile-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            z-index: 3003;
        }
        body.onauth-mobile-nav-open.onauth-shell .onauth-mobile-mask {
            display: block;
        }
        body.onauth-mobile-nav-open.onauth-shell {
            overflow: hidden !important;
        }
    }
</style>
</head>
<body>

<div class="reg-container">
    <div class="reg-title">📝 注册租户管理员/使用者</div>

    <form class="layui-form">
        <div class="layui-form-item" style="margin-bottom: 16px;">
            <label class="layui-form-label" style="width: 90px; padding: 9px 0;">注册类型</label>
            <div class="layui-input-block" style="margin-left: 100px;">
                <input type="radio" name="register_type" value="tenant_admin" title="租户管理员" lay-filter="registerType" checked>
                <input type="radio" name="register_type" value="user" title="普通使用者" lay-filter="registerType">
            </div>
        </div>

        <!-- 设定账户域 -->
        <div class="layui-form-item">
            <i class="layui-icon layui-icon-username input-icon"></i>
            <input type="text" name="username" lay-verify="required" lay-reqtext="请设定席位账户名" placeholder="设定账户名" class="layui-input" autocomplete="off">
        </div>

        <!-- 设定密码域 -->
        <div class="layui-form-item">
            <i class="layui-icon layui-icon-password input-icon"></i>
            <input type="password" name="password" lay-verify="required" lay-reqtext="请设定登录凭证密码" placeholder="设定登录密码" class="layui-input" autocomplete="off">
        </div>

        <div id="tenantAdminFields">
            <div class="layui-form-item">
                <i class="layui-icon layui-icon-group input-icon"></i>
                <input type="text" name="group_name" lay-verify="required" lay-reqtext="请输入租户空间名称" placeholder="租户空间名称" class="layui-input" autocomplete="off">
            </div>
            <div class="layui-form-item">
                <i class="layui-icon layui-icon-about input-icon"></i>
                <input type="text" name="group_description" placeholder="租户空间说明(可选)" class="layui-input" autocomplete="off">
            </div>
        </div>

        <div id="tenantUserFields" style="display: none;">
            <div class="layui-form-item">
                <i class="layui-icon layui-icon-key input-icon"></i>
                <input type="text" name="group_code" lay-verify="required" lay-reqtext="请输入租户空间识别码" placeholder="租户空间识别码" class="layui-input" autocomplete="off">
            </div>
        </div>

        <!-- 提交注册申请 -->
        <div class="layui-form-item" style="margin-top: 26px; margin-bottom: 5px;">
            <button class="layui-btn layui-btn-fluid btn-reg-theme" lay-submit lay-filter="doRegister">立即注册新席位</button>
        </div>

        <!-- 返回登录流转 -->
        <div class="link-back">
            <a href="/login">已有授信席位？返回中台登录</a>
        </div>
    </form>
</div>

<script>
    layui.use(['form', 'layer'], function(){
    var form = layui.form, layer = layui.layer, $ = layui.$;

        function toggleFields(type) {
            if (type === 'tenant_admin') {
                $('#tenantAdminFields').show();
                $('#tenantUserFields').hide();
                $('input[name="group_name"]').attr('lay-verify', 'required');
                $('input[name="group_code"]').removeAttr('lay-verify');
            } else {
                $('#tenantAdminFields').hide();
                $('#tenantUserFields').show();
                $('input[name="group_name"]').removeAttr('lay-verify');
                $('input[name="group_code"]').attr('lay-verify', 'required');
            }
        }

        form.on('radio(registerType)', function(data){
            toggleFields(data.value);
        });

        toggleFields('tenant_admin');

    // 监听网络凭证注册提交
    form.on('submit(doRegister)', function(data){
        const loading = layer.load(2);
            const isTenantAdmin = data.field.register_type === 'tenant_admin';
            const submitUrl = isTenantAdmin ? '/auth/register/tenant_admin' : '/auth/register';

        $.ajax({
                url: submitUrl,
            type: 'POST',
            data: JSON.stringify(data.field),
            contentType: 'application/json',
            success: function(res){
                layer.close(loading);
                    if (isTenantAdmin && res.group_code) {
                        const msgHtml = '租户管理员注册成功！<br>空间识别码：<b>' + res.group_code + '</b><br>请妥善保存用于注册使用者账号。';
                        layer.alert(msgHtml, {icon: 1}, function(){
                            window.location.href = '/login';
                        });
                    } else {
                        layer.msg('账号注册成功！', {icon: 1, time: 1200}, function(){
                            window.location.href = '/login';
                        });
                    }
            },
            error: function(err){
                layer.close(loading);
                // 增加防御性容错，防止后端返回非标 JSON 导致前端报错
                var errMsg = err.responseJSON?.detail || err.responseJSON?.message || '注册失败，账户可能已被占用或格式不合规';
                layer.msg(errMsg, {icon: 2, shift: 6});
            }
        });
        return false;
    });
});
</script>
<script>
    /* onauth-global-ui */
    (function () {
        function initOnAuthGlobalUi() {
            var versionText = "{{ APP_VERSION }}";
            var badge = document.getElementById("onauth-version-badge");
            var toggleBtn = document.getElementById("onauth-mobile-nav-toggle");
            if (badge) {
                badge.textContent = versionText;
            }
            // Requirement: hide version icon on the three /index entries.
            var path = (window.location.pathname || "").replace(/\/+$/, "") || "/";
            if (path === "/index" && badge) {
                badge.style.display = "none";
            }
            var side = document.querySelector(".side");
            var hasShell = !!(side && (document.querySelector(".main") || document.querySelector(".main-body")));
            if (hasShell) {
                document.body.classList.add("onauth-shell");
            }
            if (!side || !toggleBtn) {
                if (toggleBtn) {
                    toggleBtn.style.display = "none";
                }
                return;
            }
            var mask = document.createElement("div");
            mask.className = "onauth-mobile-mask";
            document.body.appendChild(mask);
            function closeMobileNav() {
                document.body.classList.remove("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
            function toggleMobileNav() {
                var willOpen = !document.body.classList.contains("onauth-mobile-nav-open");
                document.body.classList.toggle("onauth-mobile-nav-open");
                toggleBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
            }
            document.body.classList.add("onauth-has-side");
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.addEventListener("click", toggleMobileNav);
            mask.addEventListener("click", closeMobileNav);
            document.addEventListener("click", function (evt) {
                if (!document.body.classList.contains("onauth-mobile-nav-open")) {
                    return;
                }
                if (side.contains(evt.target) || toggleBtn.contains(evt.target)) {
                    return;
                }
                closeMobileNav();
            });
            side.addEventListener("click", function (evt) {
                // Only collapse drawer when a child menu item is clicked.
                var childMenuLink = evt.target.closest(".layui-nav-child dd a");
                if (childMenuLink) {
                    closeMobileNav();
                }
            });
            window.addEventListener("resize", function () {
                if (window.innerWidth > 768) {
                    closeMobileNav();
                }
            });
        }
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initOnAuthGlobalUi);
        } else {
            initOnAuthGlobalUi();
        }
    })();
</script>
<div id="onauth-version-badge" class="onauth-version-badge">{{ APP_VERSION }}</div>
<button id="onauth-mobile-nav-toggle" class="onauth-mobile-nav-toggle" type="button" aria-label="Toggle navigation"><span class="onauth-burger" aria-hidden="true"></span></button>
</body>
</html>
